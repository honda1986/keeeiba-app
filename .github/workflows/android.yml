name: Androidアプリを作る

# android/ の中身から個人用の APK を作り、リリース「apk」に置く(スマホからダウンロードして入れる)。
#   https://github.com/honda1986/keeeiba-app/releases/download/apk/keiba.apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

concurrency:
  group: android

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK を作る
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk keiba.apk
          ls -la keiba.apk
      - name: リリース「apk」に置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Androidアプリ(個人用)" \
            --notes "2強レースの個人用アプリ。keiba.apk をスマホでダウンロードして入れる。" --latest=false
          gh release upload apk keiba.apk --clobber
          gh release edit apk --notes "2強レースの個人用アプリ 1.0.${{ github.run_number }}(${{ github.sha }})。keiba.apk をスマホでダウンロードして入れる。"
