name: サイトを読む(一時)

# 指定したカテゴリの記事を全部たどって本文をログに出す。何も保存しない。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list(記事のURLを出す) か read(1記事を読む)'
        required: true
        default: 'list'
      url:
        description: 'URL'
        required: true
      filter:
        description: 'list のとき、題名の正規表現'
        required: false
        default: '.'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/read_site.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.url }}" "${{ github.event.inputs.filter }}"
