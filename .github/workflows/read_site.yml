name: 記事を読む(コース傾向の更新用)

# 記事の本文をログに出すだけ(何も保存しない)。keiba_course.json を作り直すときに使う。
#   list … カテゴリをたどって記事のURLを出す / read … 記事(複数可、空白区切り)の本文を出す
# 直接読めない(海外からのアクセス制限)ときは Wayback Machine から読む。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list(記事のURLを出す) か read(記事を読む) か links(ページ内のリンクを出す)'
        required: true
        default: 'list'
      url:
        description: 'URL'
        required: true
      filter:
        description: 'list のとき、題名の正規表現'
        required: false
        default: '.'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/read_site.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.url }}" "${{ github.event.inputs.filter }}"
