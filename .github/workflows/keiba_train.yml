name: モデルを学び直す

# 3着以内の確率モデル(keiba_model.txt)を、それまでの結果すべてで学び直す。
# 毎週月曜の朝に自動で。手動で walkforward を on にすると、過去の日の予想も
# 「その月より前だけで学んだモデル」で作り直す(収支の画面が先の結果を知らない成績になる)。

on:
  workflow_dispatch:
    inputs:
      walkforward:
        description: '過去の日の予想も作り直す(on / off)'
        required: false
        default: 'off'
      site:
        description: 'jra(中央) / kochi(高知の最終レースのアプリ。keiba/kochi のデータで keiba_model_kochi.txt を作る)'
        required: false
        default: 'jra'
  schedule:
    - cron: '7 21 * * 0'        # 月曜 6:07(JST)

concurrency:
  group: keiba-backfill

# 高知は保存先・対象の場・モデルのファイルを中央と分ける(時刻指定で動くときは中央)
env:
  KEIBA_CENTERS: ${{ github.event.inputs.site == 'kochi' && 'nar' || 'jra' }}
  KEIBA_NAR_VENUES: ${{ github.event.inputs.site == 'kochi' && '高知' || '' }}
  KEIBA_OUT: ${{ github.event.inputs.site == 'kochi' && 'keiba/kochi' || 'keiba' }}
  KEIBA_MODEL_TAG: ${{ github.event.inputs.site == 'kochi' && 'kochi' || '' }}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 numpy lightgbm
      - run: python -m unittest test_keiba
      - name: 学び直して保存
        env:
          WF: ${{ github.event.inputs.walkforward }}
          KEIBA_CACHE: /tmp/keiba_dataset.pkl
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ARGS="--save --rebuild"
          [ "$WF" = "on" ] && ARGS="$ARGS --walkforward"
          python tools/train_model.py $ARGS | tee train.log
          if [ "$WF" = "on" ]; then
            python keiba.py --repredict
          fi
          T=${KEIBA_MODEL_TAG:+_$KEIBA_MODEL_TAG}      # 高知は _kochi
          for k in 1 2 3; do
            git add keiba_model$T.txt keiba_model${T}_meta.json keiba_speed$T.json $KEIBA_OUT/model_wf.json.gz $KEIBA_OUT/days $KEIBA_OUT/history.json 2>/dev/null
            if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
            git commit -q -m "keiba: モデルを学び直す"
            if git pull --rebase -X ours -q origin main; then
              # 当日の更新を取り込んだので集計を作り直す
              python keiba.py --history-only
              git add $KEIBA_OUT/history.json
              git diff --cached --quiet || git commit -q -m "keiba: 集計を作り直す"
              git push -q origin HEAD:main && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep 10
          done
          exit 1
