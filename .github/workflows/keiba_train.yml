name: モデルを学び直す

# 3着以内の確率モデル(keiba_model.txt)を、それまでの結果すべてで学び直す。
# 毎週月曜の朝に自動で。手動で walkforward を on にすると、過去の日の予想も
# 「その月より前だけで学んだモデル」で作り直す(収支の画面が先の結果を知らない成績になる)。

on:
  workflow_dispatch:
    inputs:
      walkforward:
        description: '過去の日の予想も作り直す(on / off)'
        required: false
        default: 'off'
      site:
        description: 'jra(中央) / kochi(高知の最終レースのアプリ。keiba/kochi のデータで keiba_model_kochi.txt を作る)'
        required: false
        default: 'jra'
  schedule:
    - cron: '7 21 * * 0'        # 月曜 6:07(JST)

concurrency:
  group: keiba-backfill

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150     # 種を変えて何本か学ぶので、月ごとの学び直し(walkforward)は長い
    # 時刻指定(毎週月曜)は中央と高知の両方を順に。手で動かすときは site の1つ
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJSON(github.event_name == 'schedule' && '["jra","kochi"]' || format('["{0}"]', github.event.inputs.site || 'jra')) }}
    # 高知は保存先・対象の場・モデルのファイルを中央と分ける
    env:
      KEIBA_CENTERS: ${{ matrix.site == 'kochi' && 'nar' || 'jra' }}
      KEIBA_NAR_VENUES: ${{ matrix.site == 'kochi' && '高知' || '' }}
      KEIBA_OUT: ${{ matrix.site == 'kochi' && 'keiba/kochi' || 'keiba' }}
      KEIBA_MODEL_TAG: ${{ matrix.site == 'kochi' && 'kochi' || '' }}
      KEIBA_PREDICT_ONLY: ${{ matrix.site == 'kochi' && '1' || '' }}
      # 中央は乱数の種を変えた4本を学び、予想はその平均(1本だと学び直すたびに買うレースが1/4ほど入れ替わる。
      # tools/experiments/ensemble_wf.py)。高知は1本のまま
      KEIBA_SEEDS: ${{ matrix.site == 'kochi' && '1' || '1,2,3,4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 numpy lightgbm
      - name: テスト(中央の設定で)
        run: KEIBA_CENTERS=jra KEIBA_NAR_VENUES= KEIBA_OUT=keiba KEIBA_MODEL_TAG= KEIBA_PREDICT_ONLY= python -m unittest test_keiba
      - name: 学び直して保存
        env:
          WF: ${{ github.event.inputs.walkforward }}
          KEIBA_CACHE: /tmp/keiba_dataset.pkl
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ARGS="--save --rebuild"
          [ "$WF" = "on" ] && ARGS="$ARGS --walkforward"
          python tools/train_model.py $ARGS | tee train.log
          if [ "$WF" = "on" ]; then
            python keiba.py --repredict
          fi
          # 高知は最終レース用の確率の式も作り直す(keiba_final.py が使う)
          [ "$KEIBA_OUT" = "keiba/kochi" ] && python tools/kochi_final_fit.py
          # 中央は荒れ度(1番人気が3着に来ない確率)の式も(アプリが出す。参考)
          if [ "$KEIBA_OUT" = "keiba" ]; then python tools/chaos_fit.py || echo "荒れ度の式を作れなかった(前のまま)"; fi
          T=${KEIBA_MODEL_TAG:+_$KEIBA_MODEL_TAG}      # 高知は _kochi
          for k in 1 2 3; do
            # あるものだけ足す(無いファイルを1つでも渡すと git add が全部やめてしまう)
            # 種を変えた2本目からのモデル(keiba_model_s2.txt など)。使わなくなって消したものも
            git ls-files -d -- "keiba_model${T}_s*.txt" | xargs -r git rm -q --cached
            for f in keiba_model$T.txt keiba_model${T}_s*.txt keiba_model${T}_meta.json keiba_speed$T.json $KEIBA_OUT/model_wf.json.gz $KEIBA_OUT/final_model.json $KEIBA_OUT/chaos_model.json $KEIBA_OUT/days $KEIBA_OUT/history.json; do
              [ -e "$f" ] && git add "$f"
            done
            if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
            git commit -q -m "keiba: モデルを学び直す"
            if git pull --rebase -X ours -q origin main; then
              # 当日の更新を取り込んだので集計を作り直す
              python keiba.py --history-only
              git add $KEIBA_OUT/history.json
              git diff --cached --quiet || git commit -q -m "keiba: 集計を作り直す"
              git push -q origin HEAD:main && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep 10
          done
          exit 1
