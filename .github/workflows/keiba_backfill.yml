name: 過去の日を再現

# 過去の日のレースを、その日の出馬表と「そのレースより前の過去走」だけで予想し、結果・払戻と照合する。
# 速く取るために、日付を最大 jobs 個のジョブに分けて同時に走らせ(別々のマシン)、
# 各ジョブの中でも1日のレースを workers 本ずつ並列に取る。最後に1回だけまとめて保存する。
# 済んだ日は飛ばすので、途中で止まってももう一度まわせば続きから再現する。
# 予想には「再現」と印が付き、当日の予想とは分けて集計できる。人気は確定人気を使う。

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'いちばん古い日 YYYYMMDD'
        required: false
        default: '20240101'
      end:
        description: 'いちばん新しい日 YYYYMMDD(空で昨日)'
        required: false
        default: ''
      jobs:
        description: '同時に走らせるジョブの数(最大20)'
        required: false
        default: '20'
      workers:
        description: '1ジョブで同時に取るレースの数'
        required: false
        default: '6'
      mode:
        description: 'predict(予想と結果を再現) / past(馬柱だけを今の読み方で取り直す) / result(結果・払戻だけを取り直す) / odds(ワイドの確定オッズだけを取る)'
        required: false
        default: 'predict'

concurrency:
  group: keiba-backfill

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          JOBS: ${{ github.event.inputs.jobs }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          jst = timezone(timedelta(hours=9))
          start = os.environ.get("START") or "20240101"
          end = os.environ.get("END") or (datetime.now(jst) - timedelta(days=1)).strftime("%Y%m%d")
          n = max(1, min(20, int(os.environ.get("JOBS") or 20)))
          todo, d = [], datetime.strptime(end, "%Y%m%d")
          while d.strftime("%Y%m%d") >= start:
              s = d.strftime("%Y%m%d")
              try:
                  day = json.load(open("keiba/days/%s.json" % s))
                  if os.environ.get("MODE") == "result":
                      # 払戻表に馬単が無いレースが残っている日だけ(中央だけ。地方は2026-10-21にやめた)
                      done = all("馬単" in (r.get("result") or {}).get("payout", {}) for r in day["races"].values()
                                 if (r.get("result") or {}).get("payout") and int(r["id"][4:6]) < 30)
                  elif os.environ.get("MODE") == "odds":
                      # ワイドの確定オッズが無い中央のレースが残っている日だけ
                      done = all(r.get("wide_final") for r in day["races"].values()
                                 if r.get("result") and int(r["id"][4:6]) < 30)
                  elif os.environ.get("MODE") == "past":
                      # 馬柱の読み方が古いレースが残っている日だけ
                      import re
                      ver = int(re.search(r"PAST_VER = (\d+)", open("keiba.py").read()).group(1))
                      done = all(r.get("past_ver") == ver for r in day["races"].values()
                                 if r.get("horses") and int(r["id"][4:6]) < 30)
                  else:
                      done = day.get("complete")
              except Exception:
                  done = os.environ.get("MODE") in ("past", "result", "odds")
              if not done:
                  todo.append(s)
              d -= timedelta(days=1)
          # 日付を交互に配る(中央のある土日が1つのジョブに偏らないように)
          chunks = [{"i": i, "dates": ",".join(todo[i::n])} for i in range(n) if todo[i::n]]
          print("再現する日", len(todo), "ジョブ", len(chunks))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("chunks=" + json.dumps(chunks) + "\n")
          PY

  fetch:
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 numpy lightgbm
      - name: 再現する
        timeout-minutes: 300
        continue-on-error: true
        run: |
          EXTRA=""
          [ "${{ github.event.inputs.mode }}" = "past" ] && EXTRA="--refetch-past"
          [ "${{ github.event.inputs.mode }}" = "result" ] && EXTRA="--refetch-result"
          [ "${{ github.event.inputs.mode }}" = "odds" ] && EXTRA="--refetch-odds"
          python keiba.py --backfill-dates "${{ matrix.chunk.dates }}" --workers "${{ github.event.inputs.workers || 6 }}" --no-history $EXTRA
      - name: このジョブの日だけを渡す
        if: always()
        run: |
          mkdir -p out/days out/past
          for d in $(echo "${{ matrix.chunk.dates }}" | tr ',' ' '); do
            [ -f keiba/days/$d.json ] && cp keiba/days/$d.json out/days/
            [ -f keiba/past/$d.json.gz ] && cp keiba/past/$d.json.gz out/past/
          done
          ls out/days | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: days-${{ matrix.chunk.i }}
          path: out/
          retention-days: 2

  merge:
    needs: fetch
    if: always() && needs.fetch.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          pattern: days-*
          merge-multiple: true
          path: incoming
      - name: まとめて保存
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for k in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p keiba/days keiba/past
            cp incoming/days/*.json keiba/days/ 2>/dev/null || true
            cp incoming/past/*.json.gz keiba/past/ 2>/dev/null || true
            python keiba.py --history-only
            git add keiba/days keiba/past keiba/history.json
            if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
            git commit -q -m "keiba: 過去の日を再現($(ls incoming/days | wc -l)日)"
            git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
