<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>競馬 2強レース</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f3ef; --surface:#ffffff; --surface2:#f8f7f4; --line:#e4e2dc; --line2:#cfccc3;
  --ink:#16181c; --ink2:#4b4f57; --muted:#767b83;
  --accent:#9a5f00; --accent-bg:#fff1d1; --accent-line:#efc66d;
  --pos:#1c5cab; --pos-bg:#e3eefb; --neg:#c22f2f; --neg-bg:#fbe7e6;
  --good:#0b6e0b; --good-bg:#e2f3e2;
  --shadow:0 1px 2px rgba(20,20,20,.06);
  --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101318; --surface:#181c23; --surface2:#1e232c; --line:#2a303b; --line2:#3d4451;
    --ink:#eeece7; --ink2:#bcc2cc; --muted:#8c939e;
    --accent:#efb54c; --accent-bg:#3a2d12; --accent-line:#6e5420;
    --pos:#7fb2f0; --pos-bg:#1d3150; --neg:#f08a8a; --neg-bg:#3d2020;
    --good:#5bd35b; --good-bg:#16301a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101318; --surface:#181c23; --surface2:#1e232c; --line:#2a303b; --line2:#3d4451;
  --ink:#eeece7; --ink2:#bcc2cc; --muted:#8c939e;
  --accent:#efb54c; --accent-bg:#3a2d12; --accent-line:#6e5420;
  --pos:#7fb2f0; --pos-bg:#1d3150; --neg:#f08a8a; --neg-bg:#3d2020;
  --good:#5bd35b; --good-bg:#16301a;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;
  line-height:1.55;padding-bottom:calc(72px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--pos);outline-offset:2px;border-radius:4px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .good{color:var(--good)}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.brand{font-weight:800;font-size:18px}
.brand small{font-weight:600;font-size:11px;color:var(--muted);margin-left:6px}
.stamp{margin-left:auto;font-size:11px;color:var(--muted);text-align:right;line-height:1.35}
.themeb{flex:none;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);
  font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:640px;margin:0 auto;display:flex}
.tabbar button{flex:1;padding:12px 0 11px;font-size:13px;font-weight:700;color:var(--muted)}
.tabbar button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}
.datenav{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.datenav button{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav .d{flex:1;text-align:center;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.tile .k{font-size:11px;color:var(--muted);font-weight:600}
.tile .v{font-size:20px;font-weight:800;white-space:nowrap}
.tile .v.long{font-size:16px}
button.tile{width:100%;text-align:left}
button.tile .k::after{content:" ›"}
button.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tbl.nw td,.tbl.nw th{white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--ink2);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.card.buyA{border-color:var(--accent-line)}
.ch{padding:12px 14px 10px;display:flex;gap:10px;align-items:flex-start}
.ch .t{flex:1;min-width:0}
.ch .t b{font-size:16px}
.ch .meta{font-size:12px;color:var(--muted)}
.badge{flex:none;min-width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px}
.badge.A{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line)}
.badge.B{background:var(--pos-bg);color:var(--pos)}
.badge.S{background:var(--surface2);color:var(--muted);font-size:11px;padding:0 6px}
.axis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 10px}
.ax{background:var(--surface2);border-radius:10px;padding:8px 10px;min-width:0}
.ax .m{font-weight:800;margin-right:4px}
.ax .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ax .s{font-size:12px;color:var(--muted)}
.note{padding:0 14px 8px;font-size:12px;color:var(--ink2)}
.note div::before{content:"・"}
.bets{border-top:1px solid var(--line);padding:10px 14px}
.bet{display:flex;gap:8px;font-size:13px;padding:3px 0;align-items:baseline}
.bet .ty{flex:none;width:58px;font-weight:700}
.bet .cb{flex:1;min-width:0;font-variant-numeric:tabular-nums;word-break:break-all}
.bet .pt{flex:none;color:var(--muted);font-size:12px;text-align:right}
.bet.hit .ty,.bet.hit .cb{color:var(--good)}
.bet .role{display:block;font-size:11px;color:var(--muted)}
.total{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.res{padding:8px 14px;font-size:13px;background:var(--surface2);border-top:1px solid var(--line)}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.more{border-top:1px solid var(--line)}
.more>summary{padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink2)}
.more>summary::after{content:" ▾";color:var(--muted)}
.more[open]>summary::after{content:" ▴"}
.hs{width:100%;border-collapse:collapse;font-size:12.5px}
.hs th{font-size:11px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.hs td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.hs td.nm{overflow-wrap:anywhere}
.hs td.nm .muted{white-space:nowrap}
.hs .tag{white-space:normal}
.hs .odds{white-space:nowrap;text-align:right}
.hs tr.cut td{opacity:.55}
.hs .mk{font-weight:800;font-size:14px;width:18px}
.hs .sc{text-align:right;font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;margin:1px 2px 1px 0;line-height:18px;white-space:nowrap}
.tag.m{background:var(--neg-bg);color:var(--neg)}
.tag.p{background:var(--good-bg);color:var(--good)}
.tag.o{background:var(--accent-bg);color:var(--accent)}
.skip{display:flex;gap:10px;align-items:baseline;padding:9px 14px;font-size:13px}
.skip .r{flex:1;color:var(--muted);min-width:0}
.skip .rs{white-space:nowrap;font-size:12px;color:var(--muted)}
.skip .rs.hit{color:var(--pos);font-weight:600}
.sec{font-size:13px;font-weight:800;color:var(--ink2);margin:18px 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;background:var(--surface2)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.rules li{margin:0 0 8px 20px;font-size:14px}
.rules b{display:block}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.flow div{padding:4px 0}
.flow div+div::before{content:"↓ ";color:var(--muted)}
.vtools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.btn{display:inline-block;padding:7px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);
  font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.vrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow.done{opacity:.6}
.vrow .when{flex:none;width:44px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.vrow .what{flex:1;min-width:0}
.vrow .what .l1{font-weight:700;font-size:14px}
.vrow .what .l2{font-size:13px;font-variant-numeric:tabular-nums}
.vrow .what .st{font-size:12px;color:var(--muted)}
.vrow .act{flex:none;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.vrow .go{color:inherit;text-decoration:none}
.vrow .tag{margin-left:2px}
.lnk{color:var(--accent);font-size:12px;font-weight:700;padding:0;margin-left:6px}
.mkrow{padding:8px 14px;border-top:1px solid var(--line)}
.bets .mkrow{padding:8px 0 0;border-top:0}
#betdlg{max-height:calc(100vh - 24px);overflow-y:auto}
#betdlg h3{margin:0 0 6px;font-size:15px}
#betdlg select,#betdlg input{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
#betdlg .chips{margin:0 0 4px}
.bsec{font-size:11px;color:var(--muted);font-weight:700;margin:10px 0 4px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px;max-height:34vh;overflow-y:auto}
.hb{display:flex;align-items:center;gap:5px;padding:6px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:12.5px;text-align:left;min-width:0}
.hb .u{flex:none;min-width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:12px;border:1px solid var(--line2)}
.hb .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hb .o{flex:none;font-size:11px;font-weight:800}
.hb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hb:disabled{opacity:.35;text-decoration:line-through}
.bsum{font-size:13px;margin:10px 0 8px;padding:8px 10px;border-radius:10px;background:var(--surface2);word-break:break-all}
.bact{display:flex;gap:8px;flex-wrap:wrap}
.bact .btn{flex:1;text-align:center;min-width:90px}
.btn:disabled{opacity:.4;cursor:default}
.datenav .d{width:auto;flex:1;font-weight:700}
.datenav .d small{font-weight:600;color:var(--muted);margin-left:4px}
.oddsbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:-4px 0 10px}
.oddsbar .btn{margin-left:auto}
.srcnote{font-size:12px;color:var(--ink2);background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.card.flash,.skipd.flash,.waitr.flash{outline:2px solid var(--pos);outline-offset:2px}
/* 場×レース番号の表(v24 と同じ考え方。押すとそのレースへ飛ぶ) */
.map{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 6px;margin-bottom:10px;overflow-x:auto;box-shadow:var(--shadow)}
table.grid{border-collapse:separate;border-spacing:2px}
table.grid th{font-size:10px;color:var(--muted);font-weight:600;padding:0 1px;text-align:center}
table.grid th.v{text-align:right;white-space:nowrap;font-size:12px;color:var(--ink2);padding-right:5px}
.cell{width:23px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);
  font-size:11px;font-weight:700;line-height:22px;text-align:center;padding:0;display:block;font-variant-numeric:tabular-nums}
.cell.skip{color:var(--ink2)}
.cell.wait{border-style:dashed;background:none}
.cell.buy{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.cell.hit{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:0 0 0 1px var(--good)}
.cell.lose{background:var(--neg-bg);border-color:var(--neg);color:var(--neg)}
.cell.ref{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}
.cell.a{border-width:2px;line-height:20px}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);margin-right:4px;vertical-align:-1px;background:var(--surface2)}
.legend .g-buy i{background:var(--accent-bg);border-color:var(--accent)}
.legend .g-hit i{background:var(--good-bg);border-color:var(--good)}
.legend .g-lose i{background:var(--neg-bg);border-color:var(--neg)}
.legend .g-ref i{background:var(--pos-bg);border-color:var(--pos)}
.legend .g-wait i{border-style:dashed;background:none}
.tools{display:flex;gap:6px;margin-bottom:8px}
.tools input{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:10px;
  padding:8px 10px;font:inherit;font-size:14px}
.tools input::placeholder{color:var(--muted)}
.tools .clr{flex:none;width:38px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink2);font-size:15px}
.chips.k{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.chips.k::-webkit-scrollbar{display:none}
.chips.k .chip{flex:none}
.chip b{margin-left:5px;font-variant-numeric:tabular-nums}
.waitr{display:flex;gap:10px;align-items:baseline;padding:9px 14px;font-size:13px;border-bottom:1px solid var(--line)}
.waitr .r{flex:1;color:var(--muted)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calh b{flex:1;text-align:center}
.calh button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line)}
.calh button:disabled{opacity:.35;cursor:default}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.calg .w{font-size:10px;color:var(--muted);text-align:center}
.calg .c{min-height:44px;border-radius:8px;padding:3px 1px;font-size:10.5px;text-align:center;background:var(--surface2);color:var(--muted);line-height:1.25;border:1px solid transparent;overflow:hidden}
.calg .c.e{background:none}
.calg button.c{color:var(--ink);border-color:var(--line)}
.calg .c b{display:block;font-size:12px}
.calg .c.hi{background:var(--good-bg)} .calg .c.hi span{color:var(--good);font-weight:700}
.calg .c.lo{background:var(--neg-bg)} .calg .c.lo span{color:var(--neg);font-weight:700}
.calg .c.on{outline:2px solid var(--ink);outline-offset:-1px}
dialog.sheet{margin:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:12px;width:min(420px,calc(100vw - 32px))}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
dialog.sheet .close{display:block;width:100%;margin-top:10px;padding:9px;border-radius:10px;border:1px solid var(--line);font-weight:700}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px}
.chart svg{display:block;width:100%;height:190px;touch-action:pan-y}
.chart .tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:5px 8px;border-radius:8px;white-space:nowrap;display:none}
.tbl tr.link{cursor:pointer}
.tbl tr.link:hover td,.tbl tr.link:focus-visible td{background:var(--surface2)}
.legendnote{font-size:12px;color:var(--muted);margin:6px 2px 0}
.nextb{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--accent-bg);border:1px solid var(--accent-line);
  border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:14px}
.nextb .badge{min-width:28px;height:28px;font-size:13px}
.nextb .t{flex:1;min-width:0}
.nextb .k{display:block;font-size:11px;font-weight:700;color:var(--accent)}
.cbox>summary{font-size:12.5px}
.ev{font-size:11px;color:var(--muted)}
.ev.up{color:var(--good);font-weight:800}
.evtbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.evtbl th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:3px 4px}
.evtbl th:first-child,.evtbl td:first-child{text-align:left}
.evtbl td{padding:4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.evtbl tr.mk td{font-weight:700}
.cbox .tag{margin-left:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">2強レース<small>中央</small></div>
    <div class="stamp" id="stamp"></div>
    <button class="themeb" id="themeb"></button>
  </div>
  <main id="v-race"></main>
  <main id="v-money" hidden></main>
  <main id="v-rule" hidden></main>
  <main id="v-vote" hidden></main>
</div>
<dialog id="caldlg" class="sheet" aria-label="日付を選ぶ"><div id="calbox"></div>
  <button class="close" id="calclose">閉じる</button></dialog>
<dialog id="betdlg" class="sheet" aria-label="買い目を作る"><div id="betbox"></div>
  <button class="close" id="betclose">閉じる</button></dialog>
<nav class="tabbar"><div class="in" role="tablist">
  <button role="tab" data-v="race" aria-selected="true">レース</button>
  <button role="tab" data-v="money" aria-selected="false">収支・分析</button>
  <button role="tab" data-v="vote" aria-selected="false">投票</button>
  <button role="tab" data-v="rule" aria-selected="false">考え方</button>
</div></nav>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yen = v => (v < 0 ? "-" : "") + "¥" + Math.abs(Math.round(v)).toLocaleString();
const pct = (a, b) => b ? (a / b * 100).toFixed(1) + "%" : "-";
const fmtD = d => d ? `${d.slice(0,4)}/${+d.slice(4,6)}/${+d.slice(6,8)}(${"日月火水木金土"[new Date(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6,8)).getDay()]})` : "";
const BABA = {"良":"良","稍":"稍重","重":"重","不":"不良"};
const yenK = v => { const a = Math.abs(v), sg = v > 0 ? "+" : v < 0 ? "-" : "±";
  return sg + (a >= 10000 ? (a / 10000).toFixed(a >= 100000 ? 0 : 1) + "万" : a.toLocaleString()); };
// 予想する中央・地方(2026-10-21 から中央だけ。地方の昔の記録はファイルに残るが出さない)
const CENTERS = ["jra"];
const state = {day: null, hist: null, days: [], filter: "all", center: "all", q: "", cache: {},
               period: "year", src: "all", mcenter: "all", calMonth: null, moneyMonth: null};
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// 収支の絞り込みは覚えておく(次に開いたときも同じ期間で見られるように)
try {
  const saved = JSON.parse(store.get("keiba-money") || "{}");
  for (const k of ["period", "src", "mcenter"]) if (typeof saved[k] === "string") state[k] = saved[k];
} catch (e) { /* 覚えていなければ初期値 */ }
const saveMoney = () => store.set("keiba-money", JSON.stringify({period: state.period, src: state.src, mcenter: state.mcenter}));
// レースの絞り込み(状態・中央/地方)も覚えておく
try {
  const saved = JSON.parse(store.get("keiba-race") || "{}");
  if (typeof saved.filter === "string") state.filter = saved.filter === "buy" ? "bought" : saved.filter;
  if (typeof saved.center === "string") state.center = saved.center;
} catch (e) { /* 初期値のまま */ }
if (CENTERS.length === 1) { state.center = "all"; state.mcenter = "all"; }   // 「地方」で絞ったまま覚えていても出す
const saveRace = () => store.set("keiba-race", JSON.stringify({filter: state.filter, center: state.center}));
const setHash = (d, rid) => { try { history.replaceState(null, "", "#d=" + d + (rid ? "&r=" + rid : "")); } catch (e) { /* 無視 */ } };
const toDate = d => new Date(+d.slice(0,4), +d.slice(4,6) - 1, +d.slice(6,8));
const dstr = t => `${t.getFullYear()}${String(t.getMonth()+1).padStart(2,"0")}${String(t.getDate()).padStart(2,"0")}`;
const SRC = {live: "当日の予想", backfill: "再現"};

// 明暗
const th = store.get("keiba-theme"); if (th) document.documentElement.dataset.theme = th;
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark"
  : matchMedia("(prefers-color-scheme: dark)").matches;
// ボタンには押すとどうなるかを出す
const drawThemeBtn = () => { const b = $("#themeb"), dark = isDark();
  b.textContent = dark ? "☀ 明るく" : "🌙 暗く"; b.setAttribute("aria-label", dark ? "明るい表示にする" : "暗い表示にする"); };
drawThemeBtn();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawThemeBtn);
$("#themeb").onclick = () => {
  document.documentElement.dataset.theme = isDark() ? "light" : "dark";
  store.set("keiba-theme", document.documentElement.dataset.theme);
  drawThemeBtn();
};
function showTab(v) {
  document.querySelectorAll(".tabbar button").forEach(x => x.setAttribute("aria-selected", x.dataset.v === v));
  ["race","money","vote","rule"].forEach(k => $("#v-" + k).hidden = k !== v);
  if (v === "vote") renderVote();          // 締切までの時間を出し直す
}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => { showTab(b.dataset.v); scrollTo(0, 0); });

async function getJSON(u) {
  const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now());
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadDay(d) {
  if (!state.cache[d]) state.cache[d] = await getJSON(`days/${d}.json`);
  return state.cache[d];
}

async function boot() {
  try { state.hist = await getJSON("history.json"); } catch (e) { state.hist = null; }
  state.days = (state.hist?.days || []).filter(d => d.races).map(d => d.date);
  try { state.day = await getJSON("data.json"); } catch (e) { state.day = null; }
  const today = state.day?.date;
  if (state.day) {
    state.cache[today] = state.day;
    const has = Object.values(state.day.races || {}).some(r => CENTERS.includes(r.center) && r.venue);
    if (has && !state.days.includes(today)) state.days.push(today);
  }
  state.days.sort();
  // 中央は土日が中心。今日に開催が無ければ、次の開催(先に予想してある日)か、無ければ最後の開催を開く
  if (today && !state.days.includes(today)) {
    const pick = state.days.find(d => d > today) || state.days[state.days.length - 1];
    state.noRace = {today, pick, next: pick > today};
    if (pick) { try { state.day = await loadDay(pick); } catch (e) { /* data.json のまま */ } }
  }
  renderRace(); renderMoney(); renderRule(); renderVote();
  autoOdds();
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("d") && state.days.includes(h.get("d"))) openDay(h.get("d"), h.get("r"));
}

// 日付を移る。rid があればそのレースまでスクロール
async function openDay(d, rid) {
  try { state.day = await loadDay(d); } catch (e) { return; }
  renderRace(); renderVote(); showTab("race");
  autoOdds();
  if (rid && allRaces().some(r => r.id === rid)) jumpRace(rid, false);
  else { scrollTo(0, 0); setHash(d); }
}
function goDay(step) {
  const i = state.days.indexOf(state.day?.date) + step;
  if (i >= 0 && i < state.days.length) openDay(state.days[i]);
}

// 月のカレンダー。stat(d) -> {races, buy, settled, pl} か null
function calendar(month, stat, selected, ids) {
  const y = +month.slice(0,4), m = +month.slice(4,6) - 1;
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0).getDate();
  const months = [...new Set(state.days.map(d => d.slice(0,6)))].sort();
  const mi = months.indexOf(month);
  let cells = "日月火水木金土".split("").map(w => `<div class="w">${w}</div>`).join("");
  for (let i = 0; i < first.getDay(); i++) cells += `<div class="c e"></div>`;
  for (let dd = 1; dd <= last; dd++) {
    const d = month + String(dd).padStart(2, "0"), x = stat(d);
    if (!x || !state.days.includes(d)) { cells += `<div class="c"><b>${dd}</b></div>`; continue; }
    const cls = x.settled ? (x.pl > 0 ? "hi" : x.pl < 0 ? "lo" : "") : "";
    const sub = x.settled ? `<span>${yenK(x.pl)}</span>` : x.buy ? `買${x.buy}` : "見送";
    cells += `<button class="c ${cls} ${d === selected ? "on" : ""}" data-day="${d}"
      aria-label="${fmtD(d)} ${x.settled ? "収支 " + yen(x.pl) : x.buy ? "買い " + x.buy + "レース" : "見送り"}"><b>${dd}</b>${sub}</button>`;
  }
  return `<div class="cal"><div class="calh">
      <button data-cm="${months[mi - 1] || ""}" aria-label="前の月" ${mi <= 0 ? "disabled" : ""}>◀</button>
      <b>${y}年${m + 1}月</b>
      <button data-cm="${months[mi + 1] || ""}" aria-label="次の月" ${mi < 0 || mi >= months.length - 1 ? "disabled" : ""}>▶</button>
    </div><div class="calg" id="${ids}">${cells}</div></div>`;
}
function dayStat(d) {
  const x = (state.hist?.days || []).find(r => r.date === d);
  if (!x) return state.day && state.day.date === d ? {races: 1, buy: 0, settled: 0, pl: 0} : null;
  return {races: x.races, buy: x.buy, settled: x.settled, pl: x.ret - x.stake};
}
function openCalendar() {
  const dlg = $("#caldlg");
  state.calMonth = state.calMonth || (state.day?.date || state.days[state.days.length - 1] || dstr(new Date())).slice(0, 6);
  const draw = () => {
    $("#calbox").innerHTML = calendar(state.calMonth, dayStat, state.day?.date, "calg1");
    $("#calbox").querySelectorAll("[data-cm]").forEach(b => b.onclick = () => { if (b.dataset.cm) { state.calMonth = b.dataset.cm; draw(); } });
    $("#calbox").querySelectorAll("[data-day]").forEach(b => b.onclick = () => { dlg.close(); openDay(b.dataset.day); });
  };
  draw();
  dlg.showModal();
}
$("#calclose").onclick = () => $("#caldlg").close();

function races() {
  return Object.values(state.day?.races || {}).filter(r => r.pred && r.horses && CENTERS.includes(r.center))
    .sort((a, b) => (a.start || "99").localeCompare(b.start || "99") || a.id.localeCompare(b.id));
}
// 表に出すレース(出馬表がまだのレースも「予想前」として出す。ばんえいは除く)
function allRaces() {
  return Object.values(state.day?.races || {}).filter(r => r.venue && r.rno && r.venue !== "帯広" && CENTERS.includes(r.center))
    .sort((a, b) => (a.start || "99").localeCompare(b.start || "99") || a.id.localeCompare(b.id));
}
const KIND = {buy: "買い", hit: "的中", lose: "外れ", skip: "見送り", ref: "見送り・◎○なら的中", wait: "予想前"};
function raceKind(r) {
  const p = r.pred;
  if (!p || !r.horses) return "wait";
  if (p.verdict !== "見送り") return r.settle && r.result ? (r.settle.hit ? "hit" : "lose") : "buy";
  const ref = skipRef(r);
  return ref && ref.ret ? "ref" : "skip";
}
const centerOkR = r => state.center === "all" || r.center === state.center;
function raceVisible(r) {
  const k = raceKind(r);
  if (state.filter !== "all") {
    if (state.filter === "skip") { if (k !== "skip" && k !== "ref") return false; }
    else if (state.filter === "bought") { if (!["buy", "hit", "lose"].includes(k)) return false; }
    else if (k !== state.filter) return false;
  }
  if (!state.q) return true;
  const q = state.q.replace(/\s/g, "").toLowerCase();
  const hay = [r.venue, r.rno + "R", String(r.rno), r.start, r.name, KIND[k], r.pred?.reason,
               ...(r.horses || []).map(h => h.name || ""), ...(r.horses || []).map(h => h.jockey || "")]
    .join("|").replace(/\s/g, "").toLowerCase();
  return hay.includes(q);
}

function raceMap(rs) {
  if (!rs.length) return "";
  const venues = [], byV = new Map();
  for (const r of rs) {
    if (!byV.has(r.venue)) { byV.set(r.venue, new Map()); venues.push(r.venue); }
    byV.get(r.venue).set(r.rno, r);
  }
  const maxR = Math.max(12, ...rs.map(r => r.rno || 0));
  const cols = Array.from({length: maxR}, (_, i) => i + 1);
  const rows = venues.map(v => `<tr><th class="v" scope="row">${esc(v)}</th>${cols.map(i => {
    const r = byV.get(v).get(i);
    if (!r) return `<td></td>`;
    const k = raceKind(r);
    const a = r.pred && r.pred.verdict === "A" ? " a" : "";
    return `<td><button class="cell ${k}${a}" data-rid="${esc(r.id)}"
      aria-label="${esc(v)}${i}R ${esc(r.start || "")} ${KIND[k]}${a ? " A" : ""}">${i}</button></td>`;
  }).join("")}</tr>`).join("");
  const seen = new Set(rs.map(raceKind));
  const lg = ["buy", "hit", "lose", "skip", "ref", "wait"].filter(k => seen.has(k))
    .map(k => `<span class="g-${k}"><i></i>${KIND[k]}</span>`).join("");
  return `<div class="map"><table class="grid"><thead><tr><th></th>${cols.map(i => `<th scope="col">${i}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table><div class="legend">${lg}<span>太枠はA</span></div></div>`;
}

function renderRace() {
  const el = $("#v-race");
  const d = state.day;
  $("#stamp").innerHTML = d?.updated ? `更新 ${esc(d.updated.slice(5,10).replace("-","/"))} ${esc(d.updated.slice(11,16))}` : "";
  if (!d) { el.innerHTML = `<div class="empty">まだデータがありません。<br>GitHub Actions の「競馬の予想」が回ると表示されます。</div>`; return; }
  const all = races();
  const rs = all.filter(centerOkR);
  const buy = rs.filter(r => r.pred.verdict !== "見送り");
  const nA = buy.filter(r => r.pred.verdict === "A").length;
  const set = rs.filter(r => r.settle && r.pred.verdict !== "見送り");
  const st = set.reduce((a, r) => a + r.settle.stake, 0), rt = set.reduce((a, r) => a + r.settle.ret, 0);
  const nback = all.filter(r => r.pred.src === "backfill").length;
  const i = state.days.indexOf(d.date);
  const mapRs = allRaces().filter(centerOkR);
  const cnt = {all: mapRs.length, bought: 0};
  for (const r of mapRs) {
    const k = raceKind(r);
    cnt[k] = (cnt[k] || 0) + 1;
    if (["buy", "hit", "lose"].includes(k)) cnt.bought++;
  }
  cnt.skip = (cnt.skip || 0) + (cnt.ref || 0);
  const kinds = [["all", "すべて"], ["bought", "買い"], ["hit", "的中"], ["lose", "外れ"], ["skip", "見送り"],
                 ["ref", "見送り・◎○なら的中"], ["wait", "予想前"]].filter(([k]) => k === "all" || cnt[k]);
  if (!kinds.some(([k]) => k === state.filter)) state.filter = "all";
  el.innerHTML = `
    <div class="datenav">
      <button id="prev" aria-label="前の日" ${i <= 0 ? "disabled" : ""}>◀</button>
      <button class="d" id="pick" aria-haspopup="dialog">${fmtD(d.date)}<small>📅</small></button>
      <button id="next" aria-label="次の日" ${i < 0 || i >= state.days.length - 1 ? "disabled" : ""}>▶</button>
    </div>
    <div class="oddsbar" id="oddsbar"></div>
    <div id="nextbuy"></div>
    ${state.noRace && d.date === state.noRace.pick ? `<div class="srcnote">今日 ${fmtD(state.noRace.today).slice(5)} は中央の開催がありません。
      ${state.noRace.next ? "次の開催の予想を出しています(出馬表は土曜分が木曜、日曜分が金曜に出ます)。" : "最後の開催を出しています。"}</div>` : ""}
    ${nback ? `<div class="srcnote">${nback === all.length ? "この日" : nback + "レース"}は<b>後から再現した予想</b>です。
      その日の出馬表と、そのレースより前の過去走だけで予想しています(人気は確定人気)。</div>` : ""}
    <div class="sum">
      <button class="tile" data-tf="all" aria-pressed="${state.filter === "all"}"><div class="k">全レース</div><div class="v num">${rs.length}</div></button>
      <button class="tile" data-tf="bought" aria-pressed="${state.filter === "bought"}"><div class="k">買う (A ${nA})</div><div class="v num">${buy.length}</div></button>
      ${set.length ? `<div class="tile"><div class="k">収支 ${pct(rt, st)}</div>
        <div class="v num ${rt - st >= 0 ? "good" : "neg"}">${yen(rt - st)}</div></div>`
      : `<button class="tile" data-tf="skip" aria-pressed="${state.filter === "skip"}"><div class="k">見送り</div><div class="v num">${rs.length - buy.length}</div></button>`}
    </div>
    ${CENTERS.length > 1 ? `<div class="chips" role="group" aria-label="中央・地方">
      ${[["all","中央+地方"],["jra","中央"],["nar","地方"]].map(([k,t]) => `<button class="chip" data-c="${k}" aria-pressed="${state.center===k}">${t}</button>`).join("")}
    </div>` : ""}
    ${raceMap(mapRs)}
    <div class="tools"><input id="q" type="search" placeholder="場・レース番号・馬名・騎手でしぼる" value="${esc(state.q)}"
      aria-label="レースをしぼる" enterkeyhint="search"><button class="clr" id="qclr" aria-label="しぼり込みを消す">✕</button></div>
    <div class="chips k" role="group" aria-label="レースの状態">
      ${kinds.map(([k, t]) => `<button class="chip" data-f="${k}" aria-pressed="${state.filter===k}">${t}<b>${cnt[k]}</b></button>`).join("")}
    </div>
    <div id="rlist"></div>`;
  $("#prev").onclick = () => goDay(-1);
  $("#next").onclick = () => goDay(1);
  drawOddsBar();
  drawNextBuy();
  $("#pick").onclick = () => { state.calMonth = d.date.slice(0, 6); openCalendar(); };
  el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { state.filter = b.dataset.f; saveRace(); renderRace(); });
  // 上のマス: 絞り込んで一覧の頭へ
  el.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => {
    state.filter = b.dataset.tf; state.q = ""; saveRace(); renderRace();
    $("#rlist").scrollIntoView({behavior: "smooth", block: "start"});
  });
  el.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { state.center = b.dataset.c; saveRace(); renderRace(); });
  el.querySelectorAll(".cell[data-rid]").forEach(b => b.onclick = () => jumpRace(b.dataset.rid));
  $("#q").oninput = e => { state.q = e.target.value; drawList(); };
  $("#qclr").onclick = () => { state.q = ""; $("#q").value = ""; drawList(); };
  drawList();
}

// 買うレース(カード)を先に、見送り・予想前(1行ずつ、1つの枠にまとめる)を後に。どちらも発走順
function drawList() {
  const box = $("#rlist");
  if (!box) return;
  const shown = allRaces().filter(r => centerOkR(r) && raceVisible(r));
  if (!shown.length) {
    box.innerHTML = `<div class="empty">${allRaces().length ? "この条件に合うレースはありません。" : "この日は中央の開催がありません。"}</div>`;
    return;
  }
  const isBuy = r => ["buy", "hit", "lose"].includes(raceKind(r));
  const buys = shown.filter(isBuy), rest = shown.filter(r => !isBuy(r));
  const skips = rest.filter(r => ["skip", "ref"].includes(raceKind(r)));
  let html = buys.length ? `<div class="sec">買うレース ${buys.length}</div>` + buys.map(card).join("") : "";
  if (rest.length) {
    const nw = rest.length - skips.length;
    html += `<div class="sec">${skips.length ? skipHead(skips) + (nw ? ` · 予想前 ${nw}` : "") : `予想前 ${nw}`}</div>`
      + `<div class="card">${rest.map(r => raceKind(r) === "wait" ? waitRow(r) : skipRow(r)).join("")}</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll("[data-mk]").forEach(b => b.onclick = () => openBuilder({rid: b.dataset.mk}));
}

function waitRow(r) {
  return `<div class="waitr" id="r-${esc(r.id)}"><b>${head(r)}</b><span class="r">予想前(出馬表・馬柱を取っているところ)</span></div>`;
}

// 締切前でいちばん早い買うレース。押すとそのレースへ飛ぶ
function drawNextBuy() {
  const el = $("#nextbuy"), d = state.day;
  if (!el || !d) return;
  const r = races().filter(x => centerOkR(x) && x.pred.verdict !== "見送り" && !x.result && (untilClose(d.date, x) ?? -1) > 0)[0];
  if (!r) { el.innerHTML = ""; return; }
  const m = untilClose(d.date, r), p = r.pred;
  const bet = p.bets.map(b => `${b.type} ${b.combos.map(c => comboText(b.type, c)).join(",")}`).join(" / ");
  el.innerHTML = `<button class="nextb" data-rid="${esc(r.id)}"><span class="badge ${p.verdict}">${p.verdict}</span>
    <span class="t"><span class="k">次の買い${m < 120 ? ` · <b>締切まで ${m}分</b>` : ""}</span>
    <b>${head(r)}</b> <span class="num">${esc(bet)}</span></span><span class="muted">›</span></button>`;
  el.querySelector("button").onclick = () => jumpRace(r.id);
}

// 表のマスから、そのレースへ飛ぶ(絞り込みで隠れていたら外してから開く)
function jumpRace(rid, smooth = true) {
  const r = allRaces().find(x => x.id === rid);
  if (!r) return;
  if (!centerOkR(r) || !raceVisible(r)) {
    if (!centerOkR(r)) state.center = "all";
    state.filter = "all"; state.q = ""; saveRace(); renderRace();
  }
  const node = document.getElementById("r-" + rid);
  if (!node) return;
  if (node.tagName === "DETAILS") node.open = true;
  node.scrollIntoView({behavior: smooth ? "smooth" : "auto", block: "center"});
  node.classList.add("flash"); setTimeout(() => node.classList.remove("flash"), 1600);
  document.querySelectorAll(".cell.cur").forEach(c => c.classList.remove("cur"));
  const c = document.querySelector(`.cell[data-rid="${rid}"]`);
  if (c) c.classList.add("cur");
  setHash(state.day.date, rid);
}

function head(r) {
  return `${esc(r.venue)} ${r.rno}R ${esc(r.start || "")}`;
}
function meta(r) {
  return [r.surface ? (r.surface === "ダ" ? "ダート" : r.surface) + (r.dist || "") : "", r.direction ? r.direction + "回り" : "",
          BABA[r.baba] || "", r.n ? r.n + "頭" : "", r.name].filter(Boolean).map(esc).join(" · ");
}
function hname(r, u) { return (r.horses.find(h => h.umaban === u) || {}).name || ""; }

function card(r) {
  const p = r.pred, s = r.settle, res = r.result;
  const hv = p.horses.find(h => h.umaban === p.honmei) || {}, tv = p.horses.find(h => h.umaban === p.taikou) || {};
  const ax = (m, u, e) => `<div class="ax"><div class="n"><span class="m">${m}</span>${u} ${esc(hname(r, u))}</div>
    <div class="s">${esc(e.style || "脚質?")} · ${e.p3 != null ? "3着内 " + Math.round(e.p3 * 100) + "%" : "評価 " + e.score}</div></div>`;
  const bets = p.bets.map(b => `<div class="bet ${b.hit && b.hit.length ? "hit" : ""}">
      <span class="ty">${esc(b.type)}</span>
      <span class="cb">${b.combos.map(c => c.join(b.type === "3連単" ? "→" : "-")).join("  ")}<span class="role">${esc(b.kind)} … ${esc(b.role)}</span></span>
      <span class="pt">${b.combos.length}点×${b.unit}円${b.ret ? `<br><b class="good">${yen(b.ret)}</b>` : ""}</span></div>`).join("");
  return `<article class="card ${p.verdict === "A" ? "buyA" : ""}" id="r-${esc(r.id)}">
    <div class="ch"><div class="badge ${p.verdict}">${p.verdict}</div>
      <div class="t"><b>${head(r)}</b>${p.src === "backfill" ? ` <span class="tag o">再現</span>` : ""}<div class="meta">${meta(r)}</div>
      <div class="meta">${esc(p.reason)}${p.pace ? " · 展開: " + esc(p.pace.note) : ""}</div></div></div>
    <div class="axis">${ax("◎", p.honmei, hv)}${ax("○", p.taikou, tv)}</div>

// 同じ◎○で、ほかの買い方を1点100円で買っていたら(参考)。払戻表にその券種が無ければ出さない
function altLine(r) {

// 見送ったレースで、もし◎-○のワイドを買っていたら(参考。収支には入れない)。結果が無ければ null
function skipRef(r) {
  const p = r.pred, res = r.result;

  const key = [p.honmei, p.taikou].sort((a, b) => a - b).join("-");

function skipRes(r) {

// 見送りの理由の短い形(一覧の1行用)。合わない形はそのまま
function shortReason(t) {
  t = t || "";
  let m;
  if ((m = t.match(/^◎が基準未満\(◎の3着内(\d+%)で基準(\d+%)/))) return `◎${m[1]}(基準${m[2]})`;
  if ((m = t.match(/^(混戦|人気どおり)\((◎|○)の3着内(\d+%)/))) return `${m[1]} ${m[2]}${m[3]}`;
  if ((m = t.match(/^1強\((◎\d+%・○\d+%)\)$/))) return `1強 ${m[1]}`;
  if ((m = t.match(/^少頭数\((\d+頭)/))) return `少頭数 ${m[1]}`;
  if (t.startsWith("過去走のない馬が多い")) return "新馬・能力不明";
  if (t.startsWith("障害・ばんえい")) return "障害(対象外)";
  if (t.startsWith("◎○の弱点が重なる")) return "◎○の弱点が重なる";
  return t.length > 14 ? t.replace(/\(.*\)$/, "") : t;
}

function skipRow(r) {

// 見送り欄の見出し: 結果が出たレースで、もし◎-○のワイドを買っていたら

const GROUPS = [["判定","verdict"],["芝/ダート","surface"],["距離","dist"],["頭数","field"],
                ["馬場","baba"],["2強の差","gap"],["展開","pace"],["競馬場","venue"]];
const PERIODS = [["7","7日"],["30","30日"],["month","今月"],["year","今年"],["lastyear","去年"],["all","全期間"]];

function periodRange() {
  const ds = (state.hist?.days || []).map(d => d.date).sort();
  if (!ds.length) return ["", ""];
  const last = ds[ds.length - 1];
  if (state.period === "all") return [ds[0], last];
  if (state.period === "month") return [last.slice(0, 6) + "01", last];
  if (state.period === "year") return [last.slice(0, 4) + "0101", last];
  if (state.period === "lastyear" && !hasLastYear()) state.period = "year";
  if (state.period === "year") return [last.slice(0, 4) + "0101", last];
  if (state.period === "lastyear") { const y = String(+last.slice(0, 4) - 1); return [y + "0101", y + "1231"]; }
  const t = toDate(last); t.setDate(t.getDate() - (+state.period - 1));
  return [dstr(t), last];
}
function hasLastYear() {
  const ds = (state.hist?.days || []).map(d => d.date).sort();
  return ds.length > 0 && ds[0].slice(0, 4) < ds[ds.length - 1].slice(0, 4);
}
const srcOk = s => state.src === "all" || s === state.src;
const centerOk = c => state.mcenter === "all" || c === state.mcenter;

function cumChart(pts) {
  // pts: [{date, pl, cum}] 日付順。1系列なので凡例は付けない(見出しが系列名)
  if (pts.length < 2) return "";
  const W = 600, H = 190, L = 52, R = 10, T = 10, B = 24;
  const lo = Math.min(0, ...pts.map(p => p.cum)), hi = Math.max(0, ...pts.map(p => p.cum));
  const span = hi - lo || 1;
  const x = i => L + (W - L - R) * i / (pts.length - 1);
  const y = v => T + (H - T - B) * (hi - v) / span;
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.cum).toFixed(1)}`).join("");
  const ticks = [...new Set([hi, 0, lo])];
  return `<div class="chart" id="cum">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="累積収支の推移(下の日別の表と同じ数字)">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v === 0 ? 'stroke-dasharray="4 3" stroke="var(--line2)"' : ""} vector-effect="non-scaling-stroke"/>
        <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${yenK(v)}</text>`).join("")}
      <text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${+pts[0].date.slice(4,6)}/${+pts[0].date.slice(6)}</text>
      <text x="${W - R}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${+pts[pts.length-1].date.slice(4,6)}/${+pts[pts.length-1].date.slice(6)}</text>
      <path d="${line}" fill="none" stroke="var(--pos)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <line id="cx" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
      <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="hit"/>
    </svg>
    <div class="dot" id="cdot" style="position:absolute;width:10px;height:10px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 2px var(--surface);display:none;transform:translate(-50%,-50%);pointer-events:none"></div>
    <div class="tip" id="ctip"></div></div>`;
}
function wireChart(pts) {
  const box = $("#cum"); if (!box) return;
  const svg = box.querySelector("svg"), tip = $("#ctip"), dot = $("#cdot"), cx = $("#cx");
  const W = 600, L = 52, R = 10, T = 10, B = 24, H = 190;
  const lo = Math.min(0, ...pts.map(p => p.cum)), hi = Math.max(0, ...pts.map(p => p.cum)), span = hi - lo || 1;
  const show = ev => {
    const rc = svg.getBoundingClientRect();
    const vx = (ev.clientX - rc.left) / rc.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((vx - L) / (W - L - R) * (pts.length - 1))));
    const p = pts[i], px = L + (W - L - R) * i / (pts.length - 1), py = T + (H - T - B) * (hi - p.cum) / span;
    cx.setAttribute("x1", px); cx.setAttribute("x2", px); cx.setAttribute("visibility", "visible");
    const sx = px / W * rc.width + (rc.left - box.getBoundingClientRect().left), sy = py / H * rc.height + (rc.top - box.getBoundingClientRect().top);
    dot.style.display = "block"; dot.style.left = sx + "px"; dot.style.top = sy + "px";
    tip.innerHTML = `${fmtD(p.date)}<br>その日 ${yen(p.pl)} / 累積 <b>${yen(p.cum)}</b>`;
    tip.style.display = "block";
    const tw = tip.offsetWidth, bw = box.clientWidth;
    tip.style.left = Math.max(4, Math.min(bw - tw - 4, sx - tw / 2)) + "px";
    tip.style.top = Math.max(4, sy - tip.offsetHeight - 12) + "px";
  };
  const hide = () => { tip.style.display = "none"; dot.style.display = "none"; cx.setAttribute("visibility", "hidden"); };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", hide);
}

function renderMoney() {
  const el = $("#v-money"), h = state.hist;
  if (!h || !h.days || !h.days.length) { el.innerHTML = `<div class="empty">まだ成績がありません。</div>`; return; }
  const [from, to] = periodRange();
  const inP = d => d >= from && d <= to;
  const all = (h.races || []).filter(r => inP(r.date) && srcOk(r.src));
  const rs = all.filter(r => centerOk(r.center));
  const days = h.days.filter(d => inP(d.date));
  const S = rs.reduce((a, r) => a + r.stake, 0), R = rs.reduce((a, r) => a + r.ret, 0), hit = rs.filter(r => r.hit).length;
  const agg = (list, key) => {
    const o = {};
    for (const r of list) { const k = key(r), x = o[k] = o[k] || {n: 0, hit: 0, stake: 0, ret: 0};
      x.n++; x.hit += r.hit ? 1 : 0; x.stake += r.stake; x.ret += r.ret; }
    return Object.entries(o).sort((a, b) => b[1].n - a[1].n);
  };
  const grow = (rows, label) => `<table class="tbl"><thead><tr><th>${label}</th><th>R</th><th>的中</th><th>投資</th><th>回収率</th></tr></thead><tbody>

      <td class="${x.ret >= x.stake ? "good" : "neg"}"><b>${pct(x.ret, x.stake)}</b></td></tr>`).join("")}</tbody></table>`;
  // 券種別
  const bt = {};
  for (const r of rs) for (const [k, v] of Object.entries(r.bets || {})) {
    const x = bt[k] = bt[k] || {n: 0, hit: 0, stake: 0, ret: 0}; x.n++; x.stake += v[0]; x.ret += v[1]; x.hit += v[2] ? 1 : 0; }
  // 日ごと(累積グラフ・カレンダー・日別の表)
  const byDay = {};
  for (const r of rs) { const x = byDay[r.date] = byDay[r.date] || {n: 0, hit: 0, stake: 0, ret: 0}; x.n++; x.hit += r.hit ? 1 : 0; x.stake += r.stake; x.ret += r.ret; }
  let cum = 0;

  // 印・負けパターン

  const calStat = d => { const x = h.days.find(r => r.date === d); if (!x) return null; const b = byDay[d];
    const mc = state.mcenter;
    const races = mc === "all" ? x.races : (x.races_c || {})[mc] || 0;
    if (!races) return null;
    return {races, buy: mc === "all" ? x.buy : (x.buy_c || {})[mc] || 0, settled: b ? b.n : 0, pl: b ? b.ret - b.stake : 0}; };
  // 中央・地方の内訳(「すべて」のとき上に出す)

  const srcs = [...new Set((h.races || []).map(r => r.src))];
  // 買い方をくらべる(同じ◎○を1点100円ずつ。払戻表にその券種が無いレースは数えない)

        馬場差で補正した走破タイムと上がり3Fの指数(場ごとの目盛りのずれも補正)、出馬表(枠・斤量・馬体重・性齢)、
        前走と同じ場か、騎手・厩舎のそれまでの3着内率、コース傾向、30か条の評価(能力・加減点・軸不可・消し)。
        そのレースのオッズは使わない(規則20)。${(m.centers || []).join() === "jra" ? "中央のレースだけで学ぶ" : "今のモデルは地方のレースも混ぜて学んだもの(中央だけで学び直す予定)"}</li>
      <li><b>◎○</b>軸にできる馬(延長などでない。規則15)のうち確率の上位2頭。相手は残りの上位2頭</li>
      <li><b>買うレース</b>${selText(sels.jra)}。${sels.jra.t2_max && sels.jra.t2_max <= 1
        ? "○が強すぎると人気どおりで配当が安いので、○の確率に上限を置く。" : "◎の確率だけで選ぶ(○の確率・3番手との差では絞らない)。"}

// ---------------------------------------------------------------- 投票
// 自分で買うときの買い目の一覧と、買った記録(自動では買わない)。記録はこの端末のブラウザにだけ残る
const VOTE_KEY = "keiba-votes";
const loadVotes = () => { try { return JSON.parse(store.get(VOTE_KEY) || "{}") || {}; } catch (e) { return {}; } };
const saveVotes = v => store.set(VOTE_KEY, JSON.stringify(v));
const ORDERED_T = ["馬単", "3連単"];
const voteId = (rid, type, c) => `${rid}|${type}|${c.join("-")}`;
const comboText = (type, c) => c.join(ORDERED_T.includes(type) ? "→" : "-");
const betText = (d, r, type, c, unit) =>
  `${+d.slice(4, 6)}/${+d.slice(6, 8)} ${r.venue}${r.rno}R ${type} ${comboText(type, c)} ${unit}円`;
// 締切(発走2分前)までの分。時刻は日本時間で数える
function untilClose(d, r) {
  if (!r.start) return null;
  const t = Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), +r.start.slice(0, 2) - 9, +r.start.slice(3, 5) - 2);
  return Math.floor((t - Date.now()) / 60000);
}
// 払戻(結果が出ていなければ null、外れは 0)
function voteRet(r, type, c, unit) {
  const pay = r && r.result && r.result.payout;
  if (!pay) return null;
  if (!pay[type]) return null;                 // 払戻表にその券種が無い(古いデータは複勝・枠連が無い)
  const key = ORDERED_T.includes(type) ? c.join("-") : [...c].sort((a, b) => a - b).join("-");
  return (pay[type][key] || 0) * unit / 100;
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); } catch (e2) { /* 無視 */ } ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = "コピーした"; setTimeout(() => { btn.textContent = o; }, 1200); }
}
async function voteGo(step) {
  const i = state.days.indexOf(state.day?.date) + step;
  if (i < 0 || i >= state.days.length) return;
  try { state.day = await loadDay(state.days[i]); } catch (e) { return; }
  renderRace(); renderVote(); scrollTo(0, 0);
}
function renderVote() {
  const el = $("#v-vote"), d = state.day;
  if (!el) return;
  if (!d) { el.innerHTML = `<div class="empty">まだデータがありません。</div>`; return; }
  const votes = loadVotes(), tickets = loadTickets();
  const items = [];
  for (const r of races()) {
    const p = r.pred;
    if (p.verdict === "見送り") continue;
    for (const b of p.bets) for (const c of b.combos)
      items.push({r, type: b.type, c, unit: b.unit, verdict: p.verdict, id: voteId(r.id, b.type, c)});
  }
  // 自分で作った買い目(予想に無いレース・券種も)
  for (const t of Object.values(tickets)) {
    const r = (d.races || {})[t.rid];
    if (t.d === d.date && r) items.push({r, t, type: t.type, unit: t.unit, id: t.id, cs: expand(t)});
  }
  // 買った印があるのに今の買い目に無いもの(印を付けたあとで予想が変わった)も出す
  for (const [id, v] of Object.entries(votes)) {
    if (v.d !== d.date || v.t || items.some(x => x.id === id)) continue;
    const r = (d.races || {})[v.rid];
    if (r) items.push({r, type: v.type, c: v.combo, unit: v.unit, verdict: "", id, old: true});
  }
  items.sort((a, b) => (a.r.start || "99").localeCompare(b.r.start || "99") || a.r.id.localeCompare(b.r.id) || !!a.t - !!b.t);
  const bought = x => x.t ? x.cs.length > 0 && x.cs.every(c => votes[tKey(x.t, c)]) : !!votes[x.id];
  const retOf = x => {
    if (!x.t) return voteRet(x.r, x.type, x.c, x.unit);
    const rs = x.cs.map(c => voteRet(x.r, x.type, c, x.unit));
    return rs.some(v => v == null) ? null : rs.reduce((a, v) => a + v, 0);
  };
  const textOf = x => x.t ? ticketText(d.date, x.r, x.t) : betText(d.date, x.r, x.type, x.c, x.unit);
  const closed = x => !!x.r.result || (untilClose(d.date, x.r) ?? 1) <= 0;
  const open = items.filter(x => !x.old && !closed(x));
  // この日の「買った」(予想の買い目も自分の買い目も)
  const mine = Object.values(votes).filter(v => v.d === d.date);
  const mineSet = mine.map(v => ({v, ret: voteRet((d.races || {})[v.rid], v.type, v.combo, v.unit)})).filter(z => z.ret != null);
  const mSt = mineSet.reduce((a, z) => a + z.v.unit, 0), mRt = mineSet.reduce((a, z) => a + z.ret, 0);
  const nPts = items.filter(x => !x.old).reduce((a, x) => a + (x.t ? x.cs.length : 1), 0);
  const i = state.days.indexOf(d.date);
  const status = x => {
    const ret = retOf(x);
    if (ret != null) return ret > 0 ? `<b class="good">的中 ${yen(ret)}</b>` : `<span class="neg">外れ</span>`;
    const m = untilClose(d.date, x.r);
    if (m == null) return "発走時刻まだ";
    if (m <= 0) return "締切済み・結果待ち";
    return m >= 120 ? `締切 ${esc(x.r.start ? (() => { const t = +x.r.start.slice(0, 2) * 60 + +x.r.start.slice(3, 5) - 2;
      return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); })() : "")}` : `<b>締切まで ${m}分</b>`;
  };
  const rows = items.map((x, n) => {
    const v = bought(x), done = closed(x);
    const tag = x.t ? `<span class="tag o">自分で</span>`
      : x.verdict ? `<span class="badge ${x.verdict}" style="display:inline-grid;min-width:22px;height:20px;font-size:12px;border-radius:6px;vertical-align:1px">${x.verdict}</span>` : "";
    const what = x.t ? `${esc(x.type)}${x.t.method !== "通常" ? " " + esc(x.t.method) : ""} <b>${esc(selText(x.t))}</b>
        ${x.cs.length > 1 ? `${x.cs.length}点×${x.unit}円` : x.unit + "円"}`
      : `${esc(x.type)} <b>${esc(comboText(x.type, x.c))}</b> ${x.unit}円`;
    const mk = (!done && !x.old && !v ? `<button class="lnk" data-mi="${n}">${x.t ? "直す" : "ほかの買い方"} ›</button>` : "")
      + (x.t && !v ? `<button class="lnk" data-del="${esc(x.id)}">消す</button>` : "");
    return `<div class="vrow ${done && !v ? "done" : ""}">
      <div class="when">${esc(x.r.start || "")}</div>
      <div class="what"><a class="go" href="#d=${esc(d.date)}&r=${esc(x.r.id)}" data-go="${esc(x.r.id)}">
        <div class="l1">${esc(x.r.venue)} ${x.r.rno}R ${tag}</div>
        <div class="l2">${what}</div></a>
        <div class="st">${status(x)}${x.old ? " · 予想が変わったので今の買い目には無い" : ""}${mk}</div></div>
      <div class="act">
        ${!done ? `<button class="btn sm" data-copy="${esc(textOf(x))}">コピー</button>` : ""}
        <button class="btn sm ${v ? "on" : ""}" data-vote="${esc(x.id)}" aria-pressed="${v ? "true" : "false"}">${v ? "買った ✓" : "買った"}</button>
      </div></div>`;
  }).join("");
  el.innerHTML = `
    <div class="datenav">
      <button id="vprev" aria-label="前の日" ${i <= 0 ? "disabled" : ""}>◀</button>
      <div class="d">${fmtD(d.date)}</div>
      <button id="vnext" aria-label="次の日" ${i < 0 || i >= state.days.length - 1 ? "disabled" : ""}>▶</button>
    </div>
    <div class="sum">
      <div class="tile"><div class="k">買い目</div><div class="v num">${nPts}点</div></div>
      <div class="tile"><div class="k">買った</div><div class="v num">${mine.length}点</div></div>
      <div class="tile"><div class="k">${mineSet.length ? "自分の収支 " + pct(mRt, mSt) : "自分の収支"}</div>
        <div class="v num ${mineSet.length ? (mRt >= mSt ? "good" : "neg") : ""}">${mineSet.length ? yen(mRt - mSt) : "-"}</div></div>
    </div>
    <div class="vtools">
      <button class="btn on" id="vmake">買い目を作る</button>
      ${open.length ? `<button class="btn" id="vcopyall">発走前の${open.length}件をまとめてコピー</button>` : ""}
    </div>
    ${items.length ? `<div class="vlist">${rows}</div>` : `<div class="empty">この日に買うレースはありません。<br>「買い目を作る」で、見送りのレースや好きな券種も買えます。</div>`}
    <p class="legendnote">買い目は予想の更新(発走まで)で変わることがあります。自分で買ったら「買った」を押すと、結果が出たあと自分の収支に入ります。

// 馬番 -> [単勝オッズ, 人気]。発売前は空。netkeiba の API(JSON)→ 単勝オッズのページ の順に試す(keiba.py の fetch_odds と同じ)
async function liveOdds(rid) {
  const out = {};
  try {
    const j = JSON.parse(await appFetch("https://race.netkeiba.com/api/api_get_jra_odds.html?pid=api_get_jra_odds&input=UTF-8" +
      "&output=json&race_id=" + rid + "&type=1&action=init&compress=0"));
    for (const [k, v] of Object.entries(((j.data || {}).odds || {})["1"] || {})) {
      const od = parseFloat(v[0]), nk = parseInt(v[2], 10);
      if (od > 0) out[+k] = [od, nk || null];
    }
  } catch (e) { /* 次の方法で */ }
  if (!Object.keys(out).length) {
    try {
      const doc = new DOMParser().parseFromString(await appFetch("https://race.netkeiba.com/odds/odds_get_form.html?type=b1&race_id=" + rid), "text/html");
      for (const tr of doc.querySelectorAll("tr")) {
        let um = null, nk = null, od = null;
        const tds = [...tr.querySelectorAll("td")], tx = td => td.textContent.trim().normalize("NFKC");
        for (const td of tds) {                  // 馬番は馬名の前にある最後の数字の列
          if (td.classList.contains("Horse_Name")) break;
          if (td.classList.contains("Ninki")) nk = parseInt(tx(td), 10) || null;
          else if (/^\d{1,2}$/.test(tx(td))) um = +tx(td);
        }
        for (const td of tds) {
          if (td.classList.contains("Odds") && /^\d+\.\d$/.test(tx(td))) od = parseFloat(tx(td));
          else if (td.classList.contains("Ninki") || td.classList.contains("Popular_Ninki")) nk = parseInt(tx(td), 10) || nk;
        }
        if (um && od) out[um] = [od, nk];
      }
    } catch (e) { /* 取れなかった */ }
  }
  const us = Object.keys(out).map(Number);          // 人気が無ければオッズの低い順
  if (us.length && !us.every(u => out[u][1])) us.sort((a, b) => out[a][0] - out[b][0]).forEach((u, i) => { out[u][1] = i + 1; });
  return out;
}
// ワイドのオッズ "小さい馬番-大きい馬番" -> [下限, 上限](keiba.py の parse_wide_odds と同じ)
async function liveWide(rid) {
  const j = JSON.parse(await appFetch("https://race.netkeiba.com/api/api_get_jra_odds.html?pid=api_get_jra_odds&input=UTF-8" +
    "&output=json&race_id=" + rid + "&type=5&action=init&compress=0"));
  const out = {};
  for (const [k, v] of Object.entries(((j.data || {}).odds || {})["5"] || {})) {
    const a = +k.slice(0, 2), b = +k.slice(2, 4), lo = parseFloat(v[0]), hi = parseFloat(v[1]);
    if (lo > 0) out[Math.min(a, b) + "-" + Math.max(a, b)] = [lo, hi > 0 ? hi : lo];
  }
  return out;
}

// ---------------------------------------------------------------- 期待値(単勝・ワイド)
// 期待値 = 当たる確率 × オッズ(100円買って平均いくら戻るか ÷ 100)。1を超えれば、続けて買うと得になる見込み。
// 1着の確率は、単勝オッズから出る市場の確率 q と、モデルの3着内の確率 p3 を混ぜる: P ∝ q^a × (p3/(1-p3))^b。
// ワイドは1着の確率から Harville で2頭とも3着内に入る確率(2着・3着は確率を g 乗して平らにする)。
// a・b・g は2024・2025年で決め、2026年で確率が実際の割合に合うことを確かめた(tools/experiments/ev_fit.py)。
// モデルの重さ b はとても小さく、ほぼ市場の確率になる(モデルは単勝オッズ以上の情報をほとんど持っていない)
const EVP = {a: 1.0, b: 0.04, g: 0.7};
function evProbs(r) {
  const p3 = {};
  for (const h of (r.pred || {}).horses || []) if (h.p3 != null) p3[h.umaban] = h.p3;
  const hs = (r.horses || []).filter(h => !h.scratched && h.odds > 1);
  if (hs.length < 5) return null;
  const inv = hs.reduce((a, h) => a + 1 / h.odds, 0);
  const z = hs.map(h => {
    const q = 1 / h.odds / inv, p = Math.min(Math.max(p3[h.umaban] ?? 0.5, 1e-3), 0.99);
    return Math.pow(q, EVP.a) * Math.pow(p / (1 - p), EVP.b);
  });
  const s = z.reduce((a, v) => a + v, 0), win = {};
  hs.forEach((h, i) => { win[h.umaban] = z[i] / s; });
  return win;
}
// "小さい馬番-大きい馬番" -> 2頭とも3着内に入る確率
function widePairs(win) {
  const us = Object.keys(win).map(Number), p = us.map(u => win[u]), g = p.map(v => Math.pow(v, EVP.g));
  const G = g.reduce((a, v) => a + v, 0), n = us.length, P = {};
  const add = (a, b, v) => { const k = Math.min(us[a], us[b]) + "-" + Math.max(us[a], us[b]); P[k] = (P[k] || 0) + v; };
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if (j === i) continue;
    const pij = p[i] * g[j] / (G - g[i]);
    for (let k = 0; k < n; k++) {
      if (k === i || k === j) continue;
      const v = pij * g[k] / (G - g[i] - g[j]);
      add(i, j, v); add(i, k, v); add(j, k, v);
    }
  }
  return P;
}
const pctS = v => (v * 100).toFixed(v < 0.1 ? 1 : 0) + "%";
const evRange = (p, o) => o[0] === o[1] ? (p * o[0]).toFixed(2) : `${(p * o[0]).toFixed(2)}〜${(p * o[1]).toFixed(2)}`;
function evInner(r) {
  const win = evProbs(r);
  if (!win) return `<div class="muted">単勝のオッズがまだありません(発売前)。</div>`;
  const pr = r.pred || {}, nm = u => esc(hname(r, u));
  const tans = Object.keys(win).map(Number).map(u => ({u, p: win[u], o: r.horses.find(h => h.umaban === u).odds}))
    .map(x => Object.assign(x, {ev: x.p * x.o})).sort((a, b) => b.ev - a.ev);
  const tRows = tans.slice(0, 4).map(x => `<tr class="${x.u === pr.honmei ? "mk" : ""}"><td>${x.u} ${nm(x.u)}${x.u === pr.honmei ? " ◎" : ""}</td>
    <td>${pctS(x.p)}</td><td>${x.o}</td><td class="${evCls(x.ev)}">${x.ev.toFixed(2)}</td></tr>`).join("");
  let wHtml = `<div class="muted" style="margin-top:6px">ワイドのオッズはまだ取っていません(次のオッズの更新で取ります)。</div>`;
  const wo = r.wide_odds || r.wide_final;          // 発走前の最後のオッズ / 無ければ確定オッズ
  if (wo && Object.keys(wo).length) {
    const P = widePairs(win), hk = pr.honmei && pr.taikou ? [pr.honmei, pr.taikou].sort((a, b) => a - b).join("-") : "";
    const ws = Object.entries(wo).filter(([k]) => P[k]).map(([k, o]) => ({k, p: P[k], o, ev: P[k] * o[0]}))
      .sort((a, b) => b.ev - a.ev);
    const show = ws.slice(0, 6);
    if (hk && !show.some(x => x.k === hk)) { const x = ws.find(x => x.k === hk); if (x) show.push(x); }
    wHtml = `<table class="evtbl"><thead><tr><th>ワイド</th><th>確率</th><th>オッズ</th><th>期待値</th></tr></thead><tbody>
      ${show.map(x => `<tr class="${x.k === hk ? "mk" : ""}"><td>${esc(x.k)}${x.k === hk ? " ◎-○" : ""}</td><td>${pctS(x.p)}</td>
        <td>${x.o[0] === x.o[1] ? x.o[0] : x.o[0] + "〜" + x.o[1]}</td><td class="${evCls(x.ev)}">${evRange(x.p, x.o)}</td></tr>`).join("")}</tbody></table>`;
  }
  return `<table class="evtbl"><thead><tr><th>単勝(期待値の高い順)</th><th>確率</th><th>オッズ</th><th>期待値</th></tr></thead>
    <tbody>${tRows}</tbody></table>${wHtml}
    <div class="muted" style="margin-top:6px">期待値 = 当たる確率 × オッズ。1を超えれば続けて買うと得になる見込み(緑)。
      確率はほぼ単勝オッズから出したもので(モデルは少しだけ)、2024〜2026年の単勝で期待値1を超えた馬はいない。
      ワイドの期待値はオッズの幅(下限〜上限)で出す。</div>`;
}
function evBox(r) {

  return `<details class="more cbox"><summary>期待値(単勝・ワイド)</summary><div class="note evin" style="padding-top:2px">${evInner(r)}</div></details>`;

// ---------------------------------------------------------------- 買い目を作る
// 予想に無いレースや券種も、自分で買い目を作って投票タブに入れる(この端末にだけ残る)
const TICKET_KEY = "keiba-tickets";
const loadTickets = () => { try { return JSON.parse(store.get(TICKET_KEY) || "{}") || {}; } catch (e) { return {}; } };
const saveTickets = v => store.set(TICKET_KEY, JSON.stringify(v));
const TYPES = ["単勝", "複勝", "枠連", "馬連", "ワイド", "馬単", "3連複", "3連単"];
const NEED = {"単勝": 1, "複勝": 1, "枠連": 2, "馬連": 2, "ワイド": 2, "馬単": 2, "3連複": 3, "3連単": 3};
// 枠の色(背景, 文字)
const WAKU_C = [null, ["#fff", "#222"], ["#222", "#fff"], ["#e8382f", "#fff"], ["#2f6fd6", "#fff"],
                ["#f5d000", "#222"], ["#2e9e4f", "#fff"], ["#f08a1c", "#fff"], ["#f39ac0", "#222"]];
const dowOf = d => "日月火水木金土"[toDate(d).getDay()];
const byNum = (a, b) => a - b;
const colsText = (t, sep) => (t.cols || []).slice(0, NEED[t.type]).map(c => c.join(",") || "?").join(sep);
const ticketId = t => `${t.rid}|${t.type}|${t.method}|${t.axis ?? ""}|${t.method === "フォーメーション" ? colsText(t, "/") : t.sel.join(",")}`;
const tKey = (t, c) => t.id + "#" + c.join("-");
// xs から k 個の組(順番なし)・並び(順番あり)
const combos = (xs, k) => k === 0 ? [[]] : xs.flatMap((x, i) => combos(xs.slice(i + 1), k - 1).map(c => [x, ...c]));
const perms = (xs, k) => k === 0 ? [[]] : xs.flatMap((x, i) => perms(xs.filter((_, j) => j !== i), k - 1).map(c => [x, ...c]));
// 買い目 t = {type, method, sel, axis, cols} を1点ずつの組にする(馬単・3連単は着順のまま、ほかは小さい順)
// フォーメーションは列(1頭目・2頭目・3頭目。馬単・3連単は1着・2着・3着)ごとに選んだ馬の組み合わせ(同じ馬は入れない)
function expand(t) {
  const k = NEED[t.type], ord = ORDERED_T.includes(t.type);
  let cs = [];
  if (k === 1) cs = t.sel.map(u => [u]);
  else if (t.method === "フォーメーション") {
    const cols = (t.cols || []).slice(0, k);
    let acc = cols.length === k ? [[]] : [];
    for (const c of cols) acc = acc.flatMap(a => c.filter(u => !a.includes(u)).map(u => [...a, u]));
    const seen = new Set();
    cs = acc.filter(c => { const key = (ord ? c : [...c].sort(byNum)).join("-"); return !seen.has(key) && seen.add(key); });
  }
  else if (t.method === "通常") cs = t.sel.length === k ? [t.sel] : [];
  else if (t.method === "ボックス") cs = (ord ? perms : combos)([...t.sel].sort(byNum), k);
  else if (t.method === "ながし" && t.axis != null)          // 馬単・3連単は軸が1着
    cs = (ord ? perms : combos)(t.sel.filter(u => u !== t.axis).sort(byNum), k - 1).map(c => [t.axis, ...c]);
  return cs.map(c => ord ? c : [...c].sort(byNum));
}
function selText(t) {
  if (t.method === "フォーメーション") return colsText(t, ORDERED_T.includes(t.type) ? "→" : "-");
  if (t.method === "ながし") return `軸${t.axis ?? "?"}${ORDERED_T.includes(t.type) ? "→" : "-"}${t.sel.join(",") || "?"}`;
  if (t.method === "通常" && NEED[t.type] > 1) return comboText(t.type, t.sel);
  return t.sel.join(",");
}
function ticketText(d, r, t) {
  const n = expand(t).length;
  return `${+d.slice(4, 6)}/${+d.slice(6, 8)} ${r.venue}${r.rno}R ${t.type}${t.method !== "通常" ? " " + t.method : ""} ${selText(t)} ` +
    (n > 1 ? `各${t.unit}円(${n}点 ${t.unit * n}円)` : `${t.unit}円`);
}
// どの買い方も、フォーメーションの列にすると同じ形になる(通常=1頭ずつ、ボックス=全部の列に全部、ながし=軸と相手)
function toCols(t) {
  const k = NEED[t.type];
  if (k === 1) return [t.sel];
  if (t.method === "フォーメーション") return (t.cols || []).slice(0, k);
  if (t.method === "ボックス") return Array.from({length: k}, () => [...t.sel]);
  if (t.method === "ながし") return [[t.axis], ...Array.from({length: k - 1}, () => [...t.sel])];
  return t.sel.map(u => [u]);
}
// 作った買い目を投票タブに入れて、その買い目(のリスト)を返す。単勝・複勝で何頭か選んだときは1頭ずつの買い目にする
function saveTicket(b) {
  const base = {d: b.d, rid: b.rid, type: b.type, method: b.method, axis: b.method === "ながし" ? b.axis : null,
                sel: b.method === "フォーメーション" ? [] : b.method === "通常" && ORDERED_T.includes(b.type) ? [...b.sel] : [...b.sel].sort(byNum),
                unit: b.unit};
  if (b.method === "フォーメーション") base.cols = b.cols.slice(0, NEED[b.type]).map(c => [...c].sort(byNum));
  const list = NEED[b.type] === 1 && base.sel.length > 1 ? base.sel.map(u => Object.assign({}, base, {sel: [u]})) : [base];
  list.forEach(t => { t.id = ticketId(t); });
  const ts = loadTickets();
  if (b.edit && !list.some(t => t.id === b.edit)) delete ts[b.edit];          // 「直す」で開いたときは置き換える
  if (b.edit) b.edit = list[0].id;
  for (const t of list) ts[t.id] = Object.assign({at: new Date().toISOString()}, ts[t.id] || {}, t);
  saveTickets(ts);
  return list;
}
// 自分の買い目の「買った」: 1点ずつ記録する(収支の集計は予想の買い目と同じ)
function markTicket(vs, t, on) {
  for (const [k, v] of Object.entries(vs)) if (v.t === t.id) delete vs[k];
  if (on) for (const c of expand(t))
    vs[tKey(t, c)] = {d: t.d, rid: t.rid, type: t.type, combo: c, unit: t.unit, at: new Date().toISOString(), t: t.id};
}

let bst = null;
function openBuilder(o) {
  const d = state.day;
  const rs = allRaces().filter(r => r.horses && r.horses.length);
  if (!d || !rs.length) { alert("出馬表が出ているレースがありません"); return; }
  const r = rs.find(x => x.id === o.rid) || rs.find(x => !x.result && (untilClose(d.date, x) ?? 1) > 0) || rs[0];
  bst = {d: d.date, rid: r.id, type: o.type || "ワイド", method: o.method || "通常", sel: [...(o.sel || [])], axis: o.axis ?? null,
         mode: o.axis != null ? "aite" : "axis", unit: o.unit || +store.get("keiba-unit") || 100, edit: o.edit,
         cols: o.cols ? o.cols.map(c => [...c]).concat([[], [], []]).slice(0, 3) : [[], [], []], col: 0};
  drawBuilder();
  $("#betdlg").showModal();
}
$("#betclose").onclick = () => $("#betdlg").close();
$("#betdlg").addEventListener("close", () => { if (!$("#v-vote").hidden) renderVote(); });

function drawBuilder() {
  const b = bst, d = state.day, r = d.races[b.rid];
  const rs = allRaces().filter(x => x.horses && x.horses.length);
  const k = NEED[b.type], ord = ORDERED_T.includes(b.type), waku = b.type === "枠連";
  if (k === 1) b.method = "通常";
  const t = () => ({type: b.type, method: b.method, sel: b.sel, axis: b.method === "ながし" ? b.axis : null, unit: b.unit, cols: b.cols});
  const colName = i => ord ? `${i + 1}着` : `${i + 1}頭目`;
  const cs = expand(t());
  const closed = !!r.result || (untilClose(b.d, r) ?? 1) <= 0;
  const marks = {};
  for (const h of (r.pred || {}).horses || []) if (h.mark && h.mark !== "×") marks[h.umaban] = h.mark;
  const live = r.horses.filter(h => !h.scratched);
  const opts = waku
    ? [...new Set(live.map(h => h.waku))].sort(byNum).map(w => ({u: w, w, nm: live.filter(h => h.waku === w).map(h => h.umaban).join("・") + "番"}))
    : r.horses.map(h => ({u: h.umaban, w: h.waku, nm: h.name || "", mk: marks[h.umaban] || "", off: h.scratched}));
  const on = u => b.method === "フォーメーション" ? b.cols[b.col].includes(u)
    : b.method === "ながし" ? (u === b.axis || b.sel.includes(u)) : b.sel.includes(u);
  const badge = u => {
    if (b.method === "フォーメーション")
      return b.cols.slice(0, k).map((c, i) => c.includes(u) ? i + 1 : 0).filter(Boolean).join("・");
    if (b.method === "ながし") return u === b.axis ? "軸" : b.sel.includes(u) ? "相手" : "";
    const i = b.sel.indexOf(u);
    return i < 0 ? "" : ord && b.method === "通常" ? `${i + 1}着` : "✓";
  };
  const what = waku ? "枠" : "馬";
  const hint = b.method === "フォーメーション" ? `${colName(b.col)}の${what}を選ぶ(いくつでも。列を切り替えて全部の列を選ぶ)`
    : b.method === "ながし" ? (b.mode === "axis" ? `軸の${what}を1つ選ぶ${ord ? "(1着に固定)" : ""}` : `相手の${what}を選ぶ(いくつでも)`)
    : b.method === "ボックス" ? `${what}を${k}つ以上選ぶ`
    : k === 1 ? `${what}を選ぶ(いくつでも。1つ1点)` : ord ? `${what}を1着から順に${k}つ選ぶ` : `${what}を${k}つ選ぶ`;
  const evLine = () => {
    if (!cs.length || !["単勝", "ワイド"].includes(b.type)) return "";
    const win = evProbs(r);
    if (!win) return "";
    let ps, os;
    if (b.type === "単勝") {
      ps = cs.map(c => win[c[0]] || 0); os = cs.map(c => { const h = r.horses.find(x => x.umaban === c[0]); return h && h.odds ? [h.odds, h.odds] : null; });
    } else {
      const wo = r.wide_odds || r.wide_final;
      if (!wo) return `<br><span class="muted">ワイドのオッズがまだ無いので期待値は出せません</span>`;
      const P = widePairs(win);
      ps = cs.map(c => P[c.join("-")] || 0); os = cs.map(c => wo[c.join("-")] || null);
    }
    if (os.some(o => !o)) return "";
    const lo = ps.reduce((a, p, i) => a + p * os[i][0], 0) / cs.length, hi = ps.reduce((a, p, i) => a + p * os[i][1], 0) / cs.length;
    return `<br>期待値 <b class="${evCls(lo)}">${lo === hi ? lo.toFixed(2) : lo.toFixed(2) + "〜" + hi.toFixed(2)}</b>` +
      (cs.length > 1 ? "(1点あたりの平均)" : `(当たる確率 約${pctS(ps[0])})`);
  };
  const sum = () => cs.length ? `<b>${cs.length}点 · ${yen(cs.length * b.unit)}</b>(1点${b.unit}円)<br>
      ${esc(cs.slice(0, 20).map(c => comboText(b.type, c)).join("  "))}${cs.length > 20 ? " …" : ""}${evLine()}` : `<span class="muted">${esc(hint)}</span>`;
  const box = $("#betbox");
  const sc = box.querySelector(".bgrid")?.scrollTop || 0;
  box.innerHTML = `
    <h3>買い目を作る</h3>
    <select id="bRace" aria-label="レース">${rs.map(x => {
      const cl = !!x.result || (untilClose(b.d, x) ?? 1) <= 0;
      return `<option value="${esc(x.id)}" ${x.id === b.rid ? "selected" : ""}>${esc(x.venue)} ${x.rno}R ${esc(x.start || "")} ${esc(x.name || "")}${cl ? "(締切)" : ""}</option>`;
    }).join("")}</select>
    <div class="bsec">券種</div>
    <div class="chips">${TYPES.map(x => `<button class="chip" data-bt="${x}" aria-pressed="${x === b.type}">${x}</button>`).join("")}</div>
    ${k > 1 ? `<div class="bsec">方式</div>
      <div class="chips">${["通常", "ボックス", "ながし", "フォーメーション"].map(x => `<button class="chip" data-bm="${x}" aria-pressed="${x === b.method}">${x}</button>`).join("")}</div>` : ""}
    ${b.method === "フォーメーション" ? `<div class="chips">${b.cols.slice(0, k).map((c, i) =>
      `<button class="chip" data-bc="${i}" aria-pressed="${b.col === i}">${colName(i)}<b>${c.length}</b></button>`).join("")}</div>` : ""}
    ${b.method === "ながし" ? `<div class="chips">${[["axis", "軸を選ぶ"], ["aite", "相手を選ぶ"]].map(([m, l]) =>
      `<button class="chip" data-bn="${m}" aria-pressed="${b.mode === m}">${l}</button>`).join("")}</div>` : ""}
    <div class="bsec">${esc(hint)}</div>
    <div class="bgrid">${opts.map(o => { const c = WAKU_C[o.w] || ["var(--surface2)", "var(--ink)"];
      return `<button class="hb" data-bu="${o.u}" aria-pressed="${on(o.u)}" ${o.off ? "disabled" : ""}>
        <span class="u" style="background:${c[0]};color:${c[1]}">${o.u}</span>
        <span class="nm">${o.mk ? `<b>${esc(o.mk)}</b>` : ""}${esc(o.nm)}</span><span class="o">${badge(o.u)}</span></button>`; }).join("")}</div>
    <div class="bsec">1点の金額(円)</div>
    <input id="bUnit" type="number" inputmode="numeric" min="100" step="100" value="${b.unit}" aria-label="1点の金額(円)">
    <div class="bsum" id="bSum">${sum()}</div>
    <div class="bact">
      <button class="btn on" id="bCopy" ${cs.length ? "" : "disabled"}>コピー</button>
      <button class="btn" id="bDone" ${cs.length ? "" : "disabled"}>買った</button>
    </div>
    <p class="legendnote">${closed ? "このレースは締切済みです(「買った」の記録だけ付けられます)。" : ""}
      作った買い目は投票タブに入ります。</p>`;
  box.querySelector(".bgrid").scrollTop = sc;
  const clear = () => { b.sel = []; b.axis = null; b.mode = "axis"; b.cols = [[], [], []]; b.col = 0; };
  $("#bRace").onchange = e => { b.rid = e.target.value; clear(); drawBuilder(); };
  box.querySelectorAll("[data-bt]").forEach(x => x.onclick = () => {
    const nt = x.dataset.bt;
    if ((nt === "枠連") !== waku) clear();       // 枠番と馬番は別
    if (b.col >= NEED[nt]) b.col = 0;
    b.type = nt;
    if (b.method === "通常" && NEED[nt] > 1) b.sel = b.sel.slice(0, NEED[nt]);
    drawBuilder();
  });
  box.querySelectorAll("[data-bm]").forEach(x => x.onclick = () => {
    const nm = x.dataset.bm;
    if (b.method === "フォーメーション" && nm !== "フォーメーション") b.sel = [...new Set(b.cols.slice(0, k).flat())];
    if (nm === "フォーメーション" && b.method !== "フォーメーション") {      // 今の選び方を列に移す
      b.cols = toCols(t()).map(c => c.filter(u => u != null)).concat([[], [], []]).slice(0, 3);
      b.col = 0; b.sel = []; b.axis = null;
    }
    else if (nm === "ながし" && b.method !== "ながし") { b.axis = b.sel[0] ?? null; b.sel = b.sel.slice(1); b.mode = b.axis == null ? "axis" : "aite"; }
    else if (nm !== "ながし" && b.method === "ながし") { if (b.axis != null) b.sel = [b.axis, ...b.sel]; b.axis = null; }
    b.method = nm;
    if (nm === "通常") b.sel = b.sel.slice(0, k);
    drawBuilder();
  });
  box.querySelectorAll("[data-bn]").forEach(x => x.onclick = () => { b.mode = x.dataset.bn; drawBuilder(); });
  box.querySelectorAll("[data-bc]").forEach(x => x.onclick = () => { b.col = +x.dataset.bc; drawBuilder(); });
  box.querySelectorAll("[data-bu]").forEach(x => x.onclick = () => {
    const u = +x.dataset.bu;
    if (b.method === "フォーメーション") {
      const c = b.cols[b.col];
      b.cols[b.col] = c.includes(u) ? c.filter(v => v !== u) : [...c, u];
    } else if (b.method === "ながし") {
      if (b.mode === "axis") { b.axis = b.axis === u ? null : u; b.sel = b.sel.filter(v => v !== u); if (b.axis != null) b.mode = "aite"; }
      else if (u === b.axis) { b.axis = null; b.mode = "axis"; }
      else b.sel = b.sel.includes(u) ? b.sel.filter(v => v !== u) : [...b.sel, u];
    } else if (b.sel.includes(u)) b.sel = b.sel.filter(v => v !== u);
    else if (b.method === "通常" && k > 1 && b.sel.length >= k) return;        // 足りている(外してから選び直す)
    else b.sel = [...b.sel, u];
    drawBuilder();
  });
  // 金額は打つたびに合計だけ直す(描き直すと、続けて押したボタンが効かなくなる)
  $("#bUnit").oninput = e => { b.unit = Math.max(100, Math.round((+e.target.value || 100) / 100) * 100); $("#bSum").innerHTML = sum(); };
  $("#bUnit").onchange = e => { e.target.value = b.unit; store.set("keiba-unit", String(b.unit)); };
  $("#bCopy").onclick = () => copyText(saveTicket(b).map(tk => ticketText(b.d, r, tk)).join("\n"), $("#bCopy"));
  $("#bDone").onclick = () => {
    const vs = loadVotes();
    for (const tk of saveTicket(b)) markTicket(vs, tk, true);
    saveVotes(vs);
    $("#betdlg").close(); showTab("vote"); scrollTo(0, 0);
  };
}

// 画面(GitHub Pages に置いた時刻)とアプリの版。更新が届いたかを確かめる用
function verText() {
  const t = new Date(document.lastModified);
  let app = "";
  try { app = window.KeibaApp && window.KeibaApp.version ? window.KeibaApp.version() : ""; } catch (e) { /* 古いアプリ */ }
  return `画面 ${isNaN(t) ? "-" : `${t.getMonth() + 1}/${t.getDate()} ${hm(t)}`}` + (window.KeibaApp ? ` · アプリ ${app || "?"}` : "");
}

function renderRule() {
  $("#v-rule").innerHTML = `
    <div class="sec">流れ</div>
    <div class="flow"><div>全レースの各馬に、3着以内に来る確率を出す</div>
      <div>「来ない」馬の負け要因(距離・展開・枠・斤量・休み明け・クラス差・馬場)を探して消す</div>
      <div>30か条の評価も材料にした確率モデルで、軸にできる馬の上位2頭を◎○にする(延長の馬は軸にしない)</div>
      <div>◎の確率が80%以上のレースだけ買う(85%以上はA)。それ以外は見送り</div>
      <div>買い方はワイド◎-○の1点だけ(◎○が両方3着内で的中)</div></div>
    <div class="sec">3着以内の確率モデル(◎○と買うレースを決める)</div>
    <div id="modelbox"><p class="muted" style="font-size:13px">モデルの情報を読み込み中…</p></div>
    <div class="sec">印</div>
    <div class="flow" style="font-size:13px">◎ 最も崩れにくい軸 / ○ ◎と違う強みの2頭目 / ▲△ 消せない相手 / ☆ 3頭目の穴 / × 消し</div>
    <div class="sec">評価の作り方</div>
    <ul class="rules">
      <li><b>能力</b>過去5走の着差(秒)とクラス。人気・オッズは使わない</li>
      <li><b>減点方式</b>来る理由より「飛ぶ理由」を数える。重い減点(-2以下)が重なるほど追加で減点、3つで消し</li>
      <li><b>コース</b>同じ競馬場・同じ回りでの成績</li>
      <li><b>距離</b>延長は減点し軸にしない。短縮も小さく減点。距離実績を見る</li>
      <li><b>馬場</b>重・不良では道悪の成績を別に見る</li>
      <li><b>展開</b>逃げ馬3頭以上はハイ(前が不利・差し有利)、1頭以下はスロー(前残り)</li>
      <li><b>枠</b>脚質とセット。コースの枠順成績(下のコース傾向)を使い、記事に無い距離だけ
        短距離の外枠先行・多頭数の内枠差しを減点</li>
      <li><b>オッズ</b>評価が出た後に人気と見比べるだけ(過剰人気? / 妙味)</li>
    </ul>
    <div class="sec">コース傾向(10場・78コース)</div>
    <ul class="rules">
      <li><b>出典</b>titanic-online.com「競馬場の特徴」の各記事(2021〜2025年の集計)</li>
      <li><b>場のずれ</b>同じ馬が別の競馬場で続けて走ったときのタイム指数の差から、場ごとの目盛りのずれを求めて指数に足す
        (地方から来た馬とも比べられる)</li>
      <li><b>脚質</b>そのコースの逃げ・先行・中団・後方の3着内率を、芝/ダートの全コース平均と比べる。
        得なら加点(最大+3)、損なら減点(最大-4)。大きな損は「弱点」として◎○の重なりにも数える</li>
      <li><b>枠</b>そのコースの枠番別の3着内率を平均と比べて±2.5まで(この場合は一般の枠の決まりを使わない)</li>
      <li><b>堅さ</b>1・2番人気の3着内率が平均より高い「堅い」コースは2強の基準を0.5下げ、
        「荒れやすい」コースは0.5上げて穴馬を2頭まで拾う</li>
      <li><b>少ない出走</b>出走が少ないコースは平均に寄せて控えめに効かせる。記事に無い距離は、その場の芝/ダート全体を半分の重みで使う</li>
    </ul>
    <p class="muted" style="font-size:12px;margin:12px 0">閾値は目安。「収支・分析」で条件別の回収率を見て、儲かる条件にレースを絞っていく。</p>
    <p class="muted" style="font-size:11px;margin:12px 0">${esc(verText())}</p>`;
  modelBox();
}

boot();
