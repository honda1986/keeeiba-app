  }
  try {                                     // 2週間より前の分は消す
    const old = "keiba-navi:" + dstr(new Date(Date.now() - 14 * 864e5));
    for (const k of Object.keys(localStorage)) if (k.startsWith("keiba-navi:") && k < old) localStorage.removeItem(k);
  } catch (e) { /* 残っても困らない */ }
  store.set(key, JSON.stringify({at: Date.now(), races}));
  return races;
}
function drawNavi(r) {
  const box = document.getElementById("r-" + r.id);
  if (!box) return;
  box.querySelectorAll(".nv[data-u]").forEach(el => { el.innerHTML = naviTag(r, +el.dataset.u); });
  const l = box.querySelector(".nvl");
  if (l) l.outerHTML = naviLine(r);
}
// 中央の日を開いたとき、場ごとに1ページずつ取る
async function autoNavi() {
  if (!canLive() || !state.day || state.day.date < NAVI_FROM) return;
  const d = state.day.date, byV = {};
  for (const r of allRaces()) if (r.center === "jra" && /^\d{12}$/.test(r.id)) (byV[r.id.slice(4, 6)] = byV[r.id.slice(4, 6)] || []).push(r);
  for (const [v, rs] of Object.entries(byV)) {
    const k = d + v;
    if (naviState[k] === "busy" || naviState[k] === "ok") continue;
    naviState[k] = "busy"; rs.forEach(drawNavi);
    try {
      const races = await naviFetch(d, v);
      for (const r of rs) if (races[+r.id.slice(10, 12)]) naviData[r.id] = races[+r.id.slice(10, 12)];
      naviState[k] = "ok";
    } catch (e) {
      const m = String(e && e.message);
      naviState[k] = /HTTP 404/.test(m) ? "none" : /取れません/.test(m) ? "old" : "ng";
    }
    if (state.day && state.day.date === d) rs.forEach(drawNavi);
  }
}

// ---------------------------------------------------------------- 買い目を作る
// 予想に無いレースや券種も、自分で買い目を作って投票タブに入れる(この端末にだけ残る)
const TICKET_KEY = "keiba-tickets";
const loadTickets = () => { try { return JSON.parse(store.get(TICKET_KEY) || "{}") || {}; } catch (e) { return {}; } };
const saveTickets = v => store.set(TICKET_KEY, JSON.stringify(v));
const TYPES = ["単勝", "複勝", "枠連", "馬連", "ワイド", "馬単", "3連複", "3連単"];
const NEED = {"単勝": 1, "複勝": 1, "枠連": 2, "馬連": 2, "ワイド": 2, "馬単": 2, "3連複": 3, "3連単": 3};
// 枠の色(背景, 文字)
const WAKU_C = [null, ["#fff", "#222"], ["#222", "#fff"], ["#e8382f", "#fff"], ["#2f6fd6", "#fff"],
                ["#f5d000", "#222"], ["#2e9e4f", "#fff"], ["#f08a1c", "#fff"], ["#f39ac0", "#222"]];
const dowOf = d => "日月火水木金土"[toDate(d).getDay()];
const byNum = (a, b) => a - b;
const colsText = (t, sep) => (t.cols || []).slice(0, NEED[t.type]).map(c => c.join(",") || "?").join(sep);
const ticketId = t => `${t.rid}|${t.type}|${t.method}|${t.axis ?? ""}|${t.method === "フォーメーション" ? colsText(t, "/") : t.sel.join(",")}`;
const tKey = (t, c) => t.id + "#" + c.join("-");
// xs から k 個の組(順番なし)・並び(順番あり)
const combos = (xs, k) => k === 0 ? [[]] : xs.flatMap((x, i) => combos(xs.slice(i + 1), k - 1).map(c => [x, ...c]));
const perms = (xs, k) => k === 0 ? [[]] : xs.flatMap((x, i) => perms(xs.filter((_, j) => j !== i), k - 1).map(c => [x, ...c]));
// 買い目 t = {type, method, sel, axis, cols} を1点ずつの組にする(馬単・3連単は着順のまま、ほかは小さい順)
// フォーメーションは列(1頭目・2頭目・3頭目。馬単・3連単は1着・2着・3着)ごとに選んだ馬の組み合わせ(同じ馬は入れない)
function expand(t) {
  const k = NEED[t.type], ord = ORDERED_T.includes(t.type);
  let cs = [];
  if (k === 1) cs = t.sel.map(u => [u]);
  else if (t.method === "フォーメーション") {
    const cols = (t.cols || []).slice(0, k);
    let acc = cols.length === k ? [[]] : [];
    for (const c of cols) acc = acc.flatMap(a => c.filter(u => !a.includes(u)).map(u => [...a, u]));
    const seen = new Set();
    cs = acc.filter(c => { const key = (ord ? c : [...c].sort(byNum)).join("-"); return !seen.has(key) && seen.add(key); });
  }
  else if (t.method === "通常") cs = t.sel.length === k ? [t.sel] : [];
  else if (t.method === "ボックス") cs = (ord ? perms : combos)([...t.sel].sort(byNum), k);
  else if (t.method === "ながし" && t.axis != null)          // 馬単・3連単は軸が1着
    cs = (ord ? perms : combos)(t.sel.filter(u => u !== t.axis).sort(byNum), k - 1).map(c => [t.axis, ...c]);
  return cs.map(c => ord ? c : [...c].sort(byNum));
}
function selText(t) {
  if (t.method === "フォーメーション") return colsText(t, ORDERED_T.includes(t.type) ? "→" : "-");
  if (t.method === "ながし") return `軸${t.axis ?? "?"}${ORDERED_T.includes(t.type) ? "→" : "-"}${t.sel.join(",") || "?"}`;
  if (t.method === "通常" && NEED[t.type] > 1) return comboText(t.type, t.sel);
  return t.sel.join(",");
}
function ticketText(d, r, t) {
  const n = expand(t).length;
  return `${+d.slice(4, 6)}/${+d.slice(6, 8)} ${r.venue}${r.rno}R ${t.type}${t.method !== "通常" ? " " + t.method : ""} ${selText(t)} ` +
    (n > 1 ? `各${t.unit}円(${n}点 ${t.unit * n}円)` : `${t.unit}円`);
}
// どの買い方も、フォーメーションの列にすると同じ形になる(通常=1頭ずつ、ボックス=全部の列に全部、ながし=軸と相手)
function toCols(t) {
  const k = NEED[t.type];
  if (k === 1) return [t.sel];
  if (t.method === "フォーメーション") return (t.cols || []).slice(0, k);
  if (t.method === "ボックス") return Array.from({length: k}, () => [...t.sel]);
  if (t.method === "ながし") return [[t.axis], ...Array.from({length: k - 1}, () => [...t.sel])];
  return t.sel.map(u => [u]);
}
// アプリが IPAT の画面を進めるときの買い目(枠連は枠番)
const ipatBet = (d, r, t) => ({venue: r.venue, dow: dowOf(d), rno: r.rno, type: t.type, method: t.method,
  combo: t.method === "ながし" ? [t.axis, ...t.sel] : t.method === "フォーメーション" ? [...new Set(toCols(t).flat())] : t.sel,
  axis: t.axis, aite: t.method === "ながし" ? t.sel : [], cols: toCols(t), n: expand(t).length});
// 作った買い目を投票タブに入れて、その買い目(のリスト)を返す。
// 単勝・複勝は IPAT で1頭ずつしか入れられないので、何頭か選んだときは1頭ずつの買い目にする
function saveTicket(b) {
  const base = {d: b.d, rid: b.rid, type: b.type, method: b.method, axis: b.method === "ながし" ? b.axis : null,
                sel: b.method === "フォーメーション" ? [] : b.method === "通常" && ORDERED_T.includes(b.type) ? [...b.sel] : [...b.sel].sort(byNum),
                unit: b.unit};
  if (b.method === "フォーメーション") base.cols = b.cols.slice(0, NEED[b.type]).map(c => [...c].sort(byNum));
  const list = NEED[b.type] === 1 && base.sel.length > 1 ? base.sel.map(u => Object.assign({}, base, {sel: [u]})) : [base];
  list.forEach(t => { t.id = ticketId(t); });
  const ts = loadTickets();
  if (b.edit && !list.some(t => t.id === b.edit)) delete ts[b.edit];          // 「直す」で開いたときは置き換える
  if (b.edit) b.edit = list[0].id;
  for (const t of list) ts[t.id] = Object.assign({at: new Date().toISOString()}, ts[t.id] || {}, t);
  saveTickets(ts);
  return list;
}
// 自分の買い目の「買った」: 1点ずつ記録する(収支の集計は予想の買い目と同じ)
function markTicket(vs, t, on) {
  for (const [k, v] of Object.entries(vs)) if (v.t === t.id) delete vs[k];
  if (on) for (const c of expand(t))
    vs[tKey(t, c)] = {d: t.d, rid: t.rid, type: t.type, combo: c, unit: t.unit, at: new Date().toISOString(), t: t.id};
}

let bst = null;
function openBuilder(o) {
  const d = state.day;
  const rs = allRaces().filter(r => r.horses && r.horses.length);
  if (!d || !rs.length) { alert("出馬表が出ているレースがありません"); return; }
  const r = rs.find(x => x.id === o.rid) || rs.find(x => !x.result && (untilClose(d.date, x) ?? 1) > 0) || rs[0];
  if (!o.type && !o.sel && o.rid) {            // レースから開いたら、そのレースの今の買い方(見送りでも)を入れておく
    const b = mainBet(r);
    if (b) { o = Object.assign({}, o, {type: b[0], sel: b[1].split("-").map(Number)}); }
  }
  bst = {d: d.date, rid: r.id, type: o.type || "3連複", method: o.method || "通常", sel: [...(o.sel || [])], axis: o.axis ?? null,
         mode: o.axis != null ? "aite" : "axis", unit: o.unit || +store.get("keiba-unit") || 100, edit: o.edit,
         cols: o.cols ? o.cols.map(c => [...c]).concat([[], [], []]).slice(0, 3) : [[], [], []], col: 0};
  drawBuilder();
  $("#betdlg").showModal();
}
$("#betclose").onclick = () => $("#betdlg").close();
$("#betdlg").addEventListener("close", () => { if (!$("#v-vote").hidden) renderVote(); });

function drawBuilder() {
  const b = bst, d = state.day, r = d.races[b.rid];
  const rs = allRaces().filter(x => x.horses && x.horses.length);
  const k = NEED[b.type], ord = ORDERED_T.includes(b.type), waku = b.type === "枠連";
  if (k === 1) b.method = "通常";
  const t = () => ({type: b.type, method: b.method, sel: b.sel, axis: b.method === "ながし" ? b.axis : null, unit: b.unit, cols: b.cols});
  const colName = i => ord ? `${i + 1}着` : `${i + 1}頭目`;
  const cs = expand(t());
  const closed = !!r.result || (untilClose(b.d, r) ?? 1) <= 0;
  const marks = {};
  for (const h of (r.pred || {}).horses || []) if (h.mark && h.mark !== "×") marks[h.umaban] = h.mark;
  const live = r.horses.filter(h => !h.scratched);
  const opts = waku
    ? [...new Set(live.map(h => h.waku))].sort(byNum).map(w => ({u: w, w, nm: live.filter(h => h.waku === w).map(h => h.umaban).join("・") + "番"}))
    : r.horses.map(h => ({u: h.umaban, w: h.waku, nm: h.name || "", mk: marks[h.umaban] || "", off: h.scratched}));
  const on = u => b.method === "フォーメーション" ? b.cols[b.col].includes(u)
    : b.method === "ながし" ? (u === b.axis || b.sel.includes(u)) : b.sel.includes(u);
  const badge = u => {
    if (b.method === "フォーメーション")
      return b.cols.slice(0, k).map((c, i) => c.includes(u) ? i + 1 : 0).filter(Boolean).join("・");
    if (b.method === "ながし") return u === b.axis ? "軸" : b.sel.includes(u) ? "相手" : "";
    const i = b.sel.indexOf(u);
    return i < 0 ? "" : ord && b.method === "通常" ? `${i + 1}着` : "✓";
  };
  const what = waku ? "枠" : "馬";
  const hint = b.method === "フォーメーション" ? `${colName(b.col)}の${what}を選ぶ(いくつでも。列を切り替えて全部の列を選ぶ)`
    : b.method === "ながし" ? (b.mode === "axis" ? `軸の${what}を1つ選ぶ${ord ? "(1着に固定)" : ""}` : `相手の${what}を選ぶ(いくつでも)`)
    : b.method === "ボックス" ? `${what}を${k}つ以上選ぶ`
    : k === 1 ? `${what}を選ぶ(いくつでも。1つ1点)` : ord ? `${what}を1着から順に${k}つ選ぶ` : `${what}を${k}つ選ぶ`;
  const evLine = () => {
    if (!cs.length || !["単勝", "ワイド"].includes(b.type)) return "";
    const win = evProbs(r);
    if (!win) return "";
    let ps, os;
    if (b.type === "単勝") {
      ps = cs.map(c => win[c[0]] || 0); os = cs.map(c => { const h = r.horses.find(x => x.umaban === c[0]); return h && h.odds ? [h.odds, h.odds] : null; });
    } else {
      const wo = r.wide_odds || r.wide_final, P = wideProbs(r, win);
      if (!P) return `<br><span class="muted">ワイドのオッズがまだ無いので期待値は出せません</span>`;
      ps = cs.map(c => P[c.join("-")] || 0); os = cs.map(c => P[c.join("-")] ? wo[c.join("-")] : null);
    }
    if (os.some(o => !o)) return "";
    const lo = ps.reduce((a, p, i) => a + p * os[i][0], 0) / cs.length, hi = ps.reduce((a, p, i) => a + p * os[i][1], 0) / cs.length;
    return `<br>期待値 <b class="${evCls(lo)}">${lo === hi ? lo.toFixed(2) : lo.toFixed(2) + "〜" + hi.toFixed(2)}</b>` +
      (cs.length > 1 ? "(1点あたりの平均)" : `(当たる確率 約${pctS(ps[0])})`);
  };
  const sum = () => cs.length ? `<b>${cs.length}点 · ${yen(cs.length * b.unit)}</b>(1点${b.unit}円)<br>
      ${esc(cs.slice(0, 20).map(c => comboText(b.type, c)).join("  "))}${cs.length > 20 ? " …" : ""}${evLine()}` : `<span class="muted">${esc(hint)}</span>`;
  const box = $("#betbox");
  const sc = box.querySelector(".bgrid")?.scrollTop || 0;
  box.innerHTML = `
    <h3>買い目を作る</h3>
    <select id="bRace" aria-label="レース">${rs.map(x => {
      const cl = !!x.result || (untilClose(b.d, x) ?? 1) <= 0;
      return `<option value="${esc(x.id)}" ${x.id === b.rid ? "selected" : ""}>${esc(x.venue)} ${x.rno}R ${esc(x.start || "")} ${esc(x.name || "")}${cl ? "(締切)" : ""}</option>`;
    }).join("")}</select>
    <div class="bsec">券種</div>
    <div class="chips">${TYPES.map(x => `<button class="chip" data-bt="${x}" aria-pressed="${x === b.type}">${x}</button>`).join("")}</div>
    ${k > 1 ? `<div class="bsec">方式</div>
      <div class="chips">${["通常", "ボックス", "ながし", "フォーメーション"].map(x => `<button class="chip" data-bm="${x}" aria-pressed="${x === b.method}">${x}</button>`).join("")}</div>` : ""}
    ${b.method === "フォーメーション" ? `<div class="chips">${b.cols.slice(0, k).map((c, i) =>
      `<button class="chip" data-bc="${i}" aria-pressed="${b.col === i}">${colName(i)}<b>${c.length}</b></button>`).join("")}</div>` : ""}
    ${b.method === "ながし" ? `<div class="chips">${[["axis", "軸を選ぶ"], ["aite", "相手を選ぶ"]].map(([m, l]) =>
      `<button class="chip" data-bn="${m}" aria-pressed="${b.mode === m}">${l}</button>`).join("")}</div>` : ""}
    <div class="bsec">${esc(hint)}</div>
    <div class="bgrid">${opts.map(o => { const c = WAKU_C[o.w] || ["var(--surface2)", "var(--ink)"];
      return `<button class="hb" data-bu="${o.u}" aria-pressed="${on(o.u)}" ${o.off ? "disabled" : ""}>
        <span class="u" style="background:${c[0]};color:${c[1]}">${o.u}</span>
        <span class="nm">${o.mk ? `<b>${esc(o.mk)}</b>` : ""}${esc(o.nm)}</span><span class="o">${badge(o.u)}</span></button>`; }).join("")}</div>
    <div class="bsec">1点の金額(円)</div>
    <input id="bUnit" type="number" inputmode="numeric" min="100" step="100" value="${b.unit}" aria-label="1点の金額(円)">
    <div class="bsum" id="bSum">${sum()}</div>
    <div class="bact">
      ${canBuy() ? `<button class="btn on" id="bIpat" ${cs.length && !closed ? "" : "disabled"}>IPATで入力</button>` : ""}
      <button class="btn ${canBuy() ? "" : "on"}" id="bCopy" ${cs.length ? "" : "disabled"}>コピー</button>
      <button class="btn" id="bDone" ${cs.length ? "" : "disabled"}>買った</button>
    </div>
    <p class="legendnote">${closed ? "このレースは締切済みです(「買った」の記録だけ付けられます)。" : ""}
      ${canBuy() ? "「IPATで入力」はIPATの画面を金額入力まで自動で進めます(2頭以上の券種はIPATのフォーメーションで入れます。単勝・複勝は1頭ずつで、2頭目からは投票タブの「IPATで入力」で)。金額・セット・投票は自分で。" : ""}
      作った買い目は投票タブに入ります。</p>`;
  box.querySelector(".bgrid").scrollTop = sc;
  const clear = () => { b.sel = []; b.axis = null; b.mode = "axis"; b.cols = [[], [], []]; b.col = 0; };
  $("#bRace").onchange = e => { b.rid = e.target.value; clear(); drawBuilder(); };
  box.querySelectorAll("[data-bt]").forEach(x => x.onclick = () => {
    const nt = x.dataset.bt;
    if ((nt === "枠連") !== waku) clear();       // 枠番と馬番は別
    if (b.col >= NEED[nt]) b.col = 0;
    b.type = nt;
    if (b.method === "通常" && NEED[nt] > 1) b.sel = b.sel.slice(0, NEED[nt]);
    drawBuilder();
  });
  box.querySelectorAll("[data-bm]").forEach(x => x.onclick = () => {
    const nm = x.dataset.bm;
    if (b.method === "フォーメーション" && nm !== "フォーメーション") b.sel = [...new Set(b.cols.slice(0, k).flat())];
    if (nm === "フォーメーション" && b.method !== "フォーメーション") {      // 今の選び方を列に移す
      b.cols = toCols(t()).map(c => c.filter(u => u != null)).concat([[], [], []]).slice(0, 3);
      b.col = 0; b.sel = []; b.axis = null;
    }
    else if (nm === "ながし" && b.method !== "ながし") { b.axis = b.sel[0] ?? null; b.sel = b.sel.slice(1); b.mode = b.axis == null ? "axis" : "aite"; }
    else if (nm !== "ながし" && b.method === "ながし") { if (b.axis != null) b.sel = [b.axis, ...b.sel]; b.axis = null; }
    b.method = nm;
    if (nm === "通常") b.sel = b.sel.slice(0, k);
    drawBuilder();
  });
  box.querySelectorAll("[data-bn]").forEach(x => x.onclick = () => { b.mode = x.dataset.bn; drawBuilder(); });
  box.querySelectorAll("[data-bc]").forEach(x => x.onclick = () => { b.col = +x.dataset.bc; drawBuilder(); });
  box.querySelectorAll("[data-bu]").forEach(x => x.onclick = () => {
    const u = +x.dataset.bu;
    if (b.method === "フォーメーション") {
      const c = b.cols[b.col];
      b.cols[b.col] = c.includes(u) ? c.filter(v => v !== u) : [...c, u];
    } else if (b.method === "ながし") {
      if (b.mode === "axis") { b.axis = b.axis === u ? null : u; b.sel = b.sel.filter(v => v !== u); if (b.axis != null) b.mode = "aite"; }
      else if (u === b.axis) { b.axis = null; b.mode = "axis"; }
      else b.sel = b.sel.includes(u) ? b.sel.filter(v => v !== u) : [...b.sel, u];
    } else if (b.sel.includes(u)) b.sel = b.sel.filter(v => v !== u);
    else if (b.method === "通常" && k > 1 && b.sel.length >= k) return;        // 足りている(外してから選び直す)
    else b.sel = [...b.sel, u];
    drawBuilder();
  });
  // 金額は打つたびに合計だけ直す(描き直すと、続けて押したボタンが効かなくなる)
  $("#bUnit").oninput = e => { b.unit = Math.max(100, Math.round((+e.target.value || 100) / 100) * 100); $("#bSum").innerHTML = sum(); };
  $("#bUnit").onchange = e => { e.target.value = b.unit; store.set("keiba-unit", String(b.unit)); };
  const ip = $("#bIpat");
  if (ip) ip.onclick = () => {
    const [tk] = saveTicket(b);            // 単勝・複勝の2頭目からは、投票タブの「IPATで入力」で1頭ずつ
    $("#betdlg").close();
    window.KeibaApp.buy(JSON.stringify({text: ticketText(b.d, r, tk), bet: ipatBet(b.d, r, tk)}));
  };
  $("#bCopy").onclick = () => copyText(saveTicket(b).map(tk => ticketText(b.d, r, tk)).join("\n"), $("#bCopy"));
  $("#bDone").onclick = () => {
    const vs = loadVotes();
    for (const tk of saveTicket(b)) markTicket(vs, tk, true);
    saveVotes(vs);
    $("#betdlg").close(); showTab("vote"); scrollTo(0, 0);
  };
}

// 画面(GitHub Pages に置いた時刻)とアプリの版。更新が届いたかを確かめる用
function verText() {
  const t = new Date(document.lastModified);
  let app = "";
  try { app = window.KeibaApp && window.KeibaApp.version ? window.KeibaApp.version() : ""; } catch (e) { /* 古いアプリ */ }

// 考え方の「荒れ度」: 段ごとに、1番人気が実際に3着に来なかった率(年ごとに、ほかの年で学んだ式で読んだもの)
function chaosRule() {
  const c = chaosState.model;
  if (!c) return "";
  const pc = v => v == null ? "-" : Math.round(v * 100) + "%";
  const rows = (c.bands || []).map(b => `<tr><td>${pc(b.lo)}〜${b.hi >= 1 ? "" : pc(b.hi)}</td><td>${chaosLevel(b.lo)}</td><td>${b.races.toLocaleString()}</td>
    <td><b>${pc(b.actual)}</b></td><td>${pc(b.expect)}</td></tr>`).join("");
  return `<div class="sec">荒れ度(参考)</div>
    <ul class="rules">
      <li><b>何か</b>1番人気が3着に来ない確率。単勝オッズだけから出す(1番人気のオッズが高いほど、オッズが横並びなほど荒れる)。
        高 55%以上・中 40%以上・低 それ未満。結果が出たレースは確定オッズ、それまでは今のオッズで計算する</li>
      <li><b>買い方には使わない</b>買うレースはほとんど◎が1番人気で、荒れ度は低い。買うレースを荒れ度の低い順に4つに分けても、
        今の買い方の回収率は 137%・131%・120%・127% で、年ごとの上下も入れ替わる。見送ったレースを荒れ度で選んで買っても
        100%を超えない(2024〜2026年)</li>
    </ul>
    <table class="tbl"><thead><tr><th>荒れ度</th><th></th><th>R</th><th>1番人気が3着外</th><th>見込み</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="muted" style="font-size:11px;margin:4px 0 0">中央 ${esc((c.years || []).join("〜"))}年の ${(c.races || 0).toLocaleString()}R(年ごとに、ほかの年で学んだ式で読んだ分)。
      毎週の学び直しで作り直す(${esc(c.fitted || "")})</p>`;
}
// 割安ワイドの説明
function gapRule() {
  const g = (state.hist || {}).gap || [];
  const t = g.reduce((a, r) => [a[0] + r[1], a[1] + r[2], a[2] + r[3]], [0, 0, 0]);
  return `<div class="sec">割安ワイド(新しい買い方・確かめ中。2026-11-10)</div>
    <ul class="rules">
      <li><b>何か</b>同じ「2頭とも3着内」を、3連複を買う人たちとワイドを買う人たちがどう見ているかをくらべ、
        <b>3連複の市場は来ると見ているのに、ワイドではまだ売れていない組</b>のワイドを買う</li>
      <li><b>なぜ</b>3着内に来る馬は、単勝オッズよりワイドのオッズ、ワイドより3連複のオッズの方が正確に当てている
        (売上がいちばん大きく、よく調べて買う人が多い)。ワイドの値段は3連複に追いついていないことがある</li>
      <li><b>割安度</b>= 3連複の見込み(0.75 × その2頭を含む3連複の組の 1/オッズ の合計)÷ ワイドの見込み(0.775 ÷ ワイドのオッズ)。
        1レースで割安度がいちばん高い組(ワイド ${GAP.lo}〜${GAP.hi}倍の中で)が <b>${GAP.th.toFixed(1)} 以上</b>なら、その1点を買い目にする。5レースに1つくらい出る</li>
      <li><b>確かめたこと</b>2022〜2026年の中央の全レース(確定オッズ)で、どのオッズの帯・どの年でも、割安度が高い組ほどワイドの的中も回収率も上がる。
        買い目にする組は${t[0] ? ` ${t[0].toLocaleString()}R・的中 ${pct(t[1], t[0])}・回収率 <b>${pct(t[2], t[0] * 100)}</b>` : " 約109%"}(年ごとは「収支・分析」)</li>
      <li><b>まだ分からないこと</b>上の成績は<b>確定オッズ</b>で選んだ場合。買うときに見えるのは発走の数分前のオッズで、締切の直前に大きく動く。
        発走前のオッズで選んでも同じように当たるかは、2026-11-14 の開催から記録して確かめている。それまでは参考</li>
      <li><b>見方</b>レースの欄の「割安ワイド」に、買い目・ワイドのオッズ・割安度・結果を出す。過去の日は確定オッズで選んだもの、
        当日は発走前に取ったオッズ(アプリは開いたときに取り直す)で選んだもの</li>
    </ul>`;
}
