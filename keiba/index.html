}

// 買い目のあるレース(カード)を先に、無いレース・予想前(1行ずつ、1つの枠にまとめる)を後に。どちらも発走順
function drawList() {
  const box = $("#rlist");
  if (!box) return;
  const shown = allRaces().filter(r => centerOkR(r) && raceVisible(r));
  if (!shown.length) {
    box.innerHTML = `<div class="empty">${allRaces().length ? "この条件に合うレースはありません。" : "この日は中央の開催がありません。"}</div>`;
    return;
  }
  const isBuy = r => ["buy", "hit", "lose"].includes(raceKind(r));
  const buys = shown.filter(isBuy), rest = shown.filter(r => !isBuy(r));
  let html = buys.length ? `<div class="sec">買い目のあるレース ${buys.length}</div>` + buys.map(card).join("") : "";
  if (rest.length) {
    html += `<div class="sec">${KOCHI ? "レース" : "買い目のないレース"} ${rest.length}<span class="muted" style="font-weight:400"> · 押すと予想が開きます</span></div>`
      + `<div class="card">${rest.map(r => raceKind(r) === "wait" ? waitRow(r) : skipRow(r)).join("")}</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll("[data-mk]").forEach(b => b.onclick = () => openBuilder({rid: b.dataset.mk}));
  box.onclick = e => {
    const b = e.target.closest("[data-buy]");
    if (b && canBuy()) window.KeibaApp.buy(b.dataset.buy);
  };
}

function waitRow(r) {
  return `<div class="waitr" id="r-${esc(r.id)}"><b>${head(r)}</b><span class="r">予想前(出馬表・馬柱を取っているところ)</span></div>`;
}

// 締切前でいちばん早い、買い目のあるレース。押すとそのレースへ飛ぶ
function drawNextBuy() {
  const el = $("#nextbuy"), d = state.day;
  if (!el || !d) return;
  const r = races().filter(x => centerOkR(x) && !x.result && picksOf(x).length && (untilClose(d.date, x) ?? -1) > 0)[0];
  if (!r) { el.innerHTML = ""; return; }
  const m = untilClose(d.date, r), p = r.pred, g = gapOf(r), bets = [];
  if (g && g.buy) bets.push(`ワイド ${g.pair.join("-")}(${g.odds[0]}〜${g.odds[1]}倍)`);
  if (p.verdict !== "見送り") bets.push(...p.bets.map(b => `${b.type} ${b.combos.map(c => comboText(b.type, c)
    + (comboOdds(r, b.type, c) ? `(${comboOdds(r, b.type, c)})` : "")).join(",")}`));
  el.innerHTML = `<button class="nextb" data-rid="${esc(r.id)}">
    <span class="t"><span class="k">次の買い目${m < 120 ? ` · <b>締切まで ${m}分</b>` : ""}</span>
    <b>${head(r)}</b> <span class="num">${esc(bets.join(" / "))}</span></span><span class="muted">›</span></button>`;
  el.querySelector("button").onclick = () => jumpRace(r.id);
}

// 表のマスから、そのレースへ飛ぶ(絞り込みで隠れていたら外してから開く)
function jumpRace(rid, smooth = true) {
  const r = allRaces().find(x => x.id === rid);
  if (!r) return;
  if (!centerOkR(r) || !raceVisible(r)) {
    if (!centerOkR(r)) state.center = "all";
    state.filter = "all"; state.q = ""; saveRace(); renderRace();
  }
  const node = document.getElementById("r-" + rid);
  if (!node) return;
  if (node.tagName === "DETAILS") node.open = true;
  node.scrollIntoView({behavior: smooth ? "smooth" : "auto", block: "center"});
  node.classList.add("flash"); setTimeout(() => node.classList.remove("flash"), 1600);
  document.querySelectorAll(".cell.cur").forEach(c => c.classList.remove("cur"));
  const c = document.querySelector(`.cell[data-rid="${rid}"]`);
  if (c) c.classList.add("cur");
  setHash(state.day.date, rid);
}

function head(r) {
  return `${esc(r.venue)} ${r.rno}R ${esc(r.start || "")}`;
}
function meta(r) {
  return [r.surface ? (r.surface === "ダ" ? "ダート" : r.surface) + (r.dist || "") : "", r.direction ? r.direction + "回り" : "",
          BABA[r.baba] || "", r.n ? r.n + "頭" : "", r.name].filter(Boolean).map(esc).join(" · ");
}
function hname(r, u) { return (r.horses.find(h => h.umaban === u) || {}).name || ""; }

// 買い目のオッズ(3連複は ◎-○-x のオッズ、ワイドは下限〜上限)。取れていなければ空
function comboOdds(r, type, c) {
  const k = [...c].sort((a, b) => a - b).join("-");
  if (type === "3連複") { const o = (r.trio_odds || {})[k]; return o ? `${o}倍` : ""; }
  if (type === "ワイド") { const o = (r.wide_odds || r.wide_final || {})[k]; return o ? `${o[0]}〜${o[1]}倍` : ""; }
  return "";
}
function betOdds(r, b) {
  const t = b.combos.map(c => comboOdds(r, b.type, c)).filter(Boolean).join(" / ");
  return t ? ` <span class="muted">${esc(t)}</span>` : "";
}
// ---------------------------------------------------------------- 割安なワイド(確かめ中。2026-11-10)
// 3連複の市場の見込み(0.75 × 組の強さ。組の強さ = その2頭を含む3連複の組の 1/オッズ の合計)が、
// ワイドの市場の見込み(0.775 ÷ ワイドのオッズ)よりはっきり高い組。3着内の当たり方は3連複の市場の方が正確で、
// 比が大きい組ほどワイドの回収率が上がる(keiba_logic.GAP・wide_gap と同じ計算。tools/experiments/trio_pair_wide.py)
const GAP = {lo: 1.5, hi: 15, th: 1.30, pt: 0.75, pw: 0.775};
function wideGap(tp, wide) {
  if (!tp || !wide) return null;
  let best = null;
  for (const [k, v] of Object.entries(wide)) {
    const s = tp[k];
    if (!s) continue;
    const lo = Array.isArray(v) ? v[0] : v, hi = Array.isArray(v) ? v[1] : v;
    if (!lo || !hi) continue;
    const w = (lo + hi) / 2;
    if (!(w >= GAP.lo && w < GAP.hi)) continue;
    const ratio = GAP.pt * s * w / GAP.pw;
    if (!best || ratio > best.ratio || (ratio === best.ratio && k > best.key)) best = {key: k, pair: k.split("-").map(Number), ratio, odds: [lo, hi]};
  }
  if (best) best.buy = best.ratio >= GAP.th;
  return best;
}
// 3連複の全部の組のオッズ -> 組ごとの強さ(keiba.py の trio_pair_sums と同じ)
function trioPairSums(to) {
  const s = {};
  for (const [k, o] of Object.entries(to)) {
    const us = k.split("-");
    if (us.length !== 3 || !(o > 1)) continue;
    for (const [a, b] of [[0, 1], [0, 2], [1, 2]]) { const key = us[a] + "-" + us[b]; s[key] = (s[key] || 0) + 1 / o; }
  }
  const out = {};
  for (const [k, v] of Object.entries(s)) if (v >= 0.003) out[k] = Math.round(v * 1e5) / 1e5;
  return out;
}
// そのレースの割安なワイド。発走前のオッズ(当日に取った分・アプリで取り直した分)があればそれで、
// 無ければ確定オッズで(過去の日。買う時点では分からないので参考)。結果が出ていれば払戻も
function gapOf(r) {
  if (KOCHI || r.center !== "jra" || !r.horses) return null;
  const done = !!(r.result && (r.result.order || []).length >= 3);
  // gw = 3連複の組の強さ(trio_pair)と同じ時刻のワイドのオッズ(アプリが片方だけ取り直したときに、時刻のちがう2つを比べない)
  let g = wideGap(r.trio_pair, r.gw || r.wide_odds), src = "pre";
  if (!g && done) { g = wideGap(r.trio_pair_final, r.wide_final); src = "fin"; }
  if (!g) return null;
  g.src = src; g.done = done;
  if (done) {
    const out = r.horses.filter(h => h.scratched).map(h => h.umaban);
    g.void = g.pair.some(u => out.includes(u));
    g.ret = g.void ? 0 : (((r.result.payout || {})["ワイド"] || {})[g.key] || 0);
  }
  return g;
}
function gapInner(r) {
  const g = gapOf(r);
  if (!g || !g.buy) return "";
  const st = g.void ? `<span class="pk-r muted">取消で返還</span>`
    : g.done ? (g.ret ? `<span class="pk-r good">的中 ${yen(g.ret)}</span>` : `<span class="pk-r neg">外れ</span>`) : `<span class="pk-r muted">発走前</span>`;
  return `<div class="pk gap ${g.done && !g.void ? (g.ret ? "hit" : "lose") : ""}">
    <div class="pk-h"><span>割安ワイド<em>確かめ中</em></span><span>${g.src === "pre" ? (g.done ? "発走前のオッズで選んだ" : "いまのオッズで") : "確定オッズで選んだ(参考)"}</span></div>
    <div class="pk-b"><span class="ty">ワイド</span><span class="cb num">${g.pair.join("-")}</span>
      <span class="od num">${g.odds[0]}〜${g.odds[1]}倍 · 割安度 ${g.ratio.toFixed(2)}</span>${st}</div>
    <div class="pk-n">${g.pair.map(u => `${u} ${esc(hname(r, u))}`).join(" ・ ")}</div>
    ${!g.done && buyBtn(r, "ワイド", g.pair) ? `<div class="pk-a">${buyBtn(r, "ワイド", g.pair)}</div>` : ""}</div>`;
}
// モデルの買い目(3連複◎-○-▲、▲が延長ならワイド◎-○)。always なら見送りのときも理由を出す
function modelPick(r, always) {
  const p = r.pred, s = r.settle, done = !!(r.result && s);
  if (p.verdict === "見送り") {
    return always && !KOCHI ? `<div class="pk none"><div class="pk-h"><span>モデルの買い目</span><span></span></div>
      <div class="pk-b">見送り<span class="od">${esc(shortReason(p.reason))}</span></div></div>` : "";
  }
  const rows = p.bets.map(b => {
    const st = done ? (b.hit && b.hit.length ? `<span class="pk-r good">的中 ${yen(b.ret || 0)}</span>` : `<span class="pk-r neg">外れ</span>`)
      : `<span class="pk-r muted">発走前</span>`;
    return `<div class="pk-b bet"><span class="ty">${esc(b.type)}</span>
      <span class="cb num">${b.combos.map(c => c.join(b.type === "3連単" ? "→" : "-")).join("  ")}</span>
      <span class="od num"><span class="bo">${betOdds(r, b)}</span>${b.combos.length * b.unit !== 100 ? ` ${b.combos.length}点×${b.unit}円` : ""}</span>${st}</div>
      <div class="pk-n">${esc(b.kind)} … ${esc(b.role)}</div>
      ${!done && b.combos.length === 1 && buyBtn(r, b.type, b.combos[0], b.unit) ? `<div class="pk-a">${buyBtn(r, b.type, b.combos[0], b.unit)}</div>` : ""}`;
  }).join("");
  return `<div class="pk model ${done ? (s.hit ? "hit" : "lose") : ""}">
    <div class="pk-h"><span>モデルの買い目<em class="v${esc(p.verdict)}">${esc(p.verdict)}</em></span><span>${p.src === "backfill" ? "再現した予想" : ""}</span></div>${rows}</div>`;
}
// ◎○▲(確率・オッズ・結果が出ていれば着順)
function marks(r) {
  const p = r.pred;
  if (!p || !p.honmei) return "";
  const res = r.result, fo = (res || {}).odds || {}, done = res && (res.order || []).length >= 3;
  const row = (m, u) => {
    if (!u) return "";
    const e = p.horses.find(h => h.umaban === u) || {}, ho = r.horses.find(h => h.umaban === u) || {};
    const rk = done ? res.order.indexOf(u) + 1 : 0, od = fo[u] || ho.odds;
    return `<div class="mkr"><span class="m">${m}</span><span class="u num">${u}</span>
      <span class="n">${esc(ho.name || "")}<small>${esc(e.style || "")} <span class="nv" data-u="${u}">${naviTag(r, u)}</span></small></span>
      <span class="p num">${e.p3 != null ? Math.round(e.p3 * 100) + "%" : ""}</span>
      <span class="o num" data-mo="${u}">${od ? od + "倍" : ""}</span>
      ${done ? `<span class="rk ${rk && rk <= 3 ? "in" : ""}">${rk ? rk + "着" : "-"}</span>` : ""}</div>`;
  };
  return `<div class="mk3 ${done ? "d" : ""}"><div class="mkh"><span></span><span></span><span>馬</span><span>3着内</span><span>単勝</span>${done ? "<span>結果</span>" : ""}</div>
    ${row("◎", p.honmei)}${row("○", p.taikou)}${row("▲", (p.aite || [])[0])}</div>`;
}
function rcHead(r) {
  const res = r.result, done = res && (res.order || []).length >= 3;
  const m = !done && state.day ? untilClose(state.day.date, r) : null;
  const st = done ? `<span class="st">結果 <b class="num">${res.order.slice(0, 3).join("-")}</b></span>`
    : m != null && m > 0 && m < 120 ? `<span class="st soon">締切まで ${m}分</span>` : "";
  return `<div class="rc-h"><span class="ti">${esc(r.venue)} ${r.rno}R</span><span class="tm num">${esc(r.start || "")}</span>${st}</div>
    <div class="rc-m">${meta(r)} <span class="czs">${chaosTag(r, true)}</span></div>`;
}
function resLine(r) {
  const res = r.result;
  return `<div class="res">結果 <b class="num">${res.order.slice(0, 3).join("-")}</b>
    <div class="muted" style="margin-top:2px">${res.order.slice(0, 3).map((u, i) => `${i + 1}着 ${u} ${esc(hname(r, u))}`).join(" / ")}</div>${altLine(r)}</div>`;
}
// くわしい中身(理由・荒れ度・コース・期待値・全馬の評価)。カードでも1行のレースでも同じ
function detailInner(r) {
  const p = r.pred, res = r.result, g = gapOf(r);
  return `${p.reason ? `<div class="note"><div>${p.verdict === "見送り" ? "モデルは見送り: " : "モデル: "}${esc(p.reason)}${p.pace ? "(展開: " + esc(p.pace.note) + ")" : ""}</div></div>` : ""}
    ${p.notes && p.notes.length ? `<div class="note">${p.notes.map(n => `<div>${esc(n)}</div>`).join("")}</div>` : ""}
    ${g && !g.buy ? `<div class="note"><div>割安ワイド: なし(割安度がいちばん高い組は ${g.pair.join("-")} の ${g.ratio.toFixed(2)}。${GAP.th.toFixed(1)} 以上で買い目にする)</div></div>` : ""}
    ${chaosOf(r) ? `<div class="note czl">${chaosLine(r)}</div>` : ""}
    ${res && res.order && res.order.length >= 3 ? resLine(r) : ""}
    ${courseBox(p.course)}${naviLine(r)}${evBox(r)}
    <div class="mkrow"><button class="btn sm" data-mk="${esc(r.id)}">買い目を作る</button></div>
    ${p.horses.length ? table(r) : ""}`;
}
function card(r) {
  return `<article class="rc" id="r-${esc(r.id)}">${rcHead(r)}${marks(r)}
    <div class="gapw">${gapInner(r)}</div>${modelPick(r, true)}
    <details class="more"><summary>くわしく(理由・コース・全馬の評価)</summary>${detailInner(r)}</details></article>`;
}

// コース傾向(中央は titanic-online.com の2021〜2025年の集計、地方はうまめし.com の記事)
function courseBox(c) {
  if (!c) return "";
  const t = c.text || {};
  const nar = !!c.source;
  const tag = (v, good) => v ? `<span class="tag ${good ? "p" : "o"}">${esc(v)}</span>` : "";
  const fav = c.fav_top3 != null ? `1・2番人気の3着内率 ${Math.round(c.fav_top3 * 100)}%` : "";
  const rows = (nar ? [["このコース", t["特徴"]], ["この場", t["場"]]]
    : [["脚質", t["脚質傾向"]], ["枠", t["枠順傾向"]], ["ペース", t["ペース傾向"]],
       ["向く馬", t["向いている馬"]], ["向かない馬", t["不向きな馬"]], ["最初のコーナーまで", t["最初のコーナーまで"]]])
    .filter(([, v]) => v);
  const src = nar ? "出典: うまめし.com 地方競馬場の特徴と傾向(記事を読んでまとめたもの。数字は記事の集計)"
    : "出典: titanic-online.com 競馬場の特徴(2021〜2025年)";
  return `<details class="more cbox"><summary>コース傾向 ${esc(c.name)} ${tag(c.lean, true)}${tag(c.waku, true)}${tag(c.kata, c.kata === "堅い")}</summary>
    <div class="note" style="padding-top:2px">${rows.map(([k, v]) => `<div><b>${esc(k)}</b> ${esc(v)}</div>`).join("")}
    ${fav ? `<div>${esc(fav)}(${c.races}レース)</div>` : ""}
    <div class="muted">${c.exact || nar ? "" : "この距離の記事が無いので、この場の芝/ダート全体の傾向。"}${src}</div></div></details>`;
}

// 同じ◎○で、ほかの買い方を1点100円で買っていたら(参考)。払戻表にその券種が無ければ出さない
function altLine(r) {
  const p = r.pred, pay = (r.result || {}).payout || {};
  if (!p.honmei || !p.taikou || !r.result || (r.result.order || []).length < 3) return "";
  const pair = [p.honmei, p.taikou].sort((a, b) => a - b).join("-"), main = mainBet(r);
  const xs = [refBet(r, "3連複"), refBet(r, "ワイド"), ["馬連", pair, "馬連◎-○"], ["馬単", p.honmei + "-" + p.taikou, "馬単◎→○"], ["単勝", String(p.honmei), "単勝◎"]]
    .filter(x => x && pay[x[0]] && !(main && x[0] === main[0])).map(([t, k, label]) => { const y = pay[t][k] || 0;
      return `${label} ${y ? `<b class="good">${yen(y)}</b>` : `<span class="muted">×</span>`}`; });
  return xs.length ? `<div class="muted" style="margin-top:2px">ほかの買い方なら(参考): ${xs.join(" · ")}</div>` : "";
}

// 参考の買い目 [券種, 払戻表のキー, 名前]。3連複は◎○▲(▲=相手の1頭目)、ワイドは◎-○。組めなければ null
function refBet(r, typ) {
  const p = r.pred || {}, a = (p.aite || [])[0];
  if (!p.honmei || !p.taikou || (typ === "3連複" && !a)) return null;
  const us = typ === "3連複" ? [p.honmei, p.taikou, a] : [p.honmei, p.taikou];
  return [typ, us.sort((x, y) => x - y).join("-"), typ === "3連複" ? "3連複◎○▲" : "ワイド◎-○"];
}
// そのレースの買い方。買ったレースは実際の券種、見送りは今の買い方
// (中央は3連複◎○▲、▲が距離延長ならワイド◎-○。地方はワイド◎-○。keiba_logic の TH["jra_bet"]・TH["trio_wide_if"])
function mainBet(r) {
  const p = r.pred || {}, t = ((p.bets || [])[0] || {}).type;
  const a = (p.horses || []).find(h => h.umaban === (p.aite || [])[0]) || {};
  const jra = r.center === "jra" && !(a.axis_ng || []).includes("距離延長");
  return refBet(r, ["3連複", "ワイド"].includes(t) ? t : jra ? "3連複" : "ワイド") || refBet(r, "ワイド");
}
// 見送ったレースで、もし今の買い方で買っていたら(参考。収支には入れない)。結果が無ければ null
function skipRef(r) {
  const res = r.result, b = mainBet(r);
  if (!res || !res.order || res.order.length < 3 || !b) return null;
  return {ret: ((res.payout || {})[b[0]] || {})[b[1]] || 0, label: b[2]};
}

function skipRes(r) {
  const p = r.pred, res = r.result, s = r.settle || {};
  if (!res || !res.order || res.order.length < 3) return "";
  const ref = skipRef(r);
  const names = res.order.slice(0, 3).map((u, i) => `${i + 1}着 ${u} ${esc(hname(r, u))}`).join(" / ");
  return `<div class="res">結果 <b class="num">${res.order.slice(0, 3).join("-")}</b>
    ${ref ? ` · ◎${s.honmei_rank ?? "-"}着 ○${s.taikou_rank ?? "-"}着 · ${ref.label}なら
      ${ref.ret ? `<b class="good">的中 ${yen(ref.ret)}</b>` : `<span class="neg">不的中</span>`}
      <span class="muted">(見送ったので収支には入らない)</span>` : ""}
    <div class="muted" style="margin-top:2px">${names}</div></div>`;
}

// 荒れ度: 1番人気が3着に来ない確率。中央は chaos_model.json の式(tools/chaos_fit.py。keiba_final.chaos_x・chaos と同じ計算)。
// 結果が出たレースは確定オッズ、それまでは今のオッズ(アプリで取り直せばその分)から。参考で、買い方には使わない。
// 高知の最終レースは予想の理由(サーバーで計算)に出す
const chaosState = {model: null};
const chaosLevel = p => p >= .55 ? "高" : p >= .4 ? "中" : "低";       // keiba_final.chaos_level と同じ
function chaosOf(r) {
  const c = chaosState.model;
  if (!c || KOCHI || r.center !== "jra") return null;
  const ro = (r.result || {}).odds, fin = !!(ro && Object.keys(ro).length);
  const od = (fin ? Object.entries(ro).map(([u, v]) => [+u, +v]) : (r.horses || []).map(h => [h.umaban, +h.odds])).filter(([, v]) => v > 1);
  if (od.length < 5) return null;
  const fav = od.reduce((a, b) => b[1] < a[1] ? b : a);
  const q = od.map(([, v]) => 1 / v), sum = q.reduce((a, b) => a + b, 0);
  const x = [Math.log(fav[1]), -q.reduce((a, v) => a + v / sum * Math.log(v / sum), 0) / Math.log(od.length)];
  const z = c.w[0] + x.reduce((a, v, i) => a + c.w[i + 1] * (v - c.mu[i]) / c.sd[i], 0), p = 1 / (1 + Math.exp(-z));
  return {p, fav: fav[0], level: chaosLevel(p), fin};
}
function chaosTag(r, short) {
  const c = chaosOf(r);
  if (!c) return "";
  return `<span class="tag ${c.level === "高" ? "m" : c.level === "中" ? "o" : "n"}">${short ? "荒れ" + c.level : `荒れ度 ${c.level} ${Math.round(c.p * 100)}%`}</span>`;
}
function chaosLine(r) {
  const c = chaosOf(r);
  return c ? `${chaosTag(r)} 1番人気(${c.fav}番)が3着に来ない確率(${c.fin ? "確定" : "今の"}オッズから。参考)` : "";
}

// 見送りの理由の短い形(一覧の1行用)。合わない形はそのまま
function shortReason(t) {
  t = t || "";
  let m;
  if ((m = t.match(/^◎が基準未満\(◎の3着内(\d+%)で基準(\d+%)/))) return `◎${m[1]}(基準${m[2]})`;
  if ((m = t.match(/^◎と○が近い\(◎(\d+%)・○(\d+%)/))) return `◎○が近い ◎${m[1]}・○${m[2]}`;
  if ((m = t.match(/^荒れ度 (.): 1番人気\((\d+)番\)が3着に来ない確率 (\d+%)/))) return `荒れ度 ${m[1]}(1番人気${m[2]}番 3着外${m[3]})`;
  if ((m = t.match(/^(混戦|人気どおり)\((◎|○)の3着内(\d+%)/))) return `${m[1]} ${m[2]}${m[3]}`;
  if ((m = t.match(/^1強\((◎\d+%・○\d+%)\)$/))) return `1強 ${m[1]}`;
  if ((m = t.match(/^少頭数\((\d+頭)/))) return `少頭数 ${m[1]}`;
  if (t.startsWith("過去走のない馬が多い")) return "新馬・能力不明";
  if (t.startsWith("障害・ばんえい")) return "障害(対象外)";
  if (t.startsWith("◎○の弱点が重なる")) return "◎○の弱点が重なる";
  return t.length > 14 ? t.replace(/\(.*\)$/, "") : t;
}

function skipRow(r) {
  const res = r.result, done = res && (res.order || []).length >= 3;
  return `<details class="skipd more" id="r-${esc(r.id)}"><summary class="skip">
    <b>${esc(r.venue)} ${r.rno}R</b><span class="tm num">${esc(r.start || "")}</span>
    <span class="r">${esc(shortReason(r.pred.reason))}</span><span class="czs">${chaosTag(r, true)}</span>
    ${done ? `<span class="rs num">${res.order.slice(0, 3).join("-")}</span>` : ""}</summary>
    <div class="rc-m" style="padding-top:2px">${meta(r)}</div>${marks(r)}<div class="gapw"></div>${detailInner(r)}</details>`;
}

const evCls = v => v >= 1 ? "ev up" : "ev";
// 騎手の得意・苦手(このコース → この距離帯 → この競馬場 の順に、10回以上乗っていて、ふだんより8ポイント以上違う1つだけ)
function jockeyTag(r, h) {
  const jk = h.jk;
  if (!jk || !jk.all || !jk.all[0]) return "";
  const base = jk.all[1] / jk.all[0];
  const dist = r.surface ? (r.surface === "ダ" ? "ダート" : r.surface) + "のこの距離帯" : "この距離帯";
  for (const [k, l] of [["course", "このコース"], ["dist", dist], ["venue", "この競馬場"]]) {
    const x = jk[k];
    if (!x || x[0] < 10) continue;
    const v = x[1] / x[0], d = v - base;
    if (Math.abs(d) < 0.08) continue;
    return `<span class="tag ${d > 0 ? "p" : "m"}">騎手${d > 0 ? "得意" : "苦手"}: ${l} 3着内${Math.round(v * 100)}%(${x[0]}回・ふだん${Math.round(base * 100)}%)</span>`;
  }
  return "";
}
// 追切評価(AI競馬ナビ。アプリがその場で取る。下の「追切評価」)。S・A は緑、D は赤
function naviTag(r, u) {
  const x = (naviData[r.id] || {})[u];
  if (!x || !/^[SABCD]$/.test(x[0])) return "";
  return `<span class="tag ${"SA".includes(x[0]) ? "p" : x[0] === "D" ? "m" : "n"}">追切${x[0]}${x[1] != null ? " " + x[1] : ""}` +
    `${x[2] ? " · " + esc(x[2]) : ""}${x[3] ? " · 自己ベスト" : ""}</span>`;
}
function naviLine(r) {
  const d = state.day?.date;
  if (r.center !== "jra" || !d || d < NAVI_FROM || !/^\d{12}$/.test(r.id)) return "";
  const st = naviState[d + r.id.slice(4, 6)];
  const s = !canLive() ? "アプリでは馬の札に出ます" : st === "busy" ? "取得中…" : st === "old" ? "アプリを新しくすると馬の札に出ます"
    : st === "ng" ? "取れませんでした(あとで開き直す)" : st === "none" ? "まだ出ていません"
    : st === "ok" && !naviData[r.id] ? "このレースは出ていません" : "";
  return `<div class="note nvl" style="padding-top:2px">追切評価:
    <a href="${NAVI}${d}/${r.id.slice(4, 6)}/#r${+r.id.slice(10, 12)}" class="ext" target="_blank" rel="noopener">AI競馬ナビ</a>${s ? " · " + s : ""}</div>`;
}
const oddsCell = (ho, win) => `${ho.ninki ? ho.ninki + "人" : "-"}<br><span class="muted">${ho.odds ?? ""}</span>` +
  (win && win[ho.umaban] && ho.odds ? `<br><span class="${evCls(win[ho.umaban] * ho.odds)}">期${(win[ho.umaban] * ho.odds).toFixed(2)}</span>` : "");
function table(r) {
  const p = r.pred;
  const win = evProbs(r);
  const rows = p.horses.map(h => {
    const ho = r.horses.find(x => x.umaban === h.umaban) || {};
    const tags = h.minus.map(m => `<span class="tag m">${esc(m.t)} ${m.p}</span>`).join("")
      + h.plus.map(m => `<span class="tag p">${esc(m.t)} +${m.p}</span>`).join("")
      + (h.axis_ng.length ? `<span class="tag o">軸不可: ${esc(h.axis_ng.join("・"))}</span>` : "")
      + (h.cut ? `<span class="tag m">${esc(h.cut_reason || "負け要因が多い")}</span>` : "")
      + (h.odds_note ? `<span class="tag o">${esc(h.odds_note)}</span>` : "")
      + jockeyTag(r, h) + `<span class="nv" data-u="${h.umaban}">${naviTag(r, h.umaban)}</span>`;
    return `<tr data-u="${h.umaban}"><td class="mk">${h.mark && h.mark !== "×" ? h.mark : ""}</td>
      <td class="num">${h.umaban}</td>
      <td class="nm"><b>${esc(ho.name)}</b> <span class="muted">${esc(h.style || "")}</span><br>${tags}</td>
      <td class="sc num">${h.p3 != null ? Math.round(h.p3 * 100) + "%" : h.score}</td>
      <td class="odds num"><span class="oc">${oddsCell(ho, win)}</span></td></tr>`;
  }).join("");
  return `<div style="overflow-x:auto;padding:0 8px"><table class="hs"><thead><tr><th></th><th>番</th><th>馬 / 減点・加点</th>
    <th style="text-align:right;white-space:nowrap">${p.model ? "3着内" : "評価"}</th><th class="odds">人気</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------------------------------------------------------------- 収支・分析
const GROUPS = [["判定","verdict"],["芝/ダート","surface"],["距離","dist"],["頭数","field"],
                ["馬場","baba"],["◎と○の差","g12"],["展開","pace"],["競馬場","venue"]];
const PERIODS = [["7","7日"],["30","30日"],["month","今月"],["year","今年"],["lastyear","去年"],["all","全期間"]];

function periodRange() {
  const ds = (state.hist?.days || []).map(d => d.date).sort();
  if (!ds.length) return ["", ""];
  const last = ds[ds.length - 1];
  if (state.period === "all") return [ds[0], last];
  if (state.period === "month") return [last.slice(0, 6) + "01", last];
  if (state.period === "year") return [last.slice(0, 4) + "0101", last];
  if (state.period === "lastyear" && !hasLastYear()) state.period = "year";
  if (state.period === "year") return [last.slice(0, 4) + "0101", last];
  if (state.period === "lastyear") { const y = String(+last.slice(0, 4) - 1); return [y + "0101", y + "1231"]; }
  const t = toDate(last); t.setDate(t.getDate() - (+state.period - 1));
  return [dstr(t), last];
}
function hasLastYear() {
  const ds = (state.hist?.days || []).map(d => d.date).sort();
  return ds.length > 0 && ds[0].slice(0, 4) < ds[ds.length - 1].slice(0, 4);
}
const srcOk = s => state.src === "all" || s === state.src;
const centerOk = c => state.mcenter === "all" || c === state.mcenter;

// 累積収支のグラフ。pts: [{date, g, m, cg, cm}] 日付順(g = 割安ワイド、m = モデルの買い目。その日の収支と累積)。
// 2本とも同じ円の軸。色は --s1(割安ワイド)・--s2(モデル)。上の凡例と、なぞったときの数字で見分けられる
function cumChart(pts) {
  if (pts.length < 2) return "";
  const W = 600, H = 200, L = 52, R = 10, T = 10, B = 24;
  const vals = pts.flatMap(p => [p.cg, p.cm]);
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), span = hi - lo || 1;
  const x = i => L + (W - L - R) * i / (pts.length - 1);
  const y = v => T + (H - T - B) * (hi - v) / span;
  // 線は、その買い方の成績がある最初の日から引く(モデルの買い目は2024年から)
  const path = (k, has) => { const i0 = Math.max(0, pts.findIndex(p => p[has])), q = pts.slice(i0);
    return q.map((p, i) => `${i ? "L" : "M"}${x(i0 + i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(""); };
  const ticks = [...new Set([hi, 0, lo])].filter(v => v === 0 || Math.abs(y(v) - y(0)) >= 16);     // 0 の目盛りと重なるものは出さない
  const last = pts[pts.length - 1];
  const md = d => `${d.slice(2, 4)}/${+d.slice(4, 6)}/${+d.slice(6)}`;
  return `<div class="lgd"><span><i style="background:var(--s1)"></i>割安ワイド <b class="num">${yen(last.cg)}</b></span>
      <span><i style="background:var(--s2)"></i>モデルの買い目 <b class="num">${yen(last.cm)}</b></span></div>
    <div class="chart" id="cum">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="累積収支の推移(下の表と同じ数字)">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "var(--line2)" : "var(--line)"}" stroke-width="1" ${v === 0 ? 'stroke-dasharray="4 3"' : ""} vector-effect="non-scaling-stroke"/>
        <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${yenK(v)}</text>`).join("")}
      <text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${md(pts[0].date)}</text>
      <text x="${W - R}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${md(last.date)}</text>
      <path d="${path("cm", "hm")}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <path d="${path("cg", "hg")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <line id="cx" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
      <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="hit"/>
    </svg>
    <div class="dot" id="cdot1" style="background:var(--s1)"></div><div class="dot" id="cdot2" style="background:var(--s2)"></div>
    <div class="tip" id="ctip"></div></div>`;
}
function wireChart(pts) {
  const box = $("#cum"); if (!box) return;
  const svg = box.querySelector("svg"), tip = $("#ctip"), d1 = $("#cdot1"), d2 = $("#cdot2"), cx = $("#cx");
  const W = 600, H = 200, L = 52, R = 10, T = 10, B = 24;
  const vals = pts.flatMap(p => [p.cg, p.cm]);
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), span = hi - lo || 1;
  const show = ev => {
    const rc = svg.getBoundingClientRect(), bx = box.getBoundingClientRect();
    const vx = (ev.clientX - rc.left) / rc.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((vx - L) / (W - L - R) * (pts.length - 1))));
    const p = pts[i], px = L + (W - L - R) * i / (pts.length - 1);
    const sx = px / W * rc.width + (rc.left - bx.left);
    const sy = v => (T + (H - T - B) * (hi - v) / span) / H * rc.height + (rc.top - bx.top);
    cx.setAttribute("x1", px); cx.setAttribute("x2", px); cx.setAttribute("visibility", "visible");
    for (const [dot, v] of [[d1, p.cg], [d2, p.cm]]) { dot.style.display = "block"; dot.style.left = sx + "px"; dot.style.top = sy(v) + "px"; }
    tip.innerHTML = `${fmtD(p.date)}<br><i style="background:var(--s1)"></i>割安ワイド ${yen(p.g)} / 累積 <b>${yen(p.cg)}</b>
      <br><i style="background:var(--s2)"></i>モデル ${yen(p.m)} / 累積 <b>${yen(p.cm)}</b>`;
    tip.style.display = "block";
    const tw = tip.offsetWidth, bw = box.clientWidth;
    tip.style.left = Math.max(4, Math.min(bw - tw - 4, sx - tw / 2)) + "px";
    tip.style.top = Math.max(4, Math.min(sy(p.cg), sy(p.cm)) - tip.offsetHeight - 12) + "px";
  };
  const hide = () => { tip.style.display = "none"; d1.style.display = d2.style.display = "none"; cx.setAttribute("visibility", "hidden"); };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", hide);
}

function renderMoney() {
  const el = $("#v-money"), h = state.hist;
  if (KOCHI) {                       // 高知は予想だけ(買わない)なので収支は無い
    el.innerHTML = `<div class="empty">高知の最終レースは予想だけで、買う基準を付けていないので収支は出しません。<br>
      確かめた結果(どの買い方も100%に届かない)は「考え方」にあります。</div>`;
    return;
  }
  if (!h || !h.days || !h.days.length) { el.innerHTML = `<div class="empty">まだ成績がありません。</div>`; return; }
  const [from, to] = periodRange();
  const inP = d => d >= from && d <= to;
  const all = (h.races || []).filter(r => inP(r.date) && srcOk(r.src));
  const rs = all.filter(r => centerOk(r.center));
  const days = h.days.filter(d => inP(d.date));
  const S = rs.reduce((a, r) => a + r.stake, 0), R = rs.reduce((a, r) => a + r.ret, 0), hit = rs.filter(r => r.hit).length;
  const agg = (list, key) => {
    const o = {};
    for (const r of list) { const k = key(r), x = o[k] = o[k] || {n: 0, hit: 0, stake: 0, ret: 0};
      x.n++; x.hit += r.hit ? 1 : 0; x.stake += r.stake; x.ret += r.ret; }
    return Object.entries(o).sort((a, b) => b[1].n - a[1].n);
  };
  const grow = (rows, label) => `<table class="tbl"><thead><tr><th>${label}</th><th>R</th><th>的中</th><th>投資</th><th>回収率</th></tr></thead><tbody>
    ${rows.map(([k, x]) => `<tr><td>${esc(k)}</td><td>${x.n}</td><td>${pct(x.hit, x.n)}</td><td>${yen(x.stake)}</td>
      <td class="${x.ret >= x.stake ? "good" : "neg"}"><b>${pct(x.ret, x.stake)}</b></td></tr>`).join("")}</tbody></table>`;
  // 券種別
  const bt = {};
  for (const r of rs) for (const [k, v] of Object.entries(r.bets || {})) {
    const x = bt[k] = bt[k] || {n: 0, hit: 0, stake: 0, ret: 0}; x.n++; x.stake += v[0]; x.ret += v[1]; x.hit += v[2] ? 1 : 0; }
  // 日ごと(累積グラフ・カレンダー・日別の表)
  const byDay = {};
  for (const r of rs) { const x = byDay[r.date] = byDay[r.date] || {n: 0, hit: 0, stake: 0, ret: 0}; x.n++; x.hit += r.hit ? 1 : 0; x.stake += r.stake; x.ret += r.ret; }
  let cum = 0;
  const pts = Object.keys(byDay).sort().map(d => { const pl = byDay[d].ret - byDay[d].stake; cum += pl; return {date: d, pl, cum}; });
  // 印・負けパターン
  const marks = {}, tags = {}, base = [0, 0];
  for (const d of days) for (const [key, sx] of Object.entries(d.stats || {})) {
    const [sname, cname] = key.split("|");          // 「出どころ|中央/地方」
    if (!srcOk(sname) || (state.mcenter !== "all" && cname !== state.mcenter)) continue;
    for (const [k0, v] of Object.entries(sx.marks)) {     // 昔の予想の ×(消し)は無印に入れる(今は × を付けない)
      const k = k0 === "×" ? "無" : k0, m = marks[k] = marks[k] || [0, 0, 0]; m[0] += v[0]; m[1] += v[1]; m[2] += v[2]; }
    for (const [k, v] of Object.entries(sx.tags)) { const t = tags[k] = tags[k] || [0, 0]; t[0] += v[0]; t[1] += v[1]; }
    base[0] += sx.base[0]; base[1] += sx.base[1];
  }
  const mk = ["◎","○","▲","△","☆","無"].filter(k => marks[k]).map(k => { const m = marks[k];
    return `<tr><td>${k === "無" ? "無印" : k}</td><td>${m[0]}</td><td>${pct(m[1], m[0])}</td><td><b>${pct(m[2], m[0])}</b></td></tr>`; }).join("");
  const br = base[1] / Math.max(base[0], 1);
  const tg = Object.entries(tags).filter(([, v]) => v[0] >= 5).sort((a, b) => a[1][1] / a[1][0] - b[1][1] / b[1][0]).slice(0, 20)
    .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v[0]}</td><td class="${v[1] / v[0] < br ? "neg" : "good"}"><b>${pct(v[1], v[0])}</b></td></tr>`).join("");
  state.moneyMonth = state.moneyMonth && state.moneyMonth >= from.slice(0, 6) && state.moneyMonth <= to.slice(0, 6) ? state.moneyMonth : to.slice(0, 6);
  const calStat = d => { const x = h.days.find(r => r.date === d); if (!x) return null; const b = byDay[d];
    const mc = state.mcenter;
    const races = mc === "all" ? x.races : (x.races_c || {})[mc] || 0;
    if (!races) return null;
    return {races, buy: mc === "all" ? x.buy : (x.buy_c || {})[mc] || 0, settled: b ? b.n : 0, pl: b ? b.ret - b.stake : 0}; };
  // 中央・地方の内訳(「すべて」のとき上に出す)
  const split = agg(all, r => r.center).sort((a, b) => a[0] < b[0] ? -1 : 1);
  const splitTbl = `<table class="tbl nw"><thead><tr><th></th><th>R</th><th>的中</th><th>収支</th><th>回収率</th></tr></thead><tbody>
    ${split.map(([k, x]) => `<tr class="link" tabindex="0" data-mc="${esc(k)}"><td><b>${esc(k)}</b></td><td>${x.n}</td><td>${pct(x.hit, x.n)}</td>
      <td class="${x.ret >= x.stake ? "good" : "neg"}">${yen(x.ret - x.stake)}</td>
      <td class="${x.ret >= x.stake ? "good" : "neg"}"><b>${pct(x.ret, x.stake)}</b></td></tr>`).join("")}</tbody></table>`;
  const srcs = [...new Set((h.races || []).map(r => r.src))];
  // 買い方をくらべる(同じ◎○を1点100円ずつ。払戻表にその券種が無いレースは数えない)
  const ALT = [["3連複", "3連複◎○▲(全部3連複なら)"], ["ワイド", "ワイド◎-○(全部ワイドなら)"], ["馬連", "馬連◎-○"],
               ["馬単", "馬単◎→○"], ["単勝", "単勝◎"]];
  const altRows = ALT.map(([k, label]) => {
    const xs = rs.filter(r => r.alt && r.alt[k] != null);
    const n = xs.length, ret = xs.reduce((a, r) => a + r.alt[k], 0), hitN = xs.filter(r => r.alt[k] > 0).length;
    return {k, label, n, hit: hitN, stake: n * h.unit, ret};
  });
  const altMissing = rs.filter(r => r.alt && r.alt["馬単"] == null).length;
  const altTbl = `<table class="tbl"><thead><tr><th>買い方</th><th>R</th><th>的中</th><th>収支</th><th>回収率</th></tr></thead><tbody>
    ${altRows.filter(x => x.n).map(x => `<tr><td>${x.k === "3連複" ? "<b>" + esc(x.label) + "</b>" : esc(x.label)}</td><td>${x.n}</td><td>${pct(x.hit, x.n)}</td>
      <td class="${x.ret >= x.stake ? "good" : "neg"}">${x.n ? yen(x.ret - x.stake) : "-"}</td>
      <td class="${x.ret >= x.stake ? "good" : "neg"}"><b>${pct(x.ret, x.stake)}</b></td></tr>`).join("")}</tbody></table>
    <p class="legendnote">買ったレースで、同じ◎○(3連複は▲も)を1点${h.unit}円ずつ買っていたら(実際の払戻で計算)。
      収支に入っているのは、そのとき実際に買った買い方(中央は2026-10-31から3連複◎○▲。▲が距離延長のレースはワイド◎-○。
      その前の当日の予想はワイド◎-○)。
      ${altMissing ? `馬単の払戻をまだ取っていないレース(${altMissing}R)は馬単に数えていない。` : ""}</p>`;

  // ---- 割安ワイド(history.json の gap。アプリに出している買い目 = 発走前のオッズがあればそれ、無ければ確定オッズで選んだもの)
  const G = h.gap || [];
  const gFrom = state.period === "all" && G.length && G[0][0] < from ? G[0][0] : from;     // 全期間は、割安ワイドのいちばん古い日から
  const gIn = G.filter(r => r[0] >= gFrom && r[0] <= to);
  const gDay = {};
  for (const r of gIn) gDay[r[0]] = {n: r[7] ?? r[1], hit: r[8] ?? r[2], ret: r[9] ?? r[3]};
  const gs = Object.values(gDay).reduce((a, x) => [a[0] + x.n, a[1] + x.hit, a[2] + x.ret], [0, 0, 0]);
  const gPre = G.reduce((a, r) => [a[0] + r[4], a[1] + r[5], a[2] + r[6]], [0, 0, 0]);
  // 日ごと(2つの買い方を並べる。グラフ・表・カレンダー)
  const dates = [...new Set([...Object.keys(gDay), ...Object.keys(byDay)])].sort();
  let cg = 0, cm = 0;
  const pts2 = dates.map(d => {
    const g = gDay[d] ? gDay[d].ret - gDay[d].n * 100 : 0, m = byDay[d] ? byDay[d].ret - byDay[d].stake : 0;
    cg += g; cm += m;
    return {date: d, g, m, cg, cm, hg: !!gDay[d], hm: !!byDay[d]};
  });
  // 期間が長ければ月ごと、短ければ日ごとの表
  const byMonth = dates.length > 45;
  const per = {};
  for (const d of dates) {
    const k = byMonth ? d.slice(0, 6) : d, x = per[k] = per[k] || {gn: 0, gst: 0, grt: 0, mn: 0, mst: 0, mrt: 0};
    if (gDay[d]) { x.gn += gDay[d].n; x.gst += gDay[d].n * 100; x.grt += gDay[d].ret; }
    if (byDay[d]) { x.mn += byDay[d].n; x.mst += byDay[d].stake; x.mrt += byDay[d].ret; }
  }
  const plc = (rt, st, n) => n ? `<td class="${rt >= st ? "good" : "neg"}"><b>${yen(rt - st)}</b></td>` : `<td class="muted">-</td>`;
  const perTbl = `<table class="tbl nw"><thead><tr><th>${byMonth ? "月" : "日"}</th><th>割安 R</th><th>割安 収支</th><th>モデル R</th><th>モデル 収支</th></tr></thead><tbody>
    ${Object.keys(per).sort().reverse().map(k => { const x = per[k];
      return `<tr ${byMonth ? "" : `class="link" tabindex="0" data-day="${k}"`}><td>${byMonth ? `${k.slice(0, 4)}/${+k.slice(4)}` : fmtD(k).slice(5)}</td>
        <td>${x.gn || "-"}</td>${plc(x.grt, x.gst, x.gn)}<td>${x.mn || "-"}</td>${plc(x.mrt, x.mst, x.mn)}</tr>`; }).join("")}</tbody></table>`;
  // 年ごと(期間に関係なく全部)
  const yrs = {};
  for (const r of G) { const x = yrs[r[0].slice(0, 4)] = yrs[r[0].slice(0, 4)] || {gn: 0, grt: 0, mn: 0, mst: 0, mrt: 0}; x.gn += r[7] ?? r[1]; x.grt += r[9] ?? r[3]; }
  for (const r of (h.races || [])) { const x = yrs[r.date.slice(0, 4)] = yrs[r.date.slice(0, 4)] || {gn: 0, grt: 0, mn: 0, mst: 0, mrt: 0}; x.mn++; x.mst += r.stake; x.mrt += r.ret; }
  const rc = (rt, st) => st ? `<td class="${rt >= st ? "good" : "neg"}"><b>${pct(rt, st)}</b></td>` : `<td class="muted">-</td>`;
  const yrTot = Object.values(yrs).reduce((a, x) => ({gn: a.gn + x.gn, grt: a.grt + x.grt, mn: a.mn + x.mn, mst: a.mst + x.mst, mrt: a.mrt + x.mrt}), {gn: 0, grt: 0, mn: 0, mst: 0, mrt: 0});
  const yrRow = (k, x, bold) => `<tr><td>${bold ? `<b>${k}</b>` : k}</td><td>${x.gn ? x.gn.toLocaleString() : "-"}</td>${rc(x.grt, x.gn * 100)}
    <td>${x.mn ? x.mn.toLocaleString() : "-"}</td>${rc(x.mrt, x.mst)}</tr>`;
  const yrTbl = `<table class="tbl nw"><thead><tr><th>年</th><th>割安 R</th><th>割安 回収率</th><th>モデル R</th><th>モデル 回収率</th></tr></thead><tbody>
    ${Object.keys(yrs).sort().map(k => yrRow(k, yrs[k])).join("")}${yrRow("全部", yrTot, true)}</tbody></table>`;
  const sumRow = (name, sub, n, hitN, st, rt) => `<div class="dsrow w"><div class="nm">${name}<small>${sub}</small></div>
    <div class="v"><b class="num">${n.toLocaleString()}</b><small>レース</small></div>
    <div class="v"><b class="num">${n ? pct(hitN, n) : "-"}</b><small>的中</small></div>
    <div class="v">${n ? `<span class="pl num ${rt >= st ? "good" : "neg"}">${yen(rt - st)}</span><small>回収率 ${pct(rt, st)}</small>`
      : `<span class="pl muted">-</span><small>なし</small>`}</div></div>`;
  const calStat2 = d => {
    const x = calStat(d), g = gDay[d];
    if (!x && !g) return null;
    const o = x || {races: 0, buy: 0, settled: 0, pl: 0};
    return {races: o.races, buy: o.buy + (g ? g.n : 0), settled: o.settled + (g ? g.n : 0), pl: o.pl + (g ? g.ret - g.n * 100 : 0)};
  };
  const open = state.mOpen = state.mOpen || {};
  const det = (key, title, body) => `<details class="more mdet" data-md="${key}" ${open[key] ? "open" : ""}><summary>${title}</summary><div class="mdin">${body}</div></details>`;

  el.innerHTML = `
    <div class="chips" role="group" aria-label="期間" style="margin-top:12px">
      ${PERIODS.filter(([k]) => k !== "lastyear" || hasLastYear()).map(([k, t]) => `<button class="chip" data-p="${k}" aria-pressed="${state.period === k}">${t}</button>`).join("")}
    </div>
    <div class="daysum">
      <div class="hd">${fmtD(gFrom)} 〜 ${fmtD(to)} の成績(1点${h.unit}円)</div>
      ${sumRow("割安ワイド", "確かめ中の買い方", gs[0], gs[1], gs[0] * 100, gs[2])}
      ${sumRow("モデルの買い目", "3連複 ◎-○-▲", rs.length, hit, S, R)}
      <div class="ft">割安ワイドは、過去の日は<b>確定オッズ</b>で選んだ場合の成績です(買う時点のオッズでは変わることがあります)。
        発走前のオッズで選んだ分(実際に買える形): ${gPre[0] ? `<b>${gPre[0]}R · 的中 ${gPre[1]} · 回収率 ${pct(gPre[2], gPre[0] * 100)}</b>` : "まだありません(2026-11-14 の開催からたまります)"}。
        モデルの買い目は2024年から(その日より前のレースだけで学んだモデルで再現)。</div>
    </div>
    ${pts2.length >= 2 ? `<div class="sec">累積収支</div>${cumChart(pts2)}<p class="legendnote">指でなぞると日ごとの数字が出ます。</p>` : ""}
    ${dates.length ? `<div class="sec">${byMonth ? "月ごと" : "日ごと"}の収支</div>${perTbl}
      ${byMonth ? "" : `<p class="legendnote">行を押すとその日のレースを開きます。</p>`}` : `<div class="empty">この期間の結果はまだありません。</div>`}
    <div class="sec">年ごとの回収率(全期間)</div>${yrTbl}
    <p class="legendnote">モデルの買い目は、買い方を選ぶのに使った2024〜2026年の成績です。選ぶのに使っていない2022・2023年に当てはめると 71% でした(「考え方」に説明)。</p>
    <div class="sec">カレンダー</div>
    <div id="mcal">${calendar(state.moneyMonth, calStat2, null, "calg2")}</div>
    <p class="legendnote">日付を押すとその日のレースを開きます。数字はその日の収支(2つの買い方の合計)。</p>
    <div class="sec">くわしく</div>
    <div class="card">
    ${det("model", "モデルの買い目の分析(券種・条件・印・負けパターン)", `
      ${srcs.length > 1 ? `<div class="chips" role="group" aria-label="予想の出どころ">
        ${[["all","すべて"],["live","当日の予想"],["backfill","再現"]].map(([k, t]) => `<button class="chip" data-s="${k}" aria-pressed="${state.src === k}">${t}</button>`).join("")}
      </div>` : ""}
      ${CENTERS.length > 1 ? `<div class="chips" role="group" aria-label="中央・地方">
        ${[["all","中央+地方"],["中央","中央"],["地方","地方"]].map(([k, t]) => `<button class="chip" data-mc="${k}" aria-pressed="${state.mcenter === k}">${t}</button>`).join("")}
      </div>` : ""}
      <p class="muted" style="font-size:12px;margin-bottom:8px">${fmtD(from)} 〜 ${fmtD(to)}${state.mcenter !== "all" ? " · " + state.mcenter + "のみ" : ""}${state.src !== "all" ? " · " + SRC[state.src] + "のみ" : ""}
        · ${rs.length}R · 的中 ${pct(hit, rs.length)} · 回収率 ${pct(R, S)}</p>
      ${state.mcenter === "all" && split.length > 1 ? `<div class="sec" style="margin-top:4px">中央・地方の内訳</div>${splitTbl}` : ""}
      ${rs.some(r => r.alt) ? `<div class="sec" style="margin-top:4px">買い方をくらべる(同じ◎○)</div>${altTbl}` : ""}
      ${rs.length ? `<div class="sec">券種別(役割ごと)</div>${grow(Object.entries(bt), "券種")}
      ${GROUPS.map(([t, k]) => `<div class="sec">${esc(t)}別</div>` + grow(agg(rs, r => r[k] ?? "?"), t)).join("")}` : `<p class="muted" style="font-size:13px">この期間に買ったレースの結果はまだありません。</p>`}
      <div class="sec">印の成績(見送りレースも含む)</div>
      <table class="tbl"><thead><tr><th>印</th><th>頭数</th><th>勝率</th><th>3着内</th></tr></thead><tbody>${mk || `<tr><td colspan="4" class="muted">結果が出ると表示されます</td></tr>`}</tbody></table>
      <div class="sec">負けパターン(減点理由ごとの3着内率)</div>
      <table class="tbl"><thead><tr><th>理由</th><th>頭数</th><th>3着内 (全体 ${pct(base[1], base[0])})</th></tr></thead><tbody>${tg || `<tr><td colspan="3" class="muted">5頭以上たまると出ます</td></tr>`}</tbody></table>
      <p class="legendnote">1点${h.unit}円で記録した買い目を、実際の払戻で計算。「再現」は過去の日を後から予想したもの(その月より前のレースだけで学んだモデル。人気は確定人気)。</p>`)}
    ${det("races", `モデルが買ったレース(新しい順 ${Math.min(rs.length, 150)}件)`, rs.length ? `
      <table class="tbl"><thead><tr><th>レース</th><th>判定</th><th>◎○</th><th>収支</th></tr></thead><tbody>
      ${rs.slice().reverse().slice(0, 150).map(r => `<tr class="link" tabindex="0" data-day="${r.date}" data-rid="${esc(r.id)}">
        <td>${+r.date.slice(4,6)}/${+r.date.slice(6)} ${esc(r.venue)}${r.rno}R${r.src === "backfill" ? ` <span class="tag o">再現</span>` : ""}</td>
        <td>${esc(r.verdict)}</td><td class="num">${r.hr ?? "-"}着 ${r.tr ?? "-"}着</td>
        <td class="${r.ret - r.stake >= 0 ? "good" : "neg"}"><b>${yen(r.ret - r.stake)}</b></td></tr>`).join("")}</tbody></table>
      <p class="legendnote">行を押すとそのレースを開きます。割安ワイドの買い目は、レースの画面で日付を選ぶと見られます。</p>` : `<p class="muted" style="font-size:13px">この期間に買ったレースはありません。</p>`)}
    </div>`;

  el.querySelectorAll("details[data-md]").forEach(dt => dt.ontoggle = () => { open[dt.dataset.md] = dt.open; });
  el.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { state.period = b.dataset.p; saveMoney(); renderMoney(); });
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { state.src = b.dataset.s; saveMoney(); renderMoney(); });
  el.querySelectorAll("[data-mc]").forEach(b => {
    const go = () => { state.mcenter = b.dataset.mc; saveMoney(); renderMoney(); };
    b.onclick = go; b.onkeydown = e => { if (e.key === "Enter") go(); };
  });
  const wireCal = () => {
    $("#mcal").querySelectorAll("[data-cm]").forEach(b => b.onclick = () => {
      if (!b.dataset.cm) return; state.moneyMonth = b.dataset.cm;
      $("#mcal").innerHTML = calendar(state.moneyMonth, calStat2, null, "calg2"); wireCal(); });
    $("#mcal").querySelectorAll("[data-day]").forEach(b => b.onclick = () => openDay(b.dataset.day));
  };
  wireCal();
  el.querySelectorAll("tr.link[data-day]").forEach(tr => {
    const go = () => openDay(tr.dataset.day, tr.dataset.rid);
    tr.onclick = go; tr.onkeydown = e => { if (e.key === "Enter") go(); };
  });
  wireChart(pts2);
}

async function modelBox() {
  let m = null;
  try { m = await getJSON(KOCHI ? "../keiba_model_kochi_meta.json" : "../keiba_model_meta.json"); } catch (e) { return; }
  const row = r => `<tr><td>${esc(r.label)}</td><td>${r.races}</td><td>${Math.round(r.hit * 100)}%</td>
    <td class="${r.roi >= 1 ? "good" : "neg"}"><b>${Math.round(r.roi * 100)}%</b></td></tr>`;
  const tbl = (name, rs) => `<div class="legendnote" style="margin-top:8px"><b>${esc(name)}</b></div>
    <table class="tbl"><thead><tr><th>選び方(買い方は${esc((rs[0] || {}).bet || "ワイド◎-○")}の1点)</th><th>R</th><th>的中</th><th>回収率</th></tr></thead>
    <tbody>${rs.map(row).join("")}</tbody></table>`;
  const el = document.getElementById("modelbox");
  if (el && KOCHI) {                   // 高知は予想だけなので、モデルの説明だけ
    el.innerHTML = `<ul class="rules">
      <li><b>何を出すか</b>各馬が3着以内に来る確率(LightGBM)。高知の${esc(m.data)}で学習(${esc(m.trained)})</li>
      <li><b>材料</b>中央と同じ(過去5走・タイム指数・出馬表・騎手と厩舎のそれまでの成績・30か条の評価)。そのレースのオッズは使わない</li>
      <li><b>確かめ方</b>2024年からの月ごとに、その月より前だけで学んだモデルで予想を作り直して確かめた(「再現」)</li>
    </ul>`;
    return;
  }
  if (!el) return;
  // 買う基準は中央・地方で別(古い形は両方同じ)
  const sels = m.select && m.select.nar ? m.select : {nar: m.select || {}, jra: m.select || {}};
  const chks = m.check_wf && m.check_wf.nar ? m.check_wf : (m.check_wf ? {nar: m.check_wf} : null);
  const pct = v => Math.round(v * 100);
  const selText = s => {
    const t = [];
    if (s.t1) t.push(`◎の確率${pct(s.t1)}%以上`);
    if (s.t2_max && s.t2_max <= 1) t.push(`○の確率${pct(s.t2)}〜${pct(s.t2_max)}%`);
    else if (s.t2) t.push(`○の確率${pct(s.t2)}%以上`);
    if (s.gap > 0) t.push(`3番手との差${pct(s.gap)}ポイント以上`);
    if (s.g12 > 0) t.push(`◎と○の差${pct(s.g12)}ポイント以上`);
    if (s.n_min) t.push(`${s.n_min}頭以上`);
    return t.join("・") + (s.a_p1 ? `(◎${pct(s.a_p1)}%以上はA)` : `(○${pct(s.t2 + 0.05)}%以上はA)`);
  };
  // 期間ごとの行のリスト(古い形は 選ぶ/確かめ/確かめ 市場)
  const chkRows = c => Array.isArray(c) ? c : [
      Object.assign({}, c["選ぶ"], {label: "2〜8月(基準を選んだ期間)"}),
      Object.assign({}, c["確かめ"], {label: "9月〜(基準を選ぶのに使っていない)"}),
      Object.assign({}, c["確かめ 市場"], {label: "9月〜 同じレースで1・2番人気"})];
  const chkTbl = (name, c) => c ? tbl(`${name}: 月ごとに、その月より前だけで学んだモデルで確かめた成績`, chkRows(c)) : "";
  const nModels = (m.models || []).length;
  // 中央の月ごとの成績の合計(参考の「同じレースで人気」の行は除く)
  const wfSum = (() => {
    const rs = chks && chks.jra ? chkRows(chks.jra).filter(r => r && r.races && !/参考|人気/.test(r.label || "")) : [];
    const n = rs.reduce((a, r) => a + r.races, 0), st = rs.reduce((a, r) => a + (r.stake || 0), 0);
    return n && st ? {races: n, roi: rs.reduce((a, r) => a + (r.ret || 0), 0) / st, hit: rs.reduce((a, r) => a + r.hit * r.races, 0) / n} : null;
  })();
  el.innerHTML = `
    <ul class="rules">
      <li><b>何を出すか</b>各馬が3着以内に来る確率(LightGBM)。${esc(m.data)}で学習(${esc(m.trained)})。${nModels > 1
        ? `乱数の種を変えた${nModels}本のモデルの平均(1本だと学び直すたびに買うレースが1/4ほど入れ替わるので、平均して安定させる)` : ""}</li>
      <li><b>材料</b>過去5走(着差・着順・クラス・通過順・上がり・その時の人気)、
        馬場差で補正した走破タイムと上がり3Fの指数(場ごとの目盛りのずれも補正)、出馬表(枠・斤量・馬体重・性齢)、
        前走と同じ場か、騎手・厩舎のそれまでの3着内率、コース傾向、30か条の評価(能力・加減点・軸不可・負け要因の重なり)。
        そのレースのオッズは使わない(規則20)。${(m.centers || []).join() === "jra" ? "中央のレースだけで学ぶ" : "今のモデルは地方のレースも混ぜて学んだもの(中央だけで学び直す予定)"}</li>
      <li><b>◎○</b>軸にできる馬(延長などでない。規則15)のうち確率の上位2頭。相手は残りの上位2頭</li>
      <li><b>買うレース</b>${selText(sels.jra)}。○も強いと人気どおりで配当が安いので、◎と○が近いレースは見送る。
        基準に入らなければ見送り</li>
      <li><b>買い方</b>3連複◎-○-▲の1点(1レース100円。▲は◎○の次に確率が高い馬)。▲が距離延長(軸不可)ならワイド◎-○の1点</li>
      <li><b>過去の成績</b>2024〜2026年の月ごとの確率(その月より前だけで学んだモデル${nModels > 1 ? `${nModels}本の平均` : ""})で${
        wfSum ? ` ${wfSum.races}R・回収率 ${pct(wfSum.roi)}%・的中 ${pct(wfSum.hit)}%` : ""}(期間ごとは下の表)。
        前の買い方(ワイド◎-○だけ)は同じ期間で 94%前後。
        <br><b>これからは 85〜95% くらいと見ておく(100%を超える根拠は無い)</b>: 上の成績は、買い方を選ぶのに使った 2024〜2026年のもの。
        選ぶのに使っていない 2022・2023年に同じ買い方を当てはめると 71%(367R)で、5年を同じやり方でそろえると 56・83・106・128・96%、全体 95%。
        モデルが知っていることは、ワイドや3連複のオッズにもう入っている(モデルの確率を足しても、オッズだけより当たらない)。
        1点100円で遊べる範囲で
        <br>どれも効いている理由がある: 人気だけで1〜3番人気の3連複を買うと 78%前後なのに、モデルの◎○▲が人気と違うと 127%
        (3頭目までの組み合わせに意味がある)/ 延長の▲は確率ほど来ない(3連複 77%・ワイド 100%)/
        ◎と○の差15%未満は人気どおりで 57%。ただし、どれも 2024〜2026年の成績から見つけたもので、2022・2023年では続いていない</li>
      <li><b>追切評価</b>中央の馬の札に、<a href="https://horse-racing-ai-navi.com/ai-keiba-yosou" class="ext" target="_blank" rel="noopener">AI競馬ナビ</a>の追切評価(S〜D)・
        追い切り偏差値・最終追い切りの場所とコースを出す(アプリだけ。開いたときにその場で取る)。予想には使っていない。
        2026年7〜10月の中央では、追切Sの馬の3着内は41%(このモデルの見込み29%)、Aは33%(27%)、Dは16%(19%)と、
        モデルの見込みより差がついた。ただし単勝オッズにはほぼ織り込まれていて、混ぜてもワイド◎-○の回収率が良くなるとは確かめられなかった</li>
    </ul>
    ${chks ? chkTbl("中央", chks.jra)
      : (m.check && m.check["試験"] ? tbl("試験期間(9月〜。学習にも基準にも使っていない)", m.check["試験"]) : "")}
    <p class="legendnote">市場=同じレースで人気上位(3連複は1〜3番人気、ワイドは1・2番人気。確定オッズ。実際にはレース前に分からない参考値)。
      今の基準と買い方(2026-10-31 から)は、2024・2025年で選んで2026年で確かめたもの。買うのは週に4レースくらい。
      週に1回、新しい結果で学び直す。</p>`;
}

// ---------------------------------------------------------------- 投票
// 自分で買うときの買い目の一覧と、買った記録(自動では買わない)。記録はこの端末のブラウザにだけ残る
const VOTE_KEY = "keiba-votes";
const IPAT_URL = "https://www.ipat.jra.go.jp/";
// IPAT の画面つきのアプリ(2026-11-11 からの版)か。古い版(オッズを取るだけ)やブラウザでは「IPATで入力」を出さない
const canBuy = () => !!(window.KeibaApp && typeof window.KeibaApp.buy === "function");
// 「IPATで入力」のボタン(発走前だけ)。押すと、アプリが IPAT の画面を金額入力まで進める(金額・投票は自分で)
function buyBtn(r, type, c, unit) {
  const d = state.day && state.day.date;
  if (!canBuy() || !d || r.result || (untilClose(d, r) ?? 1) <= 0) return "";
  const t = {type, method: "通常", sel: c, axis: null};
  return `<button class="btn sm on" data-buy="${esc(JSON.stringify({text: betText(d, r, type, c, unit || 100), bet: ipatBet(d, r, t)}))}">IPATで入力</button>`;
}
const loadVotes = () => { try { return JSON.parse(store.get(VOTE_KEY) || "{}") || {}; } catch (e) { return {}; } };
const saveVotes = v => store.set(VOTE_KEY, JSON.stringify(v));
const ORDERED_T = ["馬単", "3連単"];
const voteId = (rid, type, c) => `${rid}|${type}|${c.join("-")}`;
const comboText = (type, c) => c.join(ORDERED_T.includes(type) ? "→" : "-");
const betText = (d, r, type, c, unit) =>
  `${+d.slice(4, 6)}/${+d.slice(6, 8)} ${r.venue}${r.rno}R ${type} ${comboText(type, c)} ${unit}円`;
// 締切(発走2分前)までの分。時刻は日本時間で数える
function untilClose(d, r) {
  if (!r.start) return null;
  const t = Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), +r.start.slice(0, 2) - 9, +r.start.slice(3, 5) - 2);
  return Math.floor((t - Date.now()) / 60000);
}
// 払戻(結果が出ていなければ null、外れは 0)
function voteRet(r, type, c, unit) {
  const pay = r && r.result && r.result.payout;
  if (!pay) return null;
  if (!pay[type]) return null;                 // 払戻表にその券種が無い(古いデータは複勝・枠連が無い)
  const key = ORDERED_T.includes(type) ? c.join("-") : [...c].sort((a, b) => a - b).join("-");
  return (pay[type][key] || 0) * unit / 100;
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); } catch (e2) { /* 無視 */ } ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = "コピーした"; setTimeout(() => { btn.textContent = o; }, 1200); }
}
async function voteGo(step) {
  const i = state.days.indexOf(state.day?.date) + step;
  if (i < 0 || i >= state.days.length) return;
  try { state.day = await loadDay(state.days[i]); } catch (e) { return; }
  renderRace(); renderVote(); scrollTo(0, 0);
}
function renderVote() {
  const el = $("#v-vote"), d = state.day;
  if (!el) return;
  if (!d) { el.innerHTML = `<div class="empty">まだデータがありません。</div>`; return; }
  const votes = loadVotes(), tickets = loadTickets();
  const items = [];
  for (const r of races()) {
    const p = r.pred;
    if (p.verdict !== "見送り") for (const b of p.bets) for (const c of b.combos)
      items.push({r, type: b.type, c, unit: b.unit, verdict: p.verdict, id: voteId(r.id, b.type, c)});
    // 割安ワイド(確かめ中)。モデルの買い目と同じ組なら1つにまとめる
    const g = gapOf(r);
    if (g && g.buy && !g.void && !items.some(x => x.id === voteId(r.id, "ワイド", g.pair)))
      items.push({r, type: "ワイド", c: g.pair, unit: 100, verdict: "割安", id: voteId(r.id, "ワイド", g.pair)});
  }
  // 自分で作った買い目(予想に無いレース・券種も)
  for (const t of Object.values(tickets)) {
    const r = (d.races || {})[t.rid];
    if (t.d === d.date && r) items.push({r, t, type: t.type, unit: t.unit, id: t.id, cs: expand(t)});
  }
  // 買った印があるのに今の買い目に無いもの(印を付けたあとで予想が変わった)も出す
  for (const [id, v] of Object.entries(votes)) {
    if (v.d !== d.date || v.t || items.some(x => x.id === id)) continue;
    const r = (d.races || {})[v.rid];
    if (r) items.push({r, type: v.type, c: v.combo, unit: v.unit, verdict: "", id, old: true});
  }
  items.sort((a, b) => (a.r.start || "99").localeCompare(b.r.start || "99") || a.r.id.localeCompare(b.r.id) || !!a.t - !!b.t);
  const bought = x => x.t ? x.cs.length > 0 && x.cs.every(c => votes[tKey(x.t, c)]) : !!votes[x.id];
  const retOf = x => {
    if (!x.t) return voteRet(x.r, x.type, x.c, x.unit);
    const rs = x.cs.map(c => voteRet(x.r, x.type, c, x.unit));
    return rs.some(v => v == null) ? null : rs.reduce((a, v) => a + v, 0);
  };
  const textOf = x => x.t ? ticketText(d.date, x.r, x.t) : betText(d.date, x.r, x.type, x.c, x.unit);
  const betOf = x => ipatBet(d.date, x.r, x.t || {type: x.type, method: "通常", sel: x.c, axis: null});
  const closed = x => !!x.r.result || (untilClose(d.date, x.r) ?? 1) <= 0;
  const open = items.filter(x => !x.old && !closed(x));
  // この日の「買った」(予想の買い目も自分の買い目も)
  const mine = Object.values(votes).filter(v => v.d === d.date);
  const mineSet = mine.map(v => ({v, ret: voteRet((d.races || {})[v.rid], v.type, v.combo, v.unit)})).filter(z => z.ret != null);
  const mSt = mineSet.reduce((a, z) => a + z.v.unit, 0), mRt = mineSet.reduce((a, z) => a + z.ret, 0);
  const nPts = items.filter(x => !x.old).reduce((a, x) => a + (x.t ? x.cs.length : 1), 0);
  const i = state.days.indexOf(d.date);
  const status = x => {
    const ret = retOf(x);
    if (ret != null) return ret > 0 ? `<b class="good">的中 ${yen(ret)}</b>` : `<span class="neg">外れ</span>`;
    const m = untilClose(d.date, x.r);
    if (m == null) return "発走時刻まだ";
    if (m <= 0) return "締切済み・結果待ち";
    return m >= 120 ? `締切 ${esc(x.r.start ? (() => { const t = +x.r.start.slice(0, 2) * 60 + +x.r.start.slice(3, 5) - 2;
      return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); })() : "")}` : `<b>締切まで ${m}分</b>`;
  };
  const rows = items.map((x, n) => {
    const v = bought(x), done = closed(x);
    const tag = x.t ? `<span class="tag o">自分で</span>`
      : x.verdict ? `<span class="badge ${x.verdict === "割安" ? "A" : x.verdict}" style="display:inline-grid;min-width:22px;height:20px;font-size:12px;border-radius:6px;vertical-align:1px;padding:0 5px">${x.verdict}</span>` : "";
    const what = x.t ? `${esc(x.type)}${x.t.method !== "通常" ? " " + esc(x.t.method) : ""} <b>${esc(selText(x.t))}</b>
        ${x.cs.length > 1 ? `${x.cs.length}点×${x.unit}円` : x.unit + "円"}`
      : `${esc(x.type)} <b>${esc(comboText(x.type, x.c))}</b> ${x.unit}円`;
    const mk = (!done && !x.old && !v ? `<button class="lnk" data-mi="${n}">${x.t ? "直す" : "ほかの買い方"} ›</button>` : "")
      + (x.t && !v ? `<button class="lnk" data-del="${esc(x.id)}">消す</button>` : "");
    return `<div class="vrow ${done && !v ? "done" : ""}">
      <div class="when">${esc(x.r.start || "")}</div>
      <div class="what"><a class="go" href="#d=${esc(d.date)}&r=${esc(x.r.id)}" data-go="${esc(x.r.id)}">
        <div class="l1">${esc(x.r.venue)} ${x.r.rno}R ${tag}</div>
        <div class="l2">${what}</div></a>
        <div class="st">${status(x)}${x.old ? " · 予想が変わったので今の買い目には無い" : ""}${mk}</div></div>
      <div class="act">
        ${!done && canBuy() ? `<button class="btn sm on" data-buy="${esc(JSON.stringify({text: textOf(x), bet: betOf(x)}))}">IPATで入力</button>` : ""}
        ${!done ? `<button class="btn sm" data-copy="${esc(textOf(x))}">コピー</button>` : ""}
        <button class="btn sm ${v ? "on" : ""}" data-vote="${esc(x.id)}" aria-pressed="${v ? "true" : "false"}">${v ? "買った ✓" : "買った"}</button>
      </div></div>`;
  }).join("");
  el.innerHTML = `
    <div class="datenav">
      <button id="vprev" aria-label="前の日" ${i <= 0 ? "disabled" : ""}>◀</button>
      <div class="d">${fmtD(d.date)}</div>
      <button id="vnext" aria-label="次の日" ${i < 0 || i >= state.days.length - 1 ? "disabled" : ""}>▶</button>
    </div>
    <div class="sum">
      <div class="tile"><div class="k">買い目</div><div class="v num">${nPts}点</div></div>
      <div class="tile"><div class="k">買った</div><div class="v num">${mine.length}点</div></div>
      <div class="tile"><div class="k">${mineSet.length ? "自分の収支 " + pct(mRt, mSt) : "自分の収支"}</div>
        <div class="v num ${mineSet.length ? (mRt >= mSt ? "good" : "neg") : ""}">${mineSet.length ? yen(mRt - mSt) : "-"}</div></div>
    </div>
    <div class="vtools">
      <button class="btn on" id="vmake">買い目を作る</button>
      ${open.length ? `<button class="btn" id="vcopyall">発走前の${open.length}件をまとめてコピー</button>` : ""}
      <a class="btn" href="${IPAT_URL}" target="_blank" rel="noopener" id="vipat">${canBuy() ? "IPATを開く" : "即PAT・A-PATを開く"}</a>
    </div>
    ${items.length ? `<div class="vlist">${rows}</div>` : `<div class="empty">この日に買うレースはありません。<br>「買い目を作る」で、見送りのレースや好きな券種も買えます。</div>`}
    <p class="legendnote">買い目は予想の更新(発走まで)で変わることがあります。自分で買ったら「買った」を押すと、結果が出たあと自分の収支に入ります。
      「買い目を作る」で、予想に無いレース・券種(単勝〜3連単、ボックス・ながし・フォーメーション)も入れられます。
      締切は発走2分前の目安。記録はこの端末${window.KeibaApp ? "(アプリ)" : "のブラウザ"}にだけ残ります(自動では買いません)。
      ${canBuy() ? "「IPATで入力」はIPATの画面を金額入力まで自動で進めます(2頭以上の券種はIPATのフォーメーションで入れ、金額入力の画面で馬番と組数を確かめます)。金額・セット・投票は自分で入れてください。"
        : window.KeibaApp ? "このアプリは古い版です。新しい版を入れると「IPATで入力」が使えます(「考え方」のいちばん下)。" : ""}</p>
    <div class="sec">自分の収支(この端末で「買った」にしたもの)</div>
    <div id="mytotal" class="muted" style="font-size:13px">集計中…</div>`;
  $("#vprev").onclick = () => voteGo(-1);
  $("#vnext").onclick = () => voteGo(1);
  $("#vmake").onclick = () => openBuilder({});
  const all = $("#vcopyall");
  if (all) all.onclick = () => copyText(open.map(textOf).join("\n"), all);
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(b.dataset.copy, b));
  // Androidアプリの中では、IPATの画面を金額入力まで進める(アプリが KeibaApp を用意する)
  el.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => window.KeibaApp.buy(b.dataset.buy));
  if (canBuy()) $("#vipat").onclick = e => { e.preventDefault(); window.KeibaApp.openIpat(); };
  el.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); openDay(d.date, a.dataset.go); });
  el.querySelectorAll("[data-mi]").forEach(b => b.onclick = () => {
    const x = items[+b.dataset.mi];
    if (x.t) openBuilder({rid: x.r.id, type: x.t.type, method: x.t.method, sel: x.t.sel, axis: x.t.axis, cols: x.t.cols, unit: x.t.unit, edit: x.t.id});
    else openBuilder({rid: x.r.id, type: x.type, sel: x.c});
  });
  el.querySelectorAll("[data-vote]").forEach(b => b.onclick = () => {
    const vs = loadVotes(), id = b.dataset.vote, x = items.find(z => z.id === id);
    if (!x) return;
    if (x.t) markTicket(vs, x.t, !bought(x));
    else if (vs[id]) delete vs[id];
    else vs[id] = {d: d.date, rid: x.r.id, type: x.type, combo: x.c, unit: x.unit, at: new Date().toISOString()};
    saveVotes(vs); renderVote();
  });
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const ts = loadTickets();
    delete ts[b.dataset.del];
    saveTickets(ts); renderVote();

// 全部の日の「買った」の収支。結果のある日だけ数える
async function myTotal(votes) {

  for (const d of ds) {
    let day = null;

    for (const v of byDay[d]) {
      const ret = voteRet(day && (day.races || {})[v.rid], v.type, v.combo, v.unit);
      if (ret == null) { wait++; continue; }

  box.innerHTML = n ? `<table class="tbl"><tbody>
      <tr><td>買った</td><td>${n}点${wait ? `(結果待ち ${wait}点)` : ""}</td></tr>
      <tr><td>的中</td><td>${hit}点(${pct(hit, n)})</td></tr>
      <tr><td>投資 / 払戻</td><td>${yen(st)} / ${yen(rt)}</td></tr>
      <tr><td>収支</td><td class="${rt >= st ? "good" : "neg"}"><b>${yen(rt - st)}(${pct(rt, st)})</b></td></tr></tbody></table>`

}

// 馬番 -> [単勝オッズ, 人気]。発売前は空。netkeiba の API(JSON)→ 単勝オッズのページ の順に試す(keiba.py の fetch_odds と同じ)
async function liveOdds(rid) {
  const out = {};
  try {
    const j = JSON.parse(await appFetch("https://race.netkeiba.com/api/api_get_jra_odds.html?pid=api_get_jra_odds&input=UTF-8" +
      "&output=json&race_id=" + rid + "&type=1&action=init&compress=0"));
    for (const [k, v] of Object.entries(((j.data || {}).odds || {})["1"] || {})) {
      const od = parseFloat(v[0]), nk = parseInt(v[2], 10);
      if (od > 0) out[+k] = [od, nk || null];
    }
  } catch (e) { /* 次の方法で */ }
  if (!Object.keys(out).length) {
    try {
      const doc = new DOMParser().parseFromString(await appFetch("https://race.netkeiba.com/odds/odds_get_form.html?type=b1&race_id=" + rid), "text/html");
      for (const tr of doc.querySelectorAll("tr")) {
        let um = null, nk = null, od = null;
        const tds = [...tr.querySelectorAll("td")], tx = td => td.textContent.trim().normalize("NFKC");
        for (const td of tds) {                  // 馬番は馬名の前にある最後の数字の列
          if (td.classList.contains("Horse_Name")) break;
          if (td.classList.contains("Ninki")) nk = parseInt(tx(td), 10) || null;
          else if (/^\d{1,2}$/.test(tx(td))) um = +tx(td);
        }
        for (const td of tds) {
          if (td.classList.contains("Odds") && /^\d+\.\d$/.test(tx(td))) od = parseFloat(tx(td));
          else if (td.classList.contains("Ninki") || td.classList.contains("Popular_Ninki")) nk = parseInt(tx(td), 10) || nk;
        }
        if (um && od) out[um] = [od, nk];
      }
    } catch (e) { /* 取れなかった */ }
  }
  const us = Object.keys(out).map(Number);          // 人気が無ければオッズの低い順
  if (us.length && !us.every(u => out[u][1])) us.sort((a, b) => out[a][0] - out[b][0]).forEach((u, i) => { out[u][1] = i + 1; });
  return out;
}
// ワイドのオッズ "小さい馬番-大きい馬番" -> [下限, 上限](keiba.py の parse_wide_odds と同じ)
async function liveWide(rid) {
  const j = JSON.parse(await appFetch("https://race.netkeiba.com/api/api_get_jra_odds.html?pid=api_get_jra_odds&input=UTF-8" +

// 3連複のオッズ "小さい順-…" -> オッズ(keiba.py の parse_trio_odds と同じ)。pair があればその2頭を含む組だけ
async function liveTrio(rid, pair) {

// ---------------------------------------------------------------- 期待値(単勝・ワイド)
// 期待値 = 当たる確率 × オッズ(100円買って平均いくら戻るか ÷ 100)。1を超えれば、続けて買うと得になる見込み。
// 1着の確率は、単勝オッズから出る市場の確率 q と、モデルの3着内の確率 p3 を混ぜる: P ∝ q^a × (p3/(1-p3))^b。
// ワイドは1着の確率から Harville で2頭とも3着内に入る確率(2着・3着は確率を g 乗して平らにする)。
// a・b・g は2024・2025年で決め、2026年で確率が実際の割合に合うことを確かめた(tools/experiments/ev_fit.py)。
// モデルの重さ b はとても小さく、ほぼ市場の確率になる(モデルは単勝オッズ以上の情報をほとんど持っていない)
const EVP = {a: 1.0, b: 0.04, g: 0.7};
// ワイドは、上の Harville の確率と、ワイドのオッズが表す確率(1/オッズの中央 をレースで合計3に揃える)を混ぜる:
// logit P = c + h × logit(Harville) + m × logit(ワイドの市場)。2022〜2025年の確定オッズで決め、2026年で確かめた
// (tools/experiments/ev_wide_fit.py)。Harville だけだと、ワイドのオッズとずれた組で期待値を高く見すぎる
const EVW = {c: 0.182, h: 0.327, m: 0.742};
const logit = v => { const p = Math.min(Math.max(v, 1e-5), 1 - 1e-5); return Math.log(p / (1 - p)); };
// "小さい馬番-大きい馬番" -> ワイドが当たる確率(ワイドのオッズが無ければ null)
function wideProbs(r, win) {
  const wo = r.wide_odds || r.wide_final;
  if (!win || !wo) return null;
  const P = widePairs(win), ks = Object.keys(wo).filter(k => P[k] && wo[k][0] > 1);   // 1.0倍以下は取消の返還
  if (!ks.length) return null;
  const mk = {};
  let tot = 0;
  for (const k of ks) { mk[k] = 2 / (wo[k][0] + wo[k][1]); tot += mk[k]; }
  const out = {};
  for (const k of ks) out[k] = 1 / (1 + Math.exp(-(EVW.c + EVW.h * logit(P[k]) + EVW.m * logit(mk[k] * 3 / tot))));
  return out;
}
function evProbs(r) {
  const p3 = {};
  for (const h of (r.pred || {}).horses || []) if (h.p3 != null) p3[h.umaban] = h.p3;
  const hs = (r.horses || []).filter(h => !h.scratched && h.odds > 1);
  if (hs.length < 5) return null;
  const inv = hs.reduce((a, h) => a + 1 / h.odds, 0);
  const z = hs.map(h => {
    const q = 1 / h.odds / inv, p = Math.min(Math.max(p3[h.umaban] ?? 0.5, 1e-3), 0.99);
    return Math.pow(q, EVP.a) * Math.pow(p / (1 - p), EVP.b);
  });
  const s = z.reduce((a, v) => a + v, 0), win = {};
  hs.forEach((h, i) => { win[h.umaban] = z[i] / s; });
  return win;
}
// "小さい馬番-大きい馬番" -> 2頭とも3着内に入る確率
function widePairs(win) {
  const us = Object.keys(win).map(Number), p = us.map(u => win[u]), g = p.map(v => Math.pow(v, EVP.g));
  const G = g.reduce((a, v) => a + v, 0), n = us.length, P = {};
  const add = (a, b, v) => { const k = Math.min(us[a], us[b]) + "-" + Math.max(us[a], us[b]); P[k] = (P[k] || 0) + v; };
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if (j === i) continue;
    const pij = p[i] * g[j] / (G - g[i]);
    for (let k = 0; k < n; k++) {
      if (k === i || k === j) continue;
      const v = pij * g[k] / (G - g[i] - g[j]);
      add(i, j, v); add(i, k, v); add(j, k, v);
    }
  }
  return P;
}
const pctS = v => (v * 100).toFixed(v < 0.1 ? 1 : 0) + "%";
const evRange = (p, o) => o[0] === o[1] ? (p * o[0]).toFixed(2) : `${(p * o[0]).toFixed(2)}〜${(p * o[1]).toFixed(2)}`;
function evInner(r) {
  const win = evProbs(r);
  if (!win) return `<div class="muted">単勝のオッズがまだありません(発売前)。</div>`;
  const pr = r.pred || {}, nm = u => esc(hname(r, u));
  const tans = Object.keys(win).map(Number).map(u => ({u, p: win[u], o: r.horses.find(h => h.umaban === u).odds}))
    .map(x => Object.assign(x, {ev: x.p * x.o})).sort((a, b) => b.p - a.p);
  const tRows = tans.slice(0, 4).map(x => `<tr class="${x.u === pr.honmei ? "mk" : ""}"><td>${x.u} ${nm(x.u)}${x.u === pr.honmei ? " ◎" : ""}</td>
    <td>${pctS(x.p)}</td><td>${x.o}</td><td class="${evCls(x.ev)}">${x.ev.toFixed(2)}</td></tr>`).join("");
  let wHtml = `<div class="muted" style="margin-top:6px">ワイドのオッズはまだ取っていません(次のオッズの更新で取ります)。</div>`;
  const wo = r.wide_odds || r.wide_final;          // 発走前の最後のオッズ / 無ければ確定オッズ
  const P = wideProbs(r, win);
  if (P) {
    const hk = pr.honmei && pr.taikou ? [pr.honmei, pr.taikou].sort((a, b) => a - b).join("-") : "";
    const ws = Object.keys(P).map(k => ({k, p: P[k], o: wo[k], ev: P[k] * wo[k][0]}))
      .sort((a, b) => b.p - a.p);
    const show = ws.slice(0, 6);
    if (hk && !show.some(x => x.k === hk)) { const x = ws.find(x => x.k === hk); if (x) show.push(x); }
    wHtml = `<table class="evtbl"><thead><tr><th>ワイド(当たりやすい順)</th><th>確率</th><th>オッズ</th><th>期待値</th></tr></thead><tbody>
      ${show.map(x => `<tr class="${x.k === hk ? "mk" : ""}"><td>${esc(x.k)}${x.k === hk ? " ◎-○" : ""}</td><td>${pctS(x.p)}</td>
        <td>${x.o[0] === x.o[1] ? x.o[0] : x.o[0] + "〜" + x.o[1]}</td><td class="${evCls(x.ev)}">${evRange(x.p, x.o)}</td></tr>`).join("")}</tbody></table>`;
  }
  return `<table class="evtbl"><thead><tr><th>単勝(当たりやすい順)</th><th>確率</th><th>オッズ</th><th>期待値</th></tr></thead>
    <tbody>${tRows}</tbody></table>${wHtml}
    <div class="muted" style="margin-top:6px">期待値 = 当たる確率 × オッズ。1を超えれば続けて買うと得になる見込み(緑)。
      単勝の確率はほぼ単勝オッズから(モデルは少しだけ)、ワイドの確率は単勝から出した確率とワイドのオッズを混ぜたもの。
      2022〜2026年の確定オッズで確かめると、期待値1を超えた単勝の馬・ワイドの組はほとんど無く、超えた組も得になっていない。
      ワイドの期待値はオッズの幅(下限〜上限)で出す。</div>`;
}
function evBox(r) {
  if (!r.horses || !r.horses.some(h => h.odds)) return "";
  return `<details class="more cbox"><summary>期待値(単勝・ワイド)</summary><div class="note evin" style="padding-top:2px">${evInner(r)}</div></details>`;
}

// 割安ワイドの買い目の並び(オッズを取り直して変わったら、一覧を作り直す)
const gapSig = () => allRaces().map(r => { const g = gapOf(r); return g && g.buy ? r.id + ":" + g.key : ""; }).join(",");
async function refreshOdds(manual) {
  if (!canLive() || oddsState.busy || !state.day) return;
  const d = state.day;
  const todo = allRaces().filter(r => r.horses && r.horses.length && !r.result && (untilClose(d.date, r) ?? 1) > -2);
  if (!todo.length) {
    if (manual) { const el = $("#oddsbar span"); if (el) el.textContent = "発走前のレースがありません"; }
    return;
  }
  oddsState.busy = true; drawOddsBar();
  const sig0 = gapSig();
  let ok = 0, ng = 0;
  const q = todo.slice();
  await Promise.all([0, 1, 2, 3].map(async () => {          // 4つずつ並べて取る
    while (q.length) {
      const r = q.shift();
      const o = await liveOdds(r.id).catch(() => ({}));
      if (!Object.keys(o).length) { ng++; continue; }
      ok++;
      for (const h of r.horses) if (o[h.umaban]) { h.odds = o[h.umaban][0]; h.ninki = o[h.umaban][1]; }
      const w = await liveWide(r.id).catch(() => ({}));
      if (Object.keys(w).length) {
        if (r.trio_pair && !r.gw) r.gw = r.wide_odds;      // サーバーが同じ時刻に取った組を、割安ワイド用に残しておく
        r.wide_odds = w;
      }
      // 3連複の全部の組(割安ワイド用の組ごとの強さ)。締切まで90分以内のレースと、モデルが買うレース(買い目のオッズ)だけ
      const p = r.pred || {}, ab = ["A", "B"].includes(p.verdict) && p.honmei && p.taikou;
      if (ab || (untilClose(d.date, r) ?? 999) <= 90) {
        const ta = await liveTrio(r.id).catch(() => ({}));
        if (Object.keys(ta).length) {
          const tp = trioPairSums(ta);
          if (Object.keys(tp).length && Object.keys(w).length) { r.trio_pair = tp; r.gw = w; }
          if (ab) {
            const t3 = Object.fromEntries(Object.entries(ta).filter(([k]) => { const us = k.split("-").map(Number); return us.includes(p.honmei) && us.includes(p.taikou); }));
            if (Object.keys(t3).length) r.trio_odds = t3;
          }
        }
      }
      updateOddsDom(r);
    }
  }));
  if (gapSig() !== sig0) drawList();          // 割安ワイドの買い目が変わった
  drawDaySum();
  Object.assign(oddsState, {at: Date.now(), day: d.date, busy: false, ok, ng});
  drawOddsBar();
}

const NAVI = "https://horse-racing-ai-navi.com/jra/", NAVI_FROM = "20260718";     // 過去のページはこの日から
const naviData = {};    // race id -> 馬番 -> [評価, 偏差値, 場所とコース, 自己ベスト(4Fが2本以上の中で1番)]

async function naviFetch(d, v) {

  if (!el) throw new Error("HTTP 404");

  for (const rc of (JSON.parse(el.textContent).venue || {}).races || []) {

      hs[+h.umaban] = [h.training_bunrui || "", h.training_deviation ?? null, (f.place || "") + (f.course || ""),
